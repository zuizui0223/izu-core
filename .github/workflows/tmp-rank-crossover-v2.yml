name: tmp-rank-crossover-v2

on:
  push:
    branches: [analysis/trait-adjustment-system-size-rank-crossover]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m scripts.audit_trait_adjustment_system_size_rank_crossover --out data/results/chapter2_trait_adjustment_system_size_rank_crossover_v2_20260910.json
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-trait-adjustment-system-size-rank-crossover-audit-v2-fast
          path: data/results/chapter2_trait_adjustment_system_size_rank_crossover_v2_20260910.json
          if-no-files-found: error
