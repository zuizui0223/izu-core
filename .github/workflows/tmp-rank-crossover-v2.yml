name: tmp-rank-crossover-v2

on:
  push:
    branches: [analysis/trait-adjustment-system-size-rank-crossover]

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        copies: [1, 2, 4, 8, 16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m scripts.audit_trait_adjustment_system_size_rank_crossover_scale --copies ${{ matrix.copies }} --out data/results/rank_crossover_k${{ matrix.copies }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: rank-crossover-k${{ matrix.copies }}
          path: data/results/rank_crossover_k${{ matrix.copies }}.json
          if-no-files-found: error
