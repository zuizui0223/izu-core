name: Chapter 2 timed self viability original result archive once
on:
  push:
    branches:
      - chapter2/timed-self-viability-inconclusive-archive-20261010
    paths:
      - data/dispatch/timed-self-result-original-archive-launch-20261010.txt
permissions:
  contents: write
  actions: read
jobs:
  original-result-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact original successful independent biological run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          s=$(gh api "repos/$REPO/actions/runs/37944527799")
          test "$(echo "$s" | jq -r .head_sha)" = "e679e0ee190fa02e0a9d60876cd1a3e9987a4c79"
          test "$(echo "$s" | jq -r .status)" = "completed"
          test "$(echo "$s" | jq -r .conclusion)" = "success"
      - uses: actions/download-artifact@v4
        with:
          name: chapter2-timed-self-viability-64-history-full-readout
          path: original-machine-readout
          run-id: 37944527799
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve JSON exact original bytes and preregistered result label
        run: |
          set -euo pipefail
          mkdir -p results/chapter2
          cp original-machine-readout/chapter2-timed-self-viability-final-20261009.json \
            results/chapter2/timed_self_viability_independent_readout_20261009.json
          echo "42d90c17cef4be1643b987428d3a6367ba09dee6594055ae2d2b693ccb190a01  results/chapter2/timed_self_viability_independent_readout_20261009.json" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/chapter2/timed_self_viability_independent_readout_20261009.json")
          d=json.loads(p.read_text())
          assert d["primary_verdict"] == "inconclusive"
          assert d["n_future_cells"] == 229376
          assert d["n_independent_visitor_histories"] == 64
          PY
      - name: Run immutable result regression checks
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_chapter2_timed_self_viability_full_result_archive.py
      - name: Commit exact original result to archival review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/chapter2/timed_self_viability_independent_readout_20261009.json
          git commit -m "Archive untouched complete 64-history timed seed-viability machine result"
          git push origin "HEAD:${{ github.ref_name }}"
