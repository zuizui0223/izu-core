name: Chapter 2 K vs B old-history biological smoke (one-time)
on:
  push:
    branches:
      - chapter2/kb-oldhistory-pilot-production-20261009
    paths:
      - data/dispatch/kb-oldhistory-smoke-launch-20261009.txt
permissions:
  contents: read
jobs:
  real-stochastic-old-history-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate full canonical ledger parity and K/B separation
        run: python -m pytest -q tests/test_chapter2_kb_reproduction.py
      - name: Actually execute eight 80-update biological future trajectories using ALREADY-EXPOSED history
        run: |
          python -m scripts.chapter2_kb_old_history_pilot \
            --out results-pilot/chapter2-kb-oldhistory-smoke-20261009.json \
            --execute-old-history-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-kb-8x80update-oldhistory-smoke-20261009
          path: results-pilot/
          if-no-files-found: error
          retention-days: 90
