name: One-time Chapter 2 post-outcome absolute-effect analysis
on:
  push:
    branches: [chapter2/posthoc-absolute-vs-did-20261009]
    paths:
      - .github/workflows/one-time-chapter2-absolute-posthoc.yml

permissions:
  actions: read
  contents: write

jobs:
  audit-existing-futures:
    if: github.event.head_commit.message == 'ops-chapter2-run-existing-absolute-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify purely synthetic analysis logic without simulating visitors
        run: pytest -q tests/test_chapter2_order_absolute_posthoc.py
      - name: Retrieve EXACTLY the completed independent full-cohort future archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p outputs/independent-futures
          gh run download 37862121201 --repo "${{ github.repository }}" \
            --pattern 'budget-window-post-shard-*' --dir outputs/independent-futures
          python - <<'PY'
          from pathlib import Path
          root=Path('outputs/independent-futures')
          names=sorted(x.name for x in root.glob('budget-window-post-shard-*') if x.is_dir())
          expected=sorted(f'budget-window-post-shard-{i}' for i in range(64))
          assert names==expected, f'Incomplete archived future shards: {len(names)}'
          print(f'All {len(names)} independent future shard archives downloaded.')
          PY
      - name: Audit 2048 complete sources and 57344 branches, run paired 64-history bootstrap
        run: |
          python -m scripts.chapter2_order_absolute_posthoc \
            --post-dir outputs/independent-futures \
            --out results/chapter2/order_absolute_posthoc_exploratory_20261009.json
      - name: Persist exploratory result with explicit non-confirmatory label
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/chapter2/order_absolute_posthoc_exploratory_20261009.json
          git diff --cached --quiet && exit 0
          git commit -m 'results(chapter2): archive exploratory paired absolute and DID effects'
          git push origin HEAD:chapter2/posthoc-absolute-vs-did-20261009
