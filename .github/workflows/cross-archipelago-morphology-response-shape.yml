name: Cross-archipelago morphology response-shape audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_cross_archipelago_morphology_response_shape.py"
      - "tests/test_cross_archipelago_morphology_response_shape.py"
      - "data/results/cross_archipelago_morphology_response_shape_summary.json"
      - "data/results/southwest_pacific_pairs/analysis_summary.json"
      - "data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json"
      - "data/results/hendriks_2019/flower_area_reconstruction_summary.json"
      - ".github/workflows/cross-archipelago-morphology-response-shape.yml"
  pull_request:
    paths:
      - "scripts/audit_cross_archipelago_morphology_response_shape.py"
      - "tests/test_cross_archipelago_morphology_response_shape.py"
      - "data/results/cross_archipelago_morphology_response_shape_summary.json"
      - "data/results/southwest_pacific_pairs/analysis_summary.json"
      - "data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json"
      - "data/results/hendriks_2019/flower_area_reconstruction_summary.json"
      - ".github/workflows/cross-archipelago-morphology-response-shape.yml"

permissions:
  contents: write

jobs:
  response-shape-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Run response-shape audit tests
        run: python -m pytest -q tests/test_cross_archipelago_morphology_response_shape.py
      - name: Regenerate checked audit
        run: >-
          python scripts/audit_cross_archipelago_morphology_response_shape.py
          --southwest-summary data/results/southwest_pacific_pairs/analysis_summary.json
          --southwest-coupling data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json
          --hendriks-summary data/results/hendriks_2019/flower_area_reconstruction_summary.json
          --output artifacts/cross_archipelago_morphology/response_shape_summary.json
      - name: Audit checked-output freshness
        run: |
          if test -f data/results/cross_archipelago_morphology_response_shape_summary.json; then
            diff -u data/results/cross_archipelago_morphology_response_shape_summary.json \
                    artifacts/cross_archipelago_morphology/response_shape_summary.json \
              || echo "::notice::Checked response-shape summary is stale and will be rematerialized on push/manual runs."
          else
            echo "::notice::Checked response-shape summary is not materialized yet."
          fi
      - name: Materialize checked audit on push or manual run
        if: github.event_name != 'pull_request'
        run: |
          cp artifacts/cross_archipelago_morphology/response_shape_summary.json \
             data/results/cross_archipelago_morphology_response_shape_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/cross_archipelago_morphology_response_shape_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize morphology response-shape audit"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-archipelago-morphology-response-shape
          path: artifacts/cross_archipelago_morphology/
          if-no-files-found: error
