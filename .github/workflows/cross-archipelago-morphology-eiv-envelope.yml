name: Cross-archipelago morphology EIV envelope

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_cross_archipelago_morphology_eiv_envelope.py"
      - "tests/test_cross_archipelago_morphology_eiv_envelope.py"
      - "tests/test_cross_archipelago_morphology_reliability_identifiability.py"
      - "data/results/cross_archipelago_morphology_response_shape_summary.json"
      - "data/results/cross_archipelago_morphology_eiv_envelope_summary.json"
      - "data/results/cross_archipelago_morphology_eiv_envelope.csv"
      - "data/results/cross_archipelago_morphology_reliability_identifiability.json"
      - ".github/workflows/cross-archipelago-morphology-eiv-envelope.yml"
  pull_request:
    paths:
      - "scripts/audit_cross_archipelago_morphology_eiv_envelope.py"
      - "tests/test_cross_archipelago_morphology_eiv_envelope.py"
      - "tests/test_cross_archipelago_morphology_reliability_identifiability.py"
      - "data/results/cross_archipelago_morphology_response_shape_summary.json"
      - "data/results/cross_archipelago_morphology_eiv_envelope_summary.json"
      - "data/results/cross_archipelago_morphology_eiv_envelope.csv"
      - "data/results/cross_archipelago_morphology_reliability_identifiability.json"
      - ".github/workflows/cross-archipelago-morphology-eiv-envelope.yml"

permissions:
  contents: write

jobs:
  eiv-envelope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Run EIV and empirical-reliability gate tests
        run: >-
          python -m pytest -q
          tests/test_cross_archipelago_morphology_eiv_envelope.py
          tests/test_cross_archipelago_morphology_reliability_identifiability.py
      - name: Regenerate checked envelope
        run: >-
          python scripts/audit_cross_archipelago_morphology_eiv_envelope.py
          --response-shape-summary data/results/cross_archipelago_morphology_response_shape_summary.json
          --summary-output artifacts/cross_archipelago_morphology_eiv/summary.json
          --csv-output artifacts/cross_archipelago_morphology_eiv/scenarios.csv
      - name: Copy empirical-reliability identifiability state into audit artifact
        run: >-
          cp data/results/cross_archipelago_morphology_reliability_identifiability.json
          artifacts/cross_archipelago_morphology_eiv/reliability_identifiability.json
      - name: Audit checked-output freshness
        run: |
          if test -f data/results/cross_archipelago_morphology_eiv_envelope_summary.json \
             && test -f data/results/cross_archipelago_morphology_eiv_envelope.csv; then
            diff -u data/results/cross_archipelago_morphology_eiv_envelope_summary.json \
                    artifacts/cross_archipelago_morphology_eiv/summary.json \
              || echo "::notice::Checked EIV summary is stale and will be rematerialized on push/manual runs."
            diff -u data/results/cross_archipelago_morphology_eiv_envelope.csv \
                    artifacts/cross_archipelago_morphology_eiv/scenarios.csv \
              || echo "::notice::Checked EIV scenario table is stale and will be rematerialized on push/manual runs."
          else
            echo "::notice::Checked EIV outputs are not materialized yet."
          fi
      - name: Materialize checked envelope on push or manual run
        if: github.event_name != 'pull_request'
        run: |
          cp artifacts/cross_archipelago_morphology_eiv/summary.json \
             data/results/cross_archipelago_morphology_eiv_envelope_summary.json
          cp artifacts/cross_archipelago_morphology_eiv/scenarios.csv \
             data/results/cross_archipelago_morphology_eiv_envelope.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/cross_archipelago_morphology_eiv_envelope_summary.json \
                  data/results/cross_archipelago_morphology_eiv_envelope.csv
          if ! git diff --cached --quiet; then
            git commit -m "Materialize morphology EIV envelope"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-archipelago-morphology-eiv-envelope
          path: artifacts/cross_archipelago_morphology_eiv/
          if-no-files-found: error
