# One-time operations bridge: dispatch ONLY the historic, non-prospective cost preflight.
# Never authorizes full_cohort. Can be removed after the dispatch attempt.
name: One-time Chapter 2 OLD-history preflight dispatch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-chapter2-old-history-preflight-dispatch.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch-old-history-only:
    if: ${{ github.event.head_commit.message == 'ops(chapter2): launch OLD-history preflight-only audit' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reviewed Chapter 2 OLD-history preflight (no new cohort)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/dispatch.json
          import json, os
          print(json.dumps({
            "ref": "main",
            "inputs": {
              "mode": "preflight_only",
              "full_cohort_launch_approved": "false",
              "source_commit_sha": os.environ["SOURCE_SHA"]
            }
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/chapter2-order-expression-cohort.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
          echo "Dispatched preflight_only on main at $SOURCE_SHA (full cohort disabled)."
