name: Antillean fourth-stratum recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/acquire_antillean_hummingbird_networks.py'
      - 'data/design/lesser_antilles_global_sample_candidate_gate.json'
      - '.github/workflows/antillean_global_stratum_recovery.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover Dryad Antillean matrices
        run: python scripts/acquire_antillean_hummingbird_networks.py
      - name: Show gate
        run: cat data/results/antillean_hummingbird_network_source_gate.json
      - name: Upload gate and raw archive
        uses: actions/upload-artifact@v4
        with:
          name: antillean-fourth-stratum-recovery
          path: |
            data/results/antillean_hummingbird_network_source_gate.json
            data/external/antillean_hummingbird/Data_and_code.zip
          if-no-files-found: warn
