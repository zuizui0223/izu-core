name: Canary-Balearic external source audit

on:
  workflow_dispatch:
  push:
    paths:
      - "config/canary_balearic_oup_source.json"
      - "scripts/acquire_oup_supplementary_data.py"
      - "scripts/acquire_oup_supplementary_data_v2.py"
      - "scripts/audit_canary_balearic_network_source.py"
      - "tests/test_oup_supplementary_acquisition.py"
      - "tests/test_canary_balearic_network_source.py"
      - ".github/workflows/canary-balearic-external-source.yml"
  pull_request:
    paths:
      - "config/canary_balearic_oup_source.json"
      - "scripts/acquire_oup_supplementary_data.py"
      - "scripts/acquire_oup_supplementary_data_v2.py"
      - "scripts/audit_canary_balearic_network_source.py"
      - "tests/test_oup_supplementary_acquisition.py"
      - "tests/test_canary_balearic_network_source.py"
      - ".github/workflows/canary-balearic-external-source.yml"

jobs:
  acquire-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-audit dependencies
        run: python -m pip install -e . openpyxl python-docx pytest
      - name: Test source-discovery and schema guards
        run: >-
          python -m pytest -q
          tests/test_oup_supplementary_acquisition.py
          tests/test_canary_balearic_network_source.py
      - name: Discover and acquire public supplementary files
        id: acquire
        continue-on-error: true
        run: >-
          python scripts/acquire_oup_supplementary_data_v2.py
          --config config/canary_balearic_oup_source.json
          --output-dir artifacts/canary_balearic_oup
      - name: Audit acquired tabular sources
        if: steps.acquire.outcome == 'success'
        run: >-
          python scripts/audit_canary_balearic_network_source.py
          --input-dir artifacts/canary_balearic_oup
          --output artifacts/canary_balearic_oup/schema_audit.json
      - name: Preserve a machine-readable blocked state when acquisition fails
        if: steps.acquire.outcome != 'success'
        run: |
          mkdir -p artifacts/canary_balearic_oup
          if ! test -f artifacts/canary_balearic_oup/acquisition_failure.json; then
            cat > artifacts/canary_balearic_oup/acquisition_failure.json <<'JSON'
          {
            "status": "supplementary_acquisition_blocked",
            "source_id": "castro_urgal_traveset_2014_canary_balearic_networks",
            "article_doi": "10.1111/boj.12134",
            "next_gate": "Recover source supplementary files through a lawful public, institutional, repository, author-supplied, or user-supplied route.",
            "claim_boundary": "No network or geological-origin result is inferred from a failed source acquisition."
          }
          JSON
          fi
          echo "::notice::Canary-Balearic supplementary acquisition is blocked in this run; this is not a biological zero."
      - name: Upload source and schema audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-balearic-external-source-audit
          path: artifacts/canary_balearic_oup/
          if-no-files-found: error
