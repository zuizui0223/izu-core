name: Chapter 2 postzygotic factorial
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        default: preflight_only
        options:
          - preflight_only
          - full_cohort
      full_cohort_launch_approved:
        required: true
        type: boolean
        default: false
      source_commit_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: postzygotic-factorial-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.mode == 'preflight_only' || (inputs.mode == 'full_cohort' && inputs.full_cohort_launch_approved == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Require exact reviewed main source
        env:
          REVIEWED_SHA: ${{ inputs.source_commit_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          test "$REVIEWED_SHA" = "$CHECKED_OUT_SHA"
          test "$GITHUB_REF" = 'refs/heads/main'
      - name: Old-history parity, synthesis and no-peek future plan
        run: |
          pytest -q tests/test_chapter2_postzygotic_viability_gate.py tests/test_chapter2_postzygotic_factorial_run.py
          python -m scripts.chapter2_postzygotic_factorial_run --mode plan --out outputs/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: postzygotic-plan-only
          path: outputs/plan.json
          retention-days: 90
          if-no-files-found: error
