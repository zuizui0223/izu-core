name: Workflow trigger migration (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-trigger-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Convert historical workflows to manual-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          keep = {'ci.yml', 'chapter2-scientific-gate.yml', 'workflow-trigger-migration.yml'}

          def trigger_bounds(lines):
              for i, line in enumerate(lines):
                  if line.startswith(('on:', "'on':", '"on":')):
                      start = i
                      break
              else:
                  raise RuntimeError('missing top-level on: block')
              stripped = lines[start].split(':', 1)[1].strip()
              if stripped:
                  return start, start + 1
              end = start + 1
              while end < len(lines):
                  line = lines[end]
                  if line.strip() and not line.startswith((' ', '\t', '#')):
                      break
                  end += 1
              return start, end

          def manual_dispatch_block(lines, start, end):
              block = lines[start + 1:end]
              for i, line in enumerate(block):
                  if re.match(r'^  workflow_dispatch\s*:', line):
                      captured = [line]
                      j = i + 1
                      while j < len(block):
                          nxt = block[j]
                          if re.match(r'^  [A-Za-z0-9_-]+\s*:', nxt):
                              break
                          captured.append(nxt)
                          j += 1
                      return ['on:\n', *captured]
              return ['on:\n', '  workflow_dispatch:\n']

          changed = []
          for path in sorted([*root.glob('*.yml'), *root.glob('*.yaml')]):
              if path.name in keep:
                  continue
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              start, end = trigger_bounds(lines)
              replacement = manual_dispatch_block(lines, start, end)
              new_text = ''.join(lines[:start] + replacement + lines[end:])
              old_text = ''.join(lines)
              if new_text != old_text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(path.name)

          print(f'converted {len(changed)} workflows to manual-only')
          PY
      - name: Remove one-shot migration workflow from captured tree
        run: rm .github/workflows/workflow-trigger-migration.yml
      - name: Verify trigger policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          keep = {'ci.yml', 'chapter2-scientific-gate.yml'}

          def trigger_block(path):
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if line.startswith(('on:', "'on':", '"on":')):
                      start = i
                      break
              else:
                  raise AssertionError(f'{path}: missing top-level on:')
              if lines[start].split(':', 1)[1].strip():
                  return [lines[start]]
              end = start + 1
              while end < len(lines):
                  line = lines[end]
                  if line.strip() and not line.startswith((' ', '\t', '#')):
                      break
                  end += 1
              return lines[start:end]

          def events(block):
              if len(block) == 1 and block[0].split(':', 1)[1].strip():
                  return set(re.findall(r'\b(?:push|pull_request|workflow_dispatch|schedule|workflow_call)\b', block[0]))
              found = set()
              for line in block[1:]:
                  match = re.match(r'^  ([A-Za-z0-9_-]+)\s*:', line)
                  if match:
                      found.add(match.group(1))
              return found

          workflows = sorted([*root.glob('*.yml'), *root.glob('*.yaml')])
          for path in workflows:
              ev = events(trigger_block(path))
              if path.name in keep:
                  assert 'pull_request' in ev, (path, ev)
              else:
                  assert ev == {'workflow_dispatch'}, (path, ev)
          print(f'verified {len(workflows)} workflow trigger definitions')
          PY
          git diff --check
      - name: Package transformed workflow tree
        shell: bash
        run: |
          mkdir -p migration-output
          tar -czf migration-output/workflows.tgz .github/workflows
          git diff -- .github/workflows > migration-output/workflows.patch
          find .github/workflows -maxdepth 1 -type f -print | sort > migration-output/workflow-files.txt
      - name: Upload transformed workflow tree
        uses: actions/upload-artifact@v4
        with:
          name: workflow-trigger-migration-output
          path: migration-output
          if-no-files-found: error
