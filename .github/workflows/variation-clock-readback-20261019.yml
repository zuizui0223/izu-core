name: Stored variation clock readback
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: variation-clock-${{ github.ref }}
  cancel-in-progress: false
jobs:
  readback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Required only to READ existing draft release assets; no publication commands.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 pytest==8.4.2
      - name: Synthetic-array tests (no biological simulator)
        run: python -m pytest tests/test_variation_clock_readback_20261019.py -q
      - name: Download unchanged admitted records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir source-assets seed-assets
          gh release download q3-confirm160-f7792629b35b07e93ac9c98f8feb4d3894da85eb --pattern 'raw-shard-*.zip' --pattern 'seal-*.json' --pattern 'hashes-*.txt' --pattern SUMMARY160.json --dir source-assets
          gh release download readaptation-e6617838-20261019 --pattern readaptation-checkpoint-1.zip --dir seed-assets
      - name: Read stored genotypes and compare paired histories
        run: python scripts/variation_clock_readback_20261019.py --source source-assets --output variation-clock --seed-archive seed-assets/readaptation-checkpoint-1.zip
      - name: Retain complete or partial readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stored-variation-clock-${{ github.run_id }}
          path: variation-clock/
          if-no-files-found: warn
          retention-days: 90
