name: ABM v6 local support prevalidation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/run_constraint_mechanism_abm_v6_local_support.py'
      - 'scripts/prevalidate_abm_v6_local_support.py'
      - 'scripts/run_constraint_mechanism_abm_v5_hierarchical_context.py'
      - 'scripts/run_abm_v4_weighted_architecture_emulator.py'
      - 'data/results/abm_v4_global_continuous_isolation_gradient.json'
      - 'tests/test_abm_v6_local_support.py'
      - '.github/workflows/abm_v6_local_support_prevalidation.yml'

jobs:
  prevalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Freeze v6 mechanism contract
        run: python scripts/run_constraint_mechanism_abm_v6_local_support.py
      - name: Run synthetic prevalidation
        run: python scripts/prevalidate_abm_v6_local_support.py
      - name: Enforce synthetic decision
        run: python -c "import json,sys; x=json.load(open('data/results/abm_v6_local_support_prevalidation.json')); print(x['decision'], x['tests']); sys.exit(0 if x['decision']=='v6_preserves_v4_v5_invariants_and_opens_local_support_branching' and x['empirical_inputs_loaded']==[] and x['menorca_values_loaded'] is False else 1)"
      - name: Run focused invariant tests
        run: python -m pytest -q tests/test_abm_v6_local_support.py
      - uses: actions/upload-artifact@v4
        with:
          name: abm-v6-local-support-prevalidation
          path: |
            data/results/constraint_mechanism_abm_v6_local_support.json
            data/results/abm_v6_local_support_prevalidation.json
