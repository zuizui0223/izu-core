name: Chapter 2 island genetic-state transplant independent16 replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: island-genetic-transplant16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_chapter2_island_genetic_state_transplant.py
      - run: |
          python -m scripts.run_chapter2_island_genetic_state_transplant_independent16 \
            --out outputs/island-genetic-transplant16 --shard-index 0 \
            --shard-count 8 --dry-run

  paired-shards:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: |
          python -m scripts.run_chapter2_island_genetic_state_transplant_independent16 \
            --out outputs/island-genetic-transplant16 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: island-genetic-transplant16-shard-${{ matrix.shard }}
          retention-days: 90
          if-no-files-found: error
          path: outputs/island-genetic-transplant16/*

  readout:
    needs: paired-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: island-genetic-transplant16-shard-*
          merge-multiple: true
          path: outputs/island-genetic-transplant16
      - run: |
          python -m scripts.summarize_chapter2_island_genetic_state_transplant_independent16 \
            --input outputs/island-genetic-transplant16 \
            --out outputs/island-genetic-transplant16/independent_readout.json
      - name: Require original failed primary gate and all setting readouts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          observed=json.loads(Path("outputs/island-genetic-transplant16/independent_readout.json").read_text())
          recorded=json.loads(Path("data/results/chapter2_island_genetic_state_transplant_independent16_20261008.json").read_text())
          primary=observed["primary"]; frozen=recorded["frozen_primary"]
          assert observed["genetic_states"]==512
          assert observed["poststress_trajectories"]==2048
          assert primary["passes_frozen_rule"] is False
          assert frozen["passed"] is False
          assert abs(primary["mean"]-frozen["mean"])<1e-12
          assert all(abs(x-y)<1e-12 for x,y in zip(primary["bootstrap95"],frozen["bootstrap95"]))
          assert len(observed["secondary"])==32
          for row in observed["secondary"]:
              if row["outcome"] not in ("viable_maternal","occupied"):
                  continue
              prior=next(r for r in recorded["secondary_by_setting_and_background"]
                         if r["setting"]==row["setting"] and
                            r["recipient_background"]==row["background"])
              name="terminal_occupancy" if row["outcome"]=="occupied" else "viable_maternal"
              for locus,key in (("I","investment_effect"),("A","assurance_effect")):
                  old=prior[name][key]
                  new=row["effects"][locus]
                  assert abs(old["mean"]-new["mean"])<2e-6
                  assert all(abs(x-y)<2e-6 for x,y in zip(old["bootstrap95"],new["bootstrap95"]))
          print("original failed main gate and full numerical effects preserved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: island-genetic-transplant16-verified
          retention-days: 90
          if-no-files-found: error
          path: outputs/island-genetic-transplant16/independent_readout.json
