name: ABM v8 Cabrera validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/design/abm_v8_cabrera_validation_v1.json'
      - 'scripts/audit_cabrera_2025_reconstruction_structure.py'
      - 'scripts/run_abm_v8_cabrera_validation.py'
      - 'tests/test_cabrera_2025_reconstruction_structure.py'
      - 'tests/test_cabrera_2025_validation_freeze.py'
      - 'tests/test_abm_v8_cabrera_validation.py'
      - 'scripts/run_constraint_mechanism_abm_v8_pair_support.py'
      - 'scripts/run_constraint_mechanism_abm_v6_local_support.py'
      - 'scripts/run_constraint_mechanism_abm_v5_hierarchical_context.py'
      - '.github/workflows/abm_v8_cabrera_validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Re-audit checksum-locked Cabrera structure before targets
        run: python scripts/audit_cabrera_2025_reconstruction_structure.py
      - name: Enforce frozen pre-target reconstruction
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/cabrera_2025_reconstruction_structure.json'))
          d=json.load(open('data/design/abm_v8_cabrera_validation_v1.json'))
          assert x['target_metrics_calculated'] is False
          assert x['network_matrices_built'] is False
          assert d['chronology']['cabrera_target_metrics_calculated_before_freeze'] is False
          assert d['chronology']['network_matrices_built_before_freeze'] is False
          observed={tuple(row) for row in x['method_structure']['obs']['community_x_visit_context_keys']}
          locked={tuple(row) for row in d['source_native_reconstruction']['locked_context_keys']}
          assert observed == locked
          assert len(locked) == 55
          assert d['source_native_reconstruction']['primary_method_label'] == 'obs'
          assert d['source_native_reconstruction']['primary_interaction_weight'] == 'N ind'
          assert list(d['primary_estimands']) == [
              'median_pair_support_fraction',
              'mean_pair_support_jaccard_turnover',
              'interaction_shannon_relative_context_range',
          ]
          print('frozen Cabrera contexts', len(locked))
          PY
      - name: Run frozen Cabrera held-out v8 validation
        run: python scripts/run_abm_v8_cabrera_validation.py
      - name: Show scientific decision without converting falsification to CI failure
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/abm_v8_cabrera_validation.json'))
          assert x['target_metrics_inspected'] is True
          print('decision', x['decision'])
          print('tests', x.get('tests'))
          print('empirical primary', x.get('empirical',{}).get('primary_estimands'))
          print('pooled opportunity', x.get('empirical',{}).get('pooled_opportunity'))
          print('predictive primary envelopes', x.get('predictive',{}).get('primary_envelopes'))
          print('empirical secondary', x.get('empirical',{}).get('secondary'))
          print('predictive secondary envelopes', x.get('predictive',{}).get('secondary_envelopes'))
          assert x['decision'] in {
              'v8_survives_cabrera_conditional_pair_support_test',
              'v8_fails_cabrera_conditional_pair_support_predictive_adequacy',
              'v8_fails_cabrera_model_structural_gate',
          }
          PY
      - name: Run frozen-design and implementation regression tests
        run: >-
          python -m pytest -q
          tests/test_cabrera_2025_reconstruction_structure.py
          tests/test_cabrera_2025_validation_freeze.py
          tests/test_abm_v8_cabrera_validation.py
          tests/test_abm_v8_pair_support.py
      - uses: actions/upload-artifact@v4
        with:
          name: abm-v8-cabrera-validation
          path: |
            data/results/cabrera_2025_reconstruction_structure.json
            data/results/abm_v8_cabrera_validation.json
