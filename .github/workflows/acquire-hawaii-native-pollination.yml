name: Acquire Hawaii native pollination data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/hawaii_native_pollination_dryad_source.json"
      - "scripts/acquire_dryad_external_dataset.py"
      - "scripts/acquire_dryad_version_package.py"
      - "scripts/inspect_hawaii_native_pollination.py"
      - "scripts/analyze_hawaii_native_pollination.py"
      - "data/results/hawaii_native_pollination_summary.json"
      - "tests/test_hawaii_native_pollination.py"
      - ".github/workflows/acquire-hawaii-native-pollination.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Acquire source-native Dryad files
        shell: bash
        run: |
          python scripts/acquire_dryad_external_dataset.py \
            --config config/hawaii_native_pollination_dryad_source.json \
            --output-dir artifacts/hawaii_native_pollination || \
          python scripts/acquire_dryad_version_package.py \
            --config config/hawaii_native_pollination_dryad_source.json \
            --output-dir artifacts/hawaii_native_pollination
      - name: Inspect source-native workbook when inspector exists
        shell: bash
        run: |
          if [[ -f scripts/inspect_hawaii_native_pollination.py ]]; then python scripts/inspect_hawaii_native_pollination.py; fi
          if [[ -f scripts/analyze_hawaii_native_pollination.py ]]; then python scripts/analyze_hawaii_native_pollination.py; fi
      - name: Verify checked result when present
        shell: bash
        run: |
          if [[ -f data/results/hawaii_native_pollination_summary.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('artifacts/hawaii_native_pollination/analysis/summary.json').read_text())
          checked=json.loads(Path('data/results/hawaii_native_pollination_summary.json').read_text())
          assert live == checked
          PY
          fi
      - name: Upload source/analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawaii-native-pollination-audit
          path: artifacts/hawaii_native_pollination/
          if-no-files-found: error
