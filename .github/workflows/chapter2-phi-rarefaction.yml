name: Chapter 2 phi rarefaction

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: chapter2-phi-rarefaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rarefaction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run six-bin phi rarefaction from public sources
        run: |
          python -m scripts.run_chapter2_phi_timebin_rarefaction_from_sources \
            --out data/results/chapter2_phi_timebin_rarefaction_20260922.json
      - name: Upload rarefaction result
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-phi-timebin-rarefaction
          path: data/results/chapter2_phi_timebin_rarefaction_20260922.json
          if-no-files-found: error
