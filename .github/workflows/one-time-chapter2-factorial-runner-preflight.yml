name: One-time Chapter 2 factorial runner source-only preflight
on:
  push:
    branches: [ops/chapter2-viability-runner-preflight-20261009]
    paths:
      - .github/workflows/one-time-chapter2-factorial-runner-preflight.yml
permissions:
  contents: read
jobs:
  tests-and-plan:
    if: github.event.head_commit.message == 'ops-chapter2-validate-factorial-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Source-only old visitor ID and factorial algebra checks
        run: pytest -q tests/test_chapter2_postzygotic_viability_gate.py tests/test_chapter2_postzygotic_factorial_run.py
      - name: Plan exactly 172032 future cells without sampling biological histories
        run: python -m scripts.chapter2_postzygotic_factorial_run --mode plan --out /tmp/factorial_plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: factorial-runner-zero-outcome-plan
          path: /tmp/factorial_plan.json
          retention-days: 90
