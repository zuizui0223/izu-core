name: Acquire Canary Lotus effectiveness data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/canary_lotus_effectiveness_figshare_source.json"
      - "scripts/acquire_hiraiwa_ushimaru_figshare.py"
      - "scripts/analyze_canary_lotus_effectiveness.py"
      - "data/results/canary_lotus_effectiveness_summary.json"
      - "tests/test_canary_lotus_effectiveness.py"
      - ".github/workflows/acquire-canary-lotus-effectiveness.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install acquisition dependencies
        run: python -m pip install openpyxl
      - name: Acquire source-native Figshare files
        run: >-
          python scripts/acquire_hiraiwa_ushimaru_figshare.py
          --config config/canary_lotus_effectiveness_figshare_source.json
          --output-dir artifacts/canary_lotus_effectiveness
      - name: Analyze source-native data when analyzer exists
        shell: bash
        run: |
          if [[ -f scripts/analyze_canary_lotus_effectiveness.py ]]; then
            python scripts/analyze_canary_lotus_effectiveness.py
          else
            echo "Analyzer not added yet; acquisition inventory only."
          fi
      - name: Upload source/analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: canary-lotus-effectiveness-audit
          path: artifacts/canary_lotus_effectiveness/
          if-no-files-found: error
