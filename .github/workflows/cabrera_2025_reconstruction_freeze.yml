name: Cabrera 2025 reconstruction freeze

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_cabrera_2025_reconstruction_structure.py'
      - 'tests/test_cabrera_2025_reconstruction_structure.py'
      - 'data/design/abm_v8_cabrera_validation_v1.json'
      - '.github/workflows/cabrera_2025_reconstruction_freeze.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Audit checksum-locked Cabrera source structure
        run: python scripts/audit_cabrera_2025_reconstruction_structure.py
      - name: Enforce pre-target boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/cabrera_2025_reconstruction_structure.json'))
          assert x['target_metrics_calculated'] is False
          assert x['network_matrices_built'] is False
          print('source rows', x['source_rows'])
          print('cardinalities', x['structural_cardinalities'])
          print('methods', x['source_values']['methods'])
          print('method patterns', x['source_values']['method_pattern_counts_across_community_x_visita'])
          print('habitat by community', x['source_values']['habitat_by_community'])
          print('method structure', x['method_structure'])
          print('zero/blank structure', x['zero_and_blank_structure'])
          print('identity audit', x['identity_audit'])
          PY
      - name: Run pre-target regression tests
        run: python -m pytest -q tests/test_cabrera_2025_reconstruction_structure.py
      - uses: actions/upload-artifact@v4
        with:
          name: cabrera-2025-reconstruction-freeze
          path: data/results/cabrera_2025_reconstruction_structure.json
