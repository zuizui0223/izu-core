name: Cabrera 2025 reconstruction freeze

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit_cabrera_2025_reconstruction_structure.py'
      - 'tests/test_cabrera_2025_reconstruction_structure.py'
      - 'tests/test_cabrera_2025_validation_freeze.py'
      - 'data/design/abm_v8_cabrera_validation_v1.json'
      - '.github/workflows/cabrera_2025_reconstruction_freeze.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Audit checksum-locked Cabrera source structure
        run: python scripts/audit_cabrera_2025_reconstruction_structure.py
      - name: Enforce pre-target boundary and exact context freeze
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/cabrera_2025_reconstruction_structure.json'))
          d=json.load(open('data/design/abm_v8_cabrera_validation_v1.json'))
          assert x['target_metrics_calculated'] is False
          assert x['network_matrices_built'] is False
          assert d['chronology']['cabrera_target_metrics_calculated_before_freeze'] is False
          assert d['chronology']['network_matrices_built_before_freeze'] is False
          locked=d['source_native_reconstruction']['locked_context_keys']
          observed=x['method_structure']['obs']['community_x_visit_context_keys']
          assert len(locked) == 55
          assert len({tuple(row) for row in locked}) == 55
          assert {tuple(row) for row in observed} == {tuple(row) for row in locked}
          print('source rows', x['source_rows'])
          print('locked obs contexts', len(locked))
          print('methods', x['source_values']['methods'])
          print('method patterns', x['source_values']['method_pattern_counts_across_community_x_visita'])
          print('zero/blank structure', x['zero_and_blank_structure'])
          print('identity audit', x['identity_audit'])
          print('primary method', d['source_native_reconstruction']['primary_method_label'])
          print('primary weight', d['source_native_reconstruction']['primary_interaction_weight'])
          print('primary estimands', list(d['primary_estimands']))
          PY
      - name: Run pre-target regression tests
        run: python -m pytest -q tests/test_cabrera_2025_reconstruction_structure.py tests/test_cabrera_2025_validation_freeze.py
      - uses: actions/upload-artifact@v4
        with:
          name: cabrera-2025-reconstruction-freeze
          path: data/results/cabrera_2025_reconstruction_structure.json
