name: Chapter 2 fixed-B48 independent raw archive scientific readout repair
on:
  push:
    branches:
      - chapter2/k-fixedB48-readout-repair-20261009
    paths:
      - data/dispatch/k48-readout-repair-launch-20261009.txt
      - data/dispatch/k48-readout-repair-testfix-20261009.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter2-fixedB48-one-time-raw-repair-20261009
  cancel-in-progress: false

jobs:
  authenticate-and-readout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify original experiment source SHA and all 64 raw future jobs completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          data=$(gh api "repos/$REPO/actions/runs/37896872795")
          test "$(echo "$data" | jq -r .head_sha)" = "2737736f1dca36c8b43e9ac6a9fbd862ca21165b"
          test "$(echo "$data" | jq -r .conclusion)" = "success"
          gh api "repos/$REPO/actions/runs/37896872795/jobs?per_page=100" > jobs-1.json
          gh api "repos/$REPO/actions/runs/37896872795/jobs?per_page=100&page=2" > jobs-2.json
          jq -s -e '[.[].jobs[] | select(.name|startswith("complete-kb-futures"))] | length == 64' jobs-1.json jobs-2.json
          jq -s -e '[.[].jobs[] | select(.name|startswith("complete-kb-futures"))] | all(.conclusion=="success")' jobs-1.json jobs-2.json
      - name: Synthetic full-grid regression checks (no biological simulation)
        run: |
          python -m pytest -q \
            tests/test_chapter2_kb_reproduction.py \
            tests/test_chapter2_k_fixedB48_prospective.py
      - uses: actions/download-artifact@v4
        with:
          name: chapter2-k48-new64-t400-full-admission
          path: admitted-source
          repository: ${{ github.repository }}
          run-id: 37896872795
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter2-k48-future-shard-*
          path: full-64-kb-future-shards
          repository: ${{ github.repository }}
          run-id: 37896872795
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reauthenticate all original 114688 futures, then one frozen primary readout
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.chapter2_k_fixedB48_full_readout \
            --futures full-64-kb-future-shards \
            --t400-admission admitted-source/k48-full-t400-admission.json \
            --out chapter2-k48-independent-64-history-primary-20261009.json \
            --execute-full-adjudication \
            | tee chapter2-k48-confirmatory-console.txt
          test -s chapter2-k48-independent-64-history-primary-20261009.json
          python -m json.tool chapter2-k48-independent-64-history-primary-20261009.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-fixedB48-64-history-114688-confirmatory-readout-corrected
          path: |
            chapter2-k48-independent-64-history-primary-20261009.json
            chapter2-k48-confirmatory-console.txt
          if-no-files-found: error
          retention-days: 90
