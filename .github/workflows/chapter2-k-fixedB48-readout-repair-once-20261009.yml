name: Chapter 2 fixed-B48 independent raw archive scientific readout repair
on:
  push:
    branches:
      - chapter2/k-fixedB48-readout-repair-20261009
    paths:
      - data/dispatch/k48-readout-repair-launch-20261009.txt
      - data/dispatch/k48-readout-repair-testfix-20261009.txt
      - data/dispatch/k48-readout-repair-artifact-pagination-20261009.txt
      - data/dispatch/k48-readout-repair-bypass100-artifacts-20261009.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter2-fixedB48-one-time-raw-repair-20261009
  cancel-in-progress: false

jobs:
  authenticate-and-readout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify original experiment source SHA and all 64 raw future jobs completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          data=$(gh api "repos/$REPO/actions/runs/37896872795")
          test "$(echo "$data" | jq -r .head_sha)" = "2737736f1dca36c8b43e9ac6a9fbd862ca21165b"
          test "$(echo "$data" | jq -r .conclusion)" = "success"
          gh api "repos/$REPO/actions/runs/37896872795/jobs?per_page=100" > jobs-1.json
          gh api "repos/$REPO/actions/runs/37896872795/jobs?per_page=100&page=2" > jobs-2.json
          jq -s -e '[.[].jobs[] | select(.name|startswith("complete-kb-futures"))] | length == 64' jobs-1.json jobs-2.json
          jq -s -e '[.[].jobs[] | select(.name|startswith("complete-kb-futures"))] | all(.conclusion=="success")' jobs-1.json jobs-2.json
      - name: Synthetic full-grid regression checks (no biological simulation)
        run: |
          python -m pytest -q \
            tests/test_chapter2_kb_reproduction.py \
            tests/test_chapter2_k_fixedB48_prospective.py
      - uses: actions/download-artifact@v4
        with:
          name: chapter2-k48-new64-t400-full-admission
          path: admitted-source
          repository: ${{ github.repository }}
          run-id: 37896872795
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enumerate ALL 64 immutable future artifact IDs across API pages
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/37896872795/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("chapter2-k48-future-shard-")) | [.id, .name] | @tsv' > future-artifacts.tsv
          python - <<'PY'
          from pathlib import Path
          lines=[line.split("\t") for line in Path("future-artifacts.tsv").read_text().splitlines()]
          names=[p[1] for p in lines]
          expected={f"chapter2-k48-future-shard-{i}" for i in range(64)}
          if (len(lines)!=64 or len(names)!=len(set(names))
                  or set(names)!=expected or any(len(row)!=2 or not row[0].isdigit() for row in lines)):
              raise AssertionError("Missing, duplicate or extraneous immutable future artifact")
          print(f"Verified all {len(lines)} original raw shard artifact identifiers")
          PY
          ids=$(cut -f1 future-artifacts.tsv | paste -sd, -)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Fetch each immutable raw shard by artifact ID across BOTH GitHub API pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-64-kb-future-shards
          while IFS=      - name: Reauthenticate all original 114688 futures, then one frozen primary readout
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.chapter2_k_fixedB48_full_readout \
            --futures full-64-kb-future-shards \
            --t400-admission admitted-source/k48-full-t400-admission.json \
            --out chapter2-k48-independent-64-history-primary-20261009.json \
            --execute-full-adjudication \
            | tee chapter2-k48-confirmatory-console.txt
          test -s chapter2-k48-independent-64-history-primary-20261009.json
          python -m json.tool chapter2-k48-independent-64-history-primary-20261009.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-fixedB48-64-history-114688-confirmatory-readout-corrected
          path: |
            chapter2-k48-independent-64-history-primary-20261009.json
            chapter2-k48-confirmatory-console.txt
          if-no-files-found: error
          retention-days: 90
\\t' read -r artifact_id artifact_name; do
            shard="${artifact_name##*-}"
            index=$(printf '%02d' "$shard")
            dest="full-64-kb-future-shards/$artifact_name"
            mkdir -p "$dest"
            # The v4 download action only discovered the first 100 run artifacts;
            # the original run has 130. Fetch the exact individually verified IDs.
            curl --fail --silent --show-error --location --retry 3 \\
              -H "Authorization: Bearer $GH_TOKEN" \\
              -H "Accept: application/vnd.github+json" \\
              "https://api.github.com/repos/$REPO/actions/artifacts/$artifact_id/zip" \\
              --output "artifact-$shard.zip"
            unzip -tq "artifact-$shard.zip" > /dev/null
            unzip -q "artifact-$shard.zip" -d "$dest"
            test -f "$dest/k48_future_shard_$index.json"
            test "$(find "$dest" -type f | wc -l)" -eq 65
            rm "artifact-$shard.zip"
          done < future-artifacts.tsv
          test "$(find full-64-kb-future-shards -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 64
          echo "All 64 original immutable future artifact ZIPs downloaded and structurally verified"
      - name: Reauthenticate all original 114688 futures, then one frozen primary readout
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.chapter2_k_fixedB48_full_readout \
            --futures full-64-kb-future-shards \
            --t400-admission admitted-source/k48-full-t400-admission.json \
            --out chapter2-k48-independent-64-history-primary-20261009.json \
            --execute-full-adjudication \
            | tee chapter2-k48-confirmatory-console.txt
          test -s chapter2-k48-independent-64-history-primary-20261009.json
          python -m json.tool chapter2-k48-independent-64-history-primary-20261009.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-fixedB48-64-history-114688-confirmatory-readout-corrected
          path: |
            chapter2-k48-independent-64-history-primary-20261009.json
            chapter2-k48-confirmatory-console.txt
          if-no-files-found: error
          retention-days: 90
