name: Effective pollinator dependency field protocol

on:
  workflow_dispatch:
jobs:
  field-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run effective-dependency field tests
        run: >-
          python -m pytest -q
          tests/test_effective_pollinator_dependency.py
          tests/test_effective_pollinator_dependency_readiness.py
          tests/test_effective_dependency_precision.py
          tests/test_effective_dependency_pilot_assumptions.py
          tests/test_effective_dependency_measurement_calibration.py
          tests/test_effective_dependency_reliability.py
          tests/test_effective_dependency_field_linkage_templates.py
          tests/test_effective_dependency_parentage.py
          tests/test_effective_dependency_admission.py
          tests/test_freeze_effective_dependency_field_bundle.py
          tests/test_issue91_propagation_buffering_prediction_freeze.py
          tests/test_issue91_field_bundle_intake.py
