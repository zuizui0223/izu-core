name: Acquire Galapagos bird-insect effectiveness data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/galapagos_bird_insect_effectiveness_figshare_source.json"
      - "scripts/acquire_hiraiwa_ushimaru_figshare.py"
      - "scripts/inspect_galapagos_bird_insect_effectiveness.py"
      - "scripts/analyze_galapagos_bird_insect_effectiveness.py"
      - "data/results/galapagos_bird_insect_effectiveness_summary.json"
      - "tests/test_galapagos_bird_insect_effectiveness.py"
      - ".github/workflows/acquire-galapagos-bird-insect-effectiveness.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook reader
        run: python -m pip install xlrd
      - name: Acquire source-native Figshare files
        run: >-
          python scripts/acquire_hiraiwa_ushimaru_figshare.py
          --config config/galapagos_bird_insect_effectiveness_figshare_source.json
          --output-dir artifacts/galapagos_bird_insect_effectiveness
      - name: Verify source workbook lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('config/galapagos_bird_insect_effectiveness_figshare_source.json').read_text())
          live=json.loads(Path('artifacts/galapagos_bird_insect_effectiveness/summary.json').read_text())
          expected=config['expected_source_file']
          assert len(live['files']) == 1
          actual=live['files'][0]
          assert actual['name'] == expected['name']
          assert actual['size_downloaded'] == expected['bytes']
          assert actual['sha256'] == expected['sha256']
          assert actual['id'] == expected['figshare_file_id']
          PY
      - name: Inventory source-native workbook schema
        run: python scripts/inspect_galapagos_bird_insect_effectiveness.py
      - name: Analyze source-native effectiveness data
        run: python scripts/analyze_galapagos_bird_insect_effectiveness.py
      - name: Verify checked result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path('artifacts/galapagos_bird_insect_effectiveness/analysis/summary.json').read_text())
          checked=json.loads(Path('data/results/galapagos_bird_insect_effectiveness_summary.json').read_text())
          assert live == checked
          PY
      - name: Upload source/analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: galapagos-bird-insect-effectiveness-audit
          path: artifacts/galapagos_bird_insect_effectiveness/
          if-no-files-found: error
