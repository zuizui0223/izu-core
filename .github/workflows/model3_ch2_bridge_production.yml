name: Model 3 Chapter 2 bridge production

on:
  push:
    branches:
      - codex/integrate-model3-into-ch2
    paths:
      - '.github/workflows/model3_ch2_bridge_production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model3-ch2-bridge-production
  cancel-in-progress: true

jobs:
  cancel_stale_reproduction:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Cancel stale duplicate bridge runs."
