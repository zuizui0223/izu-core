name: Ch2 original far t0-200 exact genetic and parentage audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter2-far-original-0-200-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify original RNG, initial source genotypes, exact yearly Price bookkeeping
        run: |
          pytest -q tests/test_chapter2_far_original_0_200_20261015.py
          python -m scripts.replay_chapter2_far_original_0_200_20261015 --dry-run
          python -m scripts.replay_chapter2_far_original_0_200_20261015 --dry-run --shard-index 3 --shard-count 4

  original-4-shards:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Authenticate complete 2026-10-06 original source archive ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inputs
          gh api -H 'Accept: application/vnd.github+json' /repos/zuizui0223/izu-core/actions/artifacts/11411031490/zip > inputs/shard0.zip
          gh api -H 'Accept: application/vnd.github+json' /repos/zuizui0223/izu-core/actions/artifacts/11410452132/zip > inputs/shard1.zip
          gh api -H 'Accept: application/vnd.github+json' /repos/zuizui0223/izu-core/actions/artifacts/11411051762/zip > inputs/shard2.zip
          gh api -H 'Accept: application/vnd.github+json' /repos/zuizui0223/izu-core/actions/artifacts/11411155493/zip > inputs/shard3.zip
      - name: Replay original founder→t200 with native historical RNG and match original archived t200 genomes exactly
        run: |
          python -m scripts.replay_chapter2_far_original_0_200_20261015 \
            --shards inputs/shard0.zip inputs/shard1.zip inputs/shard2.zip inputs/shard3.zip \
            --out outputs/source-0-200/shard-${{ matrix.shard }} \
            --shard-index ${{ matrix.shard }} --shard-count 4
      - name: Gate original exact alleles, complete 128 cases and 25,600 replays per shard
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('outputs/source-0-200/shard-'+os.environ['SHARD']+'/readout.json')
          d=json.loads(p.read_text())
          assert d['status']=='EXACT_ORIGINAL_T0_T200_SOURCE_REPLAY_SHARD'
          assert d['n_cases']==128
          assert d['total_original_replayed_updates']==25600
          assert d['original_source_t200_complete_genotype_parity'] is True
          assert d['new_independent_histories']==0
          print('audited original source history shard',d['shard_index'])
          PY
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: far-original-0-200-genomes-shard-${{ matrix.shard }}
          retention-days: 90
          if-no-files-found: error
          path: outputs/source-0-200/shard-${{ matrix.shard }}/*

  source-readout:
    needs: original-4-shards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: far-original-0-200-genomes-shard-*
          merge-multiple: false
          path: outputs/source-0-200/all-shards
      - name: Independent receipt/array audit and 64-history source bookkeeping
        run: |
          python -m scripts.summarize_chapter2_far_original_0_200_20261015 \
            --input outputs/source-0-200/all-shards \
            --out outputs/source-0-200/source-history-readout.json
      - name: Require native source t200 exact parity across 512 case histories
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/source-0-200/source-history-readout.json').read_text())
          assert d['status']=='EXACT_ORIGINAL_FIRST_200_SOURCE_REPLAY_ACCOUNTED'
          assert d['original_visitor_history_clusters']==64
          assert d['original_replayed_case_paths']==512
          assert d['original_replayed_updates']==102400
          assert d['source_t200_bit_exact_admission'] is True
          assert d['new_independent_visitor_histories']==0
          expectations={'delayed_control':0.055359,
                        'prior_selfing':0.059925,
                        'pollen_discount':0.030349,
                        'assurance_cost':0.027222}
          for setting, target in expectations.items():
              observed=d['settings'][setting]['timepoints']['200']['mean']
              assert abs(observed-target)<1e-6,(setting,observed,target)
              c=d['settings'][setting]['component_sums']
              reconstructed=sum(x['mean'] for x in c.values())
              assert abs(reconstructed-observed)<1e-12
          print('All original frozen signs, exact parentage accounting and 64 histories confirmed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: far-original-0-200-64history-accounting
          retention-days: 90
          if-no-files-found: error
          path: outputs/source-0-200/source-history-readout.json
