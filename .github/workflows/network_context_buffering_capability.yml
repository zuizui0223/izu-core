name: Network context buffering capability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/run_network_context_buffering_capability_ablation.py'
      - 'tests/test_network_context_buffering_capability_ablation.py'
      - '.github/workflows/network_context_buffering_capability.yml'
      - 'scripts/run_constraint_mechanism_abm_v4_fixed_visit_budget.py'
      - 'scripts/run_constraint_mechanism_abm_v9_local_plant_opportunity.py'
      - 'scripts/run_constraint_mechanism_abm_v10_effective_service_dependency.py'
      - 'data/design/network_context_buffering_robustness_freeze.json'
      - 'data/design/buffer_mechanism_abm_admission_interface.json'

jobs:
  network-context-buffering-capability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Run initial matched network-context ablation
        run: >-
          python scripts/run_network_context_buffering_capability_ablation.py
          --replicates 4 --contexts 4 --lineages 24 --steps 120
      - name: Verify and print initial scientific result
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/network_context_buffering_capability_ablation.json'))
          assert x['matched_ablation']['empirical_targets_loaded'] == []
          assert x['matched_ablation']['assurance_ceiling'] == 0.0
          assert x['matched_ablation']['assurance_responsiveness'] == 0.0
          assert x['matched_ablation']['same_global_opportunity_networks_between_support_modes'] is True
          print(json.dumps({'initial_summary': x['summary'], 'initial_decision': x['decision']}, indent=2))
          PY
      - name: Run independent network-context stochastic block
        run: >-
          python scripts/run_network_context_buffering_capability_ablation.py
          --replicates 4 --contexts 4 --lineages 24 --steps 120
          --seed 90260824
          --out data/results/network_context_buffering_capability_robustness.json
      - name: Verify and print independent block
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/network_context_buffering_capability_robustness.json'))
          assert x['matched_ablation']['empirical_targets_loaded'] == []
          assert x['matched_ablation']['assurance_ceiling'] == 0.0
          assert x['matched_ablation']['assurance_responsiveness'] == 0.0
          print(json.dumps({'independent_summary': x['summary'], 'independent_decision': x['decision']}, indent=2))
          PY
      - name: Run focused tests
        run: python -m pytest -q tests/test_network_context_buffering_capability_ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: network-context-buffering-capability
          path: |
            data/results/network_context_buffering_capability_ablation.json
            data/results/network_context_buffering_capability_robustness.json
