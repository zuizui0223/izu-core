name: Chapter 2 island mutational-priority falsification replays

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter2-island-priority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_chapter2_island_mutational_priority.py
      - run: |
          python -m scripts.run_chapter2_island_mutational_priority_independent16 \
            --out outputs/priority-indep16 --dry-run
          python -m scripts.run_chapter2_island_mutational_priority_balanced \
            --out outputs/priority-balanced --dry-run

  replay-shards:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant: [independent16, balanced]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Execute archived-source reproductive rules with frozen randomization
        run: |
          if [ "${{ matrix.variant }}" = "independent16" ]; then
            MODULE=scripts.run_chapter2_island_mutational_priority_independent16
          else
            MODULE=scripts.run_chapter2_island_mutational_priority_balanced
          fi
          python -m "$MODULE" \
            --out outputs/island-priority/${{ matrix.variant }} \
            --shard-index ${{ matrix.shard }} --shard-count 4 --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: island-priority-${{ matrix.variant }}-shard-${{ matrix.shard }}
          retention-days: 90
          if-no-files-found: error
          path: outputs/island-priority/${{ matrix.variant }}/*

  audit-readout:
    needs: replay-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [independent16, balanced]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: island-priority-${{ matrix.variant }}-shard-*
          merge-multiple: true
          path: outputs/island-priority/${{ matrix.variant }}
      - name: Verify full case grid and exact failure/balanced result
        run: |
          python -m scripts.verify_chapter2_island_mutational_priority_replays \
            --variant ${{ matrix.variant }} \
            --input outputs/island-priority/${{ matrix.variant }} \
            --out outputs/island-priority/${{ matrix.variant }}/verified_readout.json \
            --shard-count 4
      - uses: actions/upload-artifact@v4
        with:
          name: island-priority-${{ matrix.variant }}-verified
          retention-days: 90
          if-no-files-found: error
          path: outputs/island-priority/${{ matrix.variant }}/verified_readout.json
