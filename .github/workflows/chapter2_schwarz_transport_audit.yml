name: Chapter 2 Schwarz DataONE audit

on:
  pull_request:
    paths:
      - 'scripts/acquire_galapagos_dataone.py'
      - 'config/schwarz_temporal_dataone_source.json'
      - '.github/workflows/chapter2_schwarz_transport_audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Audit DOI-locked DataONE transport
        continue-on-error: true
        run: >-
          python scripts/acquire_galapagos_dataone.py
          --config config/schwarz_temporal_dataone_source.json
          --output-dir data/results/schwarz_temporal_dataone
      - name: Upload DataONE inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-schwarz-dataone-audit
          path: data/results/schwarz_temporal_dataone/source_inventory.json
          if-no-files-found: error
