name: Chapter 2 Schwarz transport audit

on:
  pull_request:
    paths:
      - 'scripts/audit_seychelles_2017_temporal_compilation_fallback.py'
      - 'scripts/acquire_galapagos_dataone.py'
      - 'config/schwarz_temporal_dataone_source.json'
      - 'data/design/seychelles_kaiser_bunbury2017_temporal_compilation_fallback.json'
      - '.github/workflows/chapter2_schwarz_transport_audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Audit verified Zenodo and Dryad transports
        run: python scripts/audit_seychelles_2017_temporal_compilation_fallback.py
      - name: Audit DOI-locked DataONE transport
        continue-on-error: true
        run: >-
          python scripts/acquire_galapagos_dataone.py
          --config config/schwarz_temporal_dataone_source.json
          --output-dir data/results/schwarz_temporal_dataone
      - name: Upload source transport audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-schwarz-transport-audit
          path: |
            data/results/seychelles_2017_temporal_compilation_fallback_audit.json
            data/results/schwarz_temporal_dataone/source_inventory.json
          if-no-files-found: error
