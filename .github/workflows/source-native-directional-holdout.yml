name: Source-native directional holdout

on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Test directional dependency and primary-source gates
        run: >-
          python -m pytest -q
          tests/test_source_native_directional_holdout.py
          tests/test_source_native_dependency.py
          tests/test_primary_source_holdout.py
      - name: Run directional audit
        run: python scripts/run_source_native_directional_holdout.py
      - name: Run dependency audit
        run: python scripts/run_source_native_dependency.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: source-native-directional-holdout
          path: artifacts/source_native_directional_holdout/*.json
