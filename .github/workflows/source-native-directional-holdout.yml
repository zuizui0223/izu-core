name: Source-native directional holdout

on:
  workflow_dispatch:
  push:
    paths:
      - "channel_id/source_native_directional_holdout.py"
      - "scripts/run_source_native_directional_holdout.py"
      - "tests/test_source_native_directional_holdout.py"
      - "tests/test_primary_source_holdout.py"
      - "channel_id/primary_source_holdout.py"
      - "data/predictive_meta/source_native_directional_holdout.csv"
      - "data/predictive_meta/primary_source_native_evidence.csv"
      - "docs/SOURCE_NATIVE_DIRECTIONAL_HOLDOUT.md"
      - ".github/workflows/source-native-directional-holdout.yml"
  pull_request:
    paths:
      - "channel_id/source_native_directional_holdout.py"
      - "scripts/run_source_native_directional_holdout.py"
      - "tests/test_source_native_directional_holdout.py"
      - "tests/test_primary_source_holdout.py"
      - "channel_id/primary_source_holdout.py"
      - "data/predictive_meta/source_native_directional_holdout.csv"
      - "data/predictive_meta/primary_source_native_evidence.csv"
      - "docs/SOURCE_NATIVE_DIRECTIONAL_HOLDOUT.md"
      - ".github/workflows/source-native-directional-holdout.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Test directional and primary-source gates
        run: python -m pytest -q tests/test_source_native_directional_holdout.py tests/test_primary_source_holdout.py
      - name: Run directional audit
        run: python scripts/run_source_native_directional_holdout.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: source-native-directional-holdout
          path: artifacts/source_native_directional_holdout/report.json
