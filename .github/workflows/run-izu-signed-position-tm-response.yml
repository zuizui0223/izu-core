name: Run frozen Izu signed-position TM response

on:
  push:
    branches: [empirical-2017-proboscis-recovery-signed-test]
    paths:
      - "data/design/izu_signed_position_source_gate_20260827.json"
      - "scripts/analyze_izu_signed_position_tm_response.py"
      - "tests/test_analyze_izu_signed_position_tm_response.py"
      - ".github/workflows/run-izu-signed-position-tm-response.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate frozen signed-position analysis
        run: pytest -q tests/test_analyze_izu_signed_position_tm_response.py
      - name: Acquire frozen Hiraiwa-Ushimaru 2024 source
        run: |
          python scripts/acquire_hiraiwa_ushimaru_figshare.py \
            --output-dir /tmp/hiraiwa2024
          test -s /tmp/hiraiwa2024/files/data_sp_plant.csv
      - name: Run frozen signed-position TM response
        run: |
          mkdir -p /tmp/signed
          python scripts/analyze_izu_signed_position_tm_response.py \
            --plant-csv /tmp/hiraiwa2024/files/data_sp_plant.csv \
            --gate data/design/izu_signed_position_source_gate_20260827.json \
            --output-dir /tmp/signed
      - name: Verify frozen real-data result
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          p = Path('/tmp/signed/izu_signed_position_tm_response.json')
          r = json.loads(p.read_text())
          f = r['primary']['fit']
          assert f['n_rows'] == 83, f
          assert f['n_plants'] == 30, f
          assert f['n_islands'] == 5, f
          assert math.isclose(f['slope'], 0.03328467458835534, abs_tol=1e-10), f
          assert math.isclose(f['cluster_robust_se'], 0.14731499875112766, abs_tol=1e-9), f
          assert math.isclose(f['p_two_sided'], 0.8212463772087362, abs_tol=1e-9), f
          assert math.isclose(r['primary']['pearson_r'], 0.060868268124130355, abs_tol=1e-10), r['primary']
          assert math.isclose(r['primary']['spearman_rho'], 0.09908224691899017, abs_tol=1e-10), r['primary']
          assert math.isclose(r['primary']['sign_concordance_fraction'], 0.5060240963855421, abs_tol=1e-12), r['primary']
          assert r['primary']['all_leave_one_slopes_positive'] is True, r['primary']['leave_one_island']
          o = r['oshima_source_sensitivity']['fit']
          assert o['n_rows'] == 48, o
          assert o['n_plants'] == 16, o
          assert math.isclose(o['slope'], -0.0968876694272699, abs_tol=1e-10), o
          assert r['inferential_reading'] == 'positive_direction_but_no_detectable_association_support', r
          print(json.dumps({
              'primary': f,
              'pearson_r': r['primary']['pearson_r'],
              'spearman_rho': r['primary']['spearman_rho'],
              'sign_concordance_fraction': r['primary']['sign_concordance_fraction'],
              'oshima_sensitivity': o,
              'reading': r['inferential_reading'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: izu-signed-position-tm-response-${{ github.run_id }}
          path: |
            /tmp/signed/
            /tmp/hiraiwa2024/summary.json
          if-no-files-found: error
          retention-days: 90
