# One-time, explicitly user-approved full frozen Chapter 2 launch.
# Fail closed unless all biological scripts and preregistered data match merged PR 416.
name: One-time Chapter 2 full cohort launch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-chapter2-full-cohort-launch.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch-frozen-full-cohort:
    if: github.event.head_commit.message == 'ops-chapter2-launch-full-cohort-approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm no biological or confirmed-workflow changes since merged PR 416
        run: |
          set -euo pipefail
          git diff --exit-code c1401672f821a7672dfe7cb9b9a85e4db050d302 "$GITHUB_SHA" -- \
            scripts data tests .github/workflows/chapter2-order-expression-cohort.yml
          echo "Frozen experimental code unchanged from PR 416 merge."
      - name: Verify exact frozen protocol checksum from successful preflight receipt
        run: |
          echo "b6f6336875b04a131434ef35d6ec42b59dc14a1e4c59e7e4d6f2513e24a04fdd  data/design/chapter2_order_expression_identification_20261008.json" | sha256sum -c -
      - name: Dispatch complete newly frozen cohort with explicit approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/dispatch.json
          import json, os
          print(json.dumps({
            "ref": "main",
            "inputs": {
              "mode": "full_cohort",
              "full_cohort_launch_approved": "true",
              "source_commit_sha": os.environ["SOURCE_SHA"]
            }
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/chapter2-order-expression-cohort.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
          echo "Dispatched full_cohort for reviewed frozen code at $SOURCE_SHA."
