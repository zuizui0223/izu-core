name: ABM v7 support closure prevalidation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/run_constraint_mechanism_abm_v7_support_closure.py'
      - 'scripts/prevalidate_abm_v7_support_closure.py'
      - 'scripts/run_constraint_mechanism_abm_v6_local_support.py'
      - 'scripts/run_constraint_mechanism_abm_v5_hierarchical_context.py'
      - 'tests/test_abm_v7_support_closure.py'
      - '.github/workflows/abm_v7_support_closure_prevalidation.yml'

jobs:
  prevalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Freeze v7 mechanism contract
        run: python scripts/run_constraint_mechanism_abm_v7_support_closure.py
      - name: Run synthetic prevalidation
        run: python scripts/prevalidate_abm_v7_support_closure.py
      - name: Enforce synthetic decision and no empirical fit
        run: |
          python - <<'PY'
          import json,sys
          x=json.load(open('data/results/abm_v7_support_closure_prevalidation.json'))
          print('decision', x['decision'])
          print('v6 structural failures', x['v6_structural_failure_masks_in_synthetic_grid'])
          print('v7 resolved', x['v7_resolved_v6_failure_masks'])
          print('partnerless dropout masks', x['synthetic_masks_with_partnerless_plant_dropout'])
          print('tests', x['tests'])
          ok=(x['decision']=='v7_preserves_prior_invariants_and_closes_joint_local_support' and x['empirical_inputs_loaded']==[] and x['giannutri_values_loaded'] is False)
          sys.exit(0 if ok else 1)
          PY
      - name: Run focused tests
        run: python -m pytest -q tests/test_abm_v7_support_closure.py
      - uses: actions/upload-artifact@v4
        with:
          name: abm-v7-support-closure-prevalidation
          path: |
            data/results/constraint_mechanism_abm_v7_support_closure.json
            data/results/abm_v7_support_closure_prevalidation.json
