name: One-time Chapter 2 exposed-cohort reproductive signature audit
on:
  push:
    branches: [chapter2/crosscohort-raw-reproductive-signature-20261009]
    paths:
      - .github/workflows/one-time-chapter2-crosscohort-signature.yml

permissions:
  actions: read
  contents: write

jobs:
  audit-two-exposed-cohorts:
    if: github.event.head_commit.message == 'ops-chapter2-run-crosscohort-signature'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test bootstrap and response channels on constructed synthetic arrays
        run: |
          pytest -q tests/test_chapter2_order_two_cohort_signature.py \
            tests/test_chapter2_order_payoff_recruitment_posthoc.py
      - name: Retrieve original PR 416 future archives, complete 64 shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/old-cohort
          gh run download 37856410822 \
            --repo "${{ github.repository }}" \
            --pattern 'order-future-shard-*' --dir /tmp/old-cohort
      - name: Retrieve independent PR 419 future archives, complete 64 shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/new-cohort
          gh run download 37862121201 \
            --repo "${{ github.repository }}" \
            --pattern 'budget-window-post-shard-*' --dir /tmp/new-cohort
      - name: Require full source-backed receipt and no cross-cohort missing shards
        run: |
          python - <<'PY'
          from pathlib import Path
          old={p.name for p in Path('/tmp/old-cohort').iterdir() if p.is_dir()}
          new={p.name for p in Path('/tmp/new-cohort').iterdir() if p.is_dir()}
          assert old=={f'order-future-shard-{i}' for i in range(64)}, (len(old),old)
          assert new=={f'budget-window-post-shard-{i}' for i in range(64)}, (len(new),new)
          print('Both 64-shard source archives retrieved completely.')
          PY
      - name: Re-audit 143360 raw futures, report cluster-level reproductive signature
        run: |
          python -m scripts.chapter2_order_two_cohort_signature \
            --original-futures /tmp/old-cohort \
            --independent-futures /tmp/new-cohort \
            --out results/chapter2/two_cohort_reproductive_signature_posthoc_20261009.json
      - name: Commit exact exploratory receipt onto PR review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/chapter2/two_cohort_reproductive_signature_posthoc_20261009.json
          git diff --cached --quiet && exit 0
          git commit -m 'results(chapter2): lock two-cohort reproductive allocation robustness'
          git push origin HEAD:chapter2/crosscohort-raw-reproductive-signature-20261009
