name: Thousand Island Lake 2022 v9 source gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/design/abm_v9_thousand_island_lake_source_gate_v1.json'
      - 'scripts/acquire_audit_thousand_island_lake_2022.py'
      - 'tests/test_thousand_island_lake_2022_source_gate.py'
      - '.github/workflows/thousand_island_lake_2022_source_gate.yml'

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository and archive/R structure readers
        run: |
          sudo apt-get update
          sudo apt-get install -y unar r-base-core
          python -m pip install -e '.[dev]'
      - name: Run source-only archive audit
        run: python scripts/acquire_audit_thousand_island_lake_2022.py
      - name: Enforce source-only boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/thousand_island_lake_2022_source_audit.json'))
          assert x['target_metrics_calculated'] is False
          print('status', x['status'])
          print('metadata title', x.get('metadata_title'))
          print('files', x.get('file_count'))
          print('source bytes ok', x.get('source_bytes_ok'))
          print('extracted files', x.get('extracted_file_count'))
          print('signals', x.get('source_structure_signals'))
          print('source admission', x['source_admission_succeeds'])
          for row in x.get('files', []):
              print('ARCHIVE', row.get('key'), row.get('bytes'), row.get('md5'), row.get('sha256'), row.get('md5_match'), row.get('archive_inventory_error'))
              print('MEMBERS', row.get('archive_inventory'))
              for member in row.get('extracted_member_inventory', []):
                  print('MEMBER', member)
          PY
      - name: Run source-gate regression tests
        run: python -m pytest -q tests/test_thousand_island_lake_2022_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: thousand-island-lake-2022-v9-source-gate
          path: |
            data/results/thousand_island_lake_2022_source_audit.json
            data/external/thousand_island_lake_2022/**
