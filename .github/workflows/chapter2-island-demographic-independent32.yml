name: Chapter 2 island demographic independent32 replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: island-demographic32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_chapter2_island_demographic_independent32.py
      - run: |
          python -m scripts.run_chapter2_island_demographic_independent32 \
            --out outputs/island_demographic32 --shard-index 0 \
            --shard-count 8 --dry-run

  independent-shards:
    needs: verify-design
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: |
          python -m scripts.run_chapter2_island_demographic_independent32 \
            --out outputs/island_demographic32 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: island-demographic32-shard-${{ matrix.shard }}
          retention-days: 90
          if-no-files-found: error
          path: outputs/island_demographic32/*

  readout:
    needs: independent-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: island-demographic32-shard-*
          merge-multiple: true
          path: outputs/island_demographic32
      - run: |
          python -m scripts.summarize_chapter2_island_demographic_independent32 \
            --input outputs/island_demographic32 \
            --out outputs/island_demographic32/independent_readout.json
      - name: Audit hash and exact frozen numerical result, never silently overwrite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path('outputs/island_demographic32/independent_readout.json').read_text())
          declared=json.loads(Path('data/results/chapter2_island_demographic_independent32_20261008.json').read_text())
          hashes=declared['archive']['offline_shard_sha256']
          assert row['shard_sha256']==hashes, 'source or case bytes diverge from frozen offline execution'
          assert abs(row['pooled_primary']['mean']-declared['predeclared_pooled_primary']['mean']) < 1e-12
          assert all(abs(a-b)<1e-12 for a,b in zip(
            row['pooled_primary']['bootstrap95'],declared['predeclared_pooled_primary']['bootstrap95']))
          assert row['pooled_primary']['passes_frozen_rule']
          print('exact independent32 replay and frozen source digests match')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: island-demographic32-full-readout
          retention-days: 90
          if-no-files-found: error
          path: outputs/island_demographic32/independent_readout.json
