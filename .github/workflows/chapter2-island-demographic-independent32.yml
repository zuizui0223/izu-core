name: Chapter 2 island demographic independent32 replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: island-demographic32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_chapter2_island_demographic_independent32.py
      - run: |
          python -m scripts.run_chapter2_island_demographic_independent32 \
            --out outputs/island_demographic32 --shard-index 0 \
            --shard-count 8 --dry-run

  independent-shards:
    needs: verify-design
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: |
          python -m scripts.run_chapter2_island_demographic_independent32 \
            --out outputs/island_demographic32 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: island-demographic32-shard-${{ matrix.shard }}
          retention-days: 90
          if-no-files-found: error
          path: outputs/island_demographic32/*

  readout:
    needs: independent-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: island-demographic32-shard-*
          merge-multiple: true
          path: outputs/island_demographic32
      - run: |
          python -m scripts.summarize_chapter2_island_demographic_independent32 \
            --input outputs/island_demographic32 \
            --out outputs/island_demographic32/independent_readout.json
      - name: Audit biological-state identity and exact frozen primary result
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root=Path('outputs/island_demographic32')
          row=json.loads((root/'independent_readout.json').read_text())
          declared=json.loads(Path('data/results/chapter2_island_demographic_independent32_20261008.json').read_text())
          receipt=json.loads(Path('data/results/chapter2_island_demographic_independent32_replay_receipt_20261013.json').read_text())

          def projection_hash(path):
              records=json.loads(path.read_text())
              for record in records:
                  for case in record['post_cases']:
                      case.pop('initial_viable_maternal_per_capita', None)
              raw=json.dumps(records,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
              return hashlib.sha256(raw).hexdigest()

          for shard in range(8):
              name=f'demographic_independent32_shard_{shard:02d}.json'
              expected=receipt['shards'][str(shard)]
              assert projection_hash(root/name)==expected['biological_projection_sha256'], name

          assert receipt['original_archive']['sha256']==declared['archive']['sha256']
          assert abs(row['pooled_primary']['mean']-declared['predeclared_pooled_primary']['mean']) < 1e-12
          assert all(abs(a-b)<1e-12 for a,b in zip(
            row['pooled_primary']['bootstrap95'],declared['predeclared_pooled_primary']['bootstrap95']))
          assert row['pooled_primary']['passes_frozen_rule']
          assert row['post_trajectories']==declared['post_switch_trajectories']==4096
          print('independent32 biological states and frozen primary result match; diagnostic float bytes may differ only as recorded')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: island-demographic32-full-readout
          retention-days: 90
          if-no-files-found: error
          path: outputs/island_demographic32/independent_readout.json
