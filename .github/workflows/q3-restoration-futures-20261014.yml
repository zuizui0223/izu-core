name: Q3 approved conditional futures 20261014

on:
  push:
    branches: [design/chapter2-restoration-conditional-futures-20261014]
    paths: [data/designs/q3_futures_execution_20261014.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: q3-conditional-futures-20261014
  cancel-in-progress: false

jobs:
  fixed-futures:
    runs-on: ubuntu-24.04
    timeout-minutes: 245
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - name: Exact runtime and raw-only unit checks
        run: |
          python -m pip install numpy==2.2.6 pytest==8.4.2
          python -m pytest tests/test_q3_futures_contract_20261014.py tests/test_q3_futures_replay_20261014.py -q
      - name: Download the two immutable published inputs
        run: |
          mkdir -p work/q3-run/inputs
          gh release download four-question-resolution-20261013 --repo "$GITHUB_REPOSITORY" --pattern INVESTMENT_VARIATION_RESTORATION_64_20261013.zip --dir work/q3-run/inputs
          gh release download atom-cell-inputs-20261011 --repo "$GITHUB_REPOSITORY" --pattern remote_atom_inputs_20261011.zip --dir work/q3-run/inputs
      - name: Run once with durable reservation, then independently replay every path
        run: |
          python -u scripts/run_q3_futures_20261014.py --archive work/q3-run/inputs/INVESTMENT_VARIATION_RESTORATION_64_20261013.zip --source-input work/q3-run/inputs/remote_atom_inputs_20261011.zip --out work/q3-run/output --repo .
      - name: Preserve complete archive and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: q3-conditional-futures-complete-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: |
            work/q3-run/Q3_CONDITIONAL_FUTURES_20261014.zip
            work/q3-run/PUBLICATION_RECEIPT.json
            work/q3-run/output/READOUT.json
            work/q3-run/output/INDEPENDENT_REPLAY.json
            work/q3-run/output/RESOURCES.json
            work/q3-run/output/ADMISSION.json
            work/q3-run/output/FIXTURES.json
      - name: Preserve failed attempt without admitting partial outcomes
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: q3-conditional-futures-hold-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          compression-level: 1
          path: work/q3-run/
