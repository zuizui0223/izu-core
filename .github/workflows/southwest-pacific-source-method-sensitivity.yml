name: Southwest Pacific source-method sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/analyze_southwest_pacific_source_method_sensitivity.py"
      - "scripts/analyze_southwest_pacific_source_method_overlap.py"
      - "tests/test_southwest_pacific_source_method_sensitivity.py"
      - "tests/test_southwest_pacific_source_method_overlap.py"
      - "data/results/southwest_pacific_pairs/source_method_sensitivity.json"
      - "data/results/southwest_pacific_pairs/source_method_geographic_overlap_sensitivity.json"
      - "config/southwest_pacific_aob_source.json"
      - "scripts/acquire_southwest_pacific_pmc_support.py"
      - "scripts/acquire_oup_supplementary_data.py"
      - ".github/workflows/southwest-pacific-source-method-sensitivity.yml"
  pull_request:
    paths:
      - "scripts/analyze_southwest_pacific_source_method_sensitivity.py"
      - "scripts/analyze_southwest_pacific_source_method_overlap.py"
      - "tests/test_southwest_pacific_source_method_sensitivity.py"
      - "tests/test_southwest_pacific_source_method_overlap.py"
      - "data/results/southwest_pacific_pairs/source_method_sensitivity.json"
      - "data/results/southwest_pacific_pairs/source_method_geographic_overlap_sensitivity.json"
      - "config/southwest_pacific_aob_source.json"
      - "scripts/acquire_southwest_pacific_pmc_support.py"
      - "scripts/acquire_oup_supplementary_data.py"
      - ".github/workflows/southwest-pacific-source-method-sensitivity.yml"

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e . openpyxl pytest
      - name: Test source-method claim boundaries
        run: >-
          python -m pytest -q
          tests/test_southwest_pacific_source_method_sensitivity.py
          tests/test_southwest_pacific_source_method_overlap.py
      - name: Try checksum-locked Europe PMC source route
        id: pmc
        continue-on-error: true
        run: >-
          python scripts/acquire_southwest_pacific_pmc_support.py
          --config config/southwest_pacific_aob_source.json
          --output-dir artifacts/southwest_pacific_source_method/source
          --source-lock data/results/southwest_pacific_pairs/source_lock.json
      - name: Check source availability
        id: source1
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          root = Path("artifacts/southwest_pacific_source_method/source/files")
          names = ["mcaf005_suppl_supplementary_data_s1.xlsx", "mcaf005_suppl_supplementary_data_s2.xlsx"]
          print("available=" + ("true" if all((root / name).is_file() for name in names) else "false"))
          PY
      - name: Try Oxford Academic fallback
        if: steps.source1.outputs.available != 'true'
        continue-on-error: true
        timeout-minutes: 4
        run: >-
          python scripts/acquire_oup_supplementary_data.py
          --config config/southwest_pacific_aob_source.json
          --output-dir artifacts/southwest_pacific_source_method/source
      - name: Resolve final source state
        id: source
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          root = Path("artifacts/southwest_pacific_source_method/source/files")
          names = ["mcaf005_suppl_supplementary_data_s1.xlsx", "mcaf005_suppl_supplementary_data_s2.xlsx"]
          print("available=" + ("true" if all((root / name).is_file() for name in names) else "false"))
          PY
      - name: Regenerate source-method sensitivities
        if: steps.source.outputs.available == 'true'
        run: |
          python scripts/analyze_southwest_pacific_source_method_sensitivity.py \
            --s1 artifacts/southwest_pacific_source_method/source/files/mcaf005_suppl_supplementary_data_s1.xlsx \
            --s2 artifacts/southwest_pacific_source_method/source/files/mcaf005_suppl_supplementary_data_s2.xlsx \
            --output artifacts/southwest_pacific_source_method/source_method_sensitivity.json \
            --bootstrap-repetitions 5000 --seed 20260812
          python scripts/analyze_southwest_pacific_source_method_overlap.py \
            --s1 artifacts/southwest_pacific_source_method/source/files/mcaf005_suppl_supplementary_data_s1.xlsx \
            --s2 artifacts/southwest_pacific_source_method/source/files/mcaf005_suppl_supplementary_data_s2.xlsx \
            --output artifacts/southwest_pacific_source_method/source_method_geographic_overlap_sensitivity.json \
            --bootstrap-repetitions 5000 --seed 20260813
      - name: Verify checked results when source is available
        if: steps.source.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          def assert_equivalent(expected, observed, path="root"):
              if isinstance(expected, bool) or isinstance(observed, bool):
                  if expected is not observed:
                      raise AssertionError(f"boolean drift at {path}: {expected!r} != {observed!r}")
                  return
              if isinstance(expected, (int, float)) and isinstance(observed, (int, float)):
                  if not math.isclose(float(expected), float(observed), rel_tol=1e-12, abs_tol=1e-12):
                      raise AssertionError(f"numeric drift at {path}: {expected!r} != {observed!r}")
                  return
              if type(expected) is not type(observed):
                  raise AssertionError(f"type drift at {path}: {type(expected).__name__} != {type(observed).__name__}")
              if isinstance(expected, dict):
                  if expected.keys() != observed.keys():
                      raise AssertionError(f"key drift at {path}")
                  for key in expected:
                      assert_equivalent(expected[key], observed[key], f"{path}.{key}")
                  return
              if isinstance(expected, list):
                  if len(expected) != len(observed):
                      raise AssertionError(f"length drift at {path}")
                  for index, (left, right) in enumerate(zip(expected, observed)):
                      assert_equivalent(left, right, f"{path}[{index}]")
                  return
              if expected != observed:
                  raise AssertionError(f"value drift at {path}: {expected!r} != {observed!r}")

          pairs = [
              ("data/results/southwest_pacific_pairs/source_method_sensitivity.json", "artifacts/southwest_pacific_source_method/source_method_sensitivity.json"),
              ("data/results/southwest_pacific_pairs/source_method_geographic_overlap_sensitivity.json", "artifacts/southwest_pacific_source_method/source_method_geographic_overlap_sensitivity.json"),
          ]
          for expected_path, observed_path in pairs:
              expected = json.loads(Path(expected_path).read_text(encoding="utf-8"))
              observed = json.loads(Path(observed_path).read_text(encoding="utf-8"))
              try:
                  assert_equivalent(expected, observed)
              except AssertionError as error:
                  raise SystemExit(f"checked source-method sensitivity drift: {expected_path}: {error}") from error
          print("source-method sensitivities reproduce checked results within 1e-12 numeric tolerance")
          PY
      - name: Preserve blocked transport state without changing biological result
        if: steps.source.outputs.available != 'true'
        run: |
          mkdir -p artifacts/southwest_pacific_source_method
          printf '%s\n' '{"status":"source_transport_unavailable_this_run","biological_result_changed":false,"checked_result_retained":true}' > artifacts/southwest_pacific_source_method/transport_state.json
      - name: Upload sensitivity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: southwest-pacific-source-method-sensitivity
          path: artifacts/southwest_pacific_source_method/
          if-no-files-found: error
