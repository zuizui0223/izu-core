name: One-time paired Chapter 2 viability stress-regime comparison
on:
  push:
    branches: [chapter2/posthoc-capacity-regime-moderation-20261009]
    paths:
      - .github/workflows/one-time-ch2-capacity-regime-moderation.yml
permissions:
  actions: read
  contents: write
jobs:
  compare-authenticated-regimes:
    if: github.event.head_commit.message == 'ops-ch2-run-paired-regime-moderation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate correct axes and paired ecological unit
        run: pytest -q tests/test_chapter2_postzygotic_capacity_moderation_posthoc.py
      - name: Retrieve exact already-completed, original t400 genotype and future artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37862121201 --repo "${{ github.repository }}" --pattern 'budget-window-pre-shard-*' --dir archived-pre
          gh run download 37862121201 --repo "${{ github.repository }}" --pattern 'budget-window-post-shard-*' --dir archived-futures
      - name: Retrieve exact already-completed 64 factorial intervention archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37869990792 --repo "${{ github.repository }}" --pattern 'factorial-shard-*' --dir intervention-futures
      - name: Audit all 229376 futures and bootstrap paired stress regime difference
        run: |
          python -m scripts.chapter2_postzygotic_capacity_moderation_posthoc --prehistory archived-pre --baseline archived-futures --perturbed intervention-futures --out results/chapter2/postzygotic_capacity_regime_moderation_posthoc_20261009.json
      - name: Commit only verified exploratory post-outcome receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/chapter2/postzygotic_capacity_regime_moderation_posthoc_20261009.json
          git diff --cached --quiet && exit 0
          git commit -m 'results(chapter2): archive paired founder/capacity regime moderation'
          git push origin HEAD:chapter2/posthoc-capacity-regime-moderation-20261009
