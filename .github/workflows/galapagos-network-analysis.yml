name: Galapagos multi-island network analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/acquire_dryad_external_dataset.py"
      - "scripts/acquire_galapagos_dataone.py"
      - "scripts/audit_galapagos_dryad_schema.py"
      - "scripts/analyze_galapagos_source_networks.py"
      - "scripts/analyze_galapagos_source_networks_v2.py"
      - "tests/test_dryad_external_acquisition.py"
      - "tests/test_galapagos_dataone_acquisition.py"
      - "tests/test_galapagos_dryad_schema.py"
      - "tests/test_galapagos_source_networks.py"
      - "docs/GALAPAGOS_DATAONE_RECOVERY.md"
      - ".github/workflows/galapagos-network-analysis.yml"
  pull_request:
    paths:
      - "scripts/acquire_dryad_external_dataset.py"
      - "scripts/acquire_galapagos_dataone.py"
      - "scripts/audit_galapagos_dryad_schema.py"
      - "scripts/analyze_galapagos_source_networks.py"
      - "scripts/analyze_galapagos_source_networks_v2.py"
      - "tests/test_dryad_external_acquisition.py"
      - "tests/test_galapagos_dataone_acquisition.py"
      - "tests/test_galapagos_dryad_schema.py"
      - "tests/test_galapagos_source_networks.py"
      - "docs/GALAPAGOS_DATAONE_RECOVERY.md"
      - ".github/workflows/galapagos-network-analysis.yml"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e . openpyxl pytest
      - name: Test source gates and network analysis
        run: >-
          python -m pytest -q
          tests/test_dryad_external_acquisition.py
          tests/test_galapagos_dataone_acquisition.py
          tests/test_galapagos_dryad_schema.py
          tests/test_galapagos_source_networks.py
      - name: Acquire source-native Dryad files
        id: dryad_acquire
        continue-on-error: true
        run: >-
          python scripts/acquire_dryad_external_dataset.py
          --config config/galapagos_dryad_source.json
          --output-dir artifacts/galapagos_dryad
      - name: Test whether Dryad yielded valid source bytes
        id: dryad_state
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("artifacts/galapagos_dryad/source_inventory.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          print(f"available={'true' if int(data.get('n_downloaded') or 0) > 0 else 'false'}")
          PY
      - name: Try DOI-locked DataONE fallback
        id: dataone_acquire
        if: steps.dryad_state.outputs.available != 'true'
        continue-on-error: true
        run: >-
          python scripts/acquire_galapagos_dataone.py
          --config config/galapagos_dryad_source.json
          --output-dir artifacts/galapagos_dryad
      - name: Detect final source availability
        id: source
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path("artifacts/galapagos_dryad/source_inventory.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          downloaded = int(data.get("n_downloaded") or 0)
          route = data.get("acquisition_route")
          if not route and data.get("selected_version_id") is not None:
              route = "dryad_api_v2"
          print(f"available={'true' if downloaded > 0 else 'false'}")
          print(f"route={route or 'blocked'}")
          print(f"status={data.get('status') or 'inventory_missing'}")
          PY
      - name: Audit source schema
        if: steps.source.outputs.available == 'true'
        run: >-
          python scripts/audit_galapagos_dryad_schema.py
          --input-dir artifacts/galapagos_dryad
          --output artifacts/galapagos_dryad/schema_audit.json
      - name: Run source-admitted analysis
        if: steps.source.outputs.available == 'true'
        run: >-
          python scripts/analyze_galapagos_source_networks_v2.py
          --schema artifacts/galapagos_dryad/schema_audit.json
          --output-dir artifacts/galapagos_analysis
      - name: Materialize result or acquisition diagnosis
        if: always()
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          out = Path("data/results/galapagos/network_analysis")
          out.mkdir(parents=True, exist_ok=True)
          for old in out.iterdir():
              if old.is_file():
                  old.unlink()

          source_path = Path("artifacts/galapagos_dryad/source_inventory.json")
          schema_path = Path("artifacts/galapagos_dryad/schema_audit.json")
          analysis_dir = Path("artifacts/galapagos_analysis")

          if source_path.exists():
              source = json.loads(source_path.read_text(encoding="utf-8"))
              route = source.get("acquisition_route")
              if not route and source.get("selected_version_id") is not None:
                  route = "dryad_api_v2"
              lock = {
                  "status": source.get("status"),
                  "acquisition_route": route or "blocked",
                  "source_id": source.get("source_id"),
                  "dataset_doi": source.get("dataset_doi"),
                  "selected_version_id": source.get("selected_version_id"),
                  "n_source_files": source.get("n_source_files"),
                  "n_downloaded": source.get("n_downloaded"),
                  "file_sha256": {
                      row.get("source_filename"): row.get("sha256")
                      for row in source.get("files", [])
                  },
                  "dataone_object_ids": [
                      row.get("dataone_id")
                      for row in source.get("files", [])
                      if row.get("dataone_id")
                  ],
                  "errors": source.get("errors"),
                  "next_gate": source.get("next_gate"),
                  "claim_boundary": source.get("claim_boundary"),
              }
              (out / "source_lock.json").write_text(
                  json.dumps(lock, indent=2, ensure_ascii=False, default=str) + "\n",
                  encoding="utf-8",
              )
              if int(source.get("n_downloaded") or 0) <= 0:
                  blocked = {
                      "status": "blocked_raw_source_not_recovered",
                      "acquisition_route": route or "dryad_then_dataone",
                      "source_status": source.get("status"),
                      "dataset_doi": source.get("dataset_doi"),
                      "next_gate": source.get("next_gate") or (
                          "Recover data_galapagos_islands.zip through a lawful author, institutional, repository, or user-supplied route."
                      ),
                      "claim_boundary": "No raw-network or biogeographic effect is inferred from failed transport or indexing."
                  }
                  (out / "analysis_blocked.json").write_text(
                      json.dumps(blocked, indent=2, ensure_ascii=False) + "\n",
                      encoding="utf-8",
                  )
              if schema_path.exists():
                  shutil.copy2(schema_path, out / "schema_audit.json")
              if analysis_dir.exists():
                  for path in analysis_dir.iterdir():
                      if path.is_file() and path.suffix.casefold() in {".json", ".csv", ".md"}:
                          shutil.copy2(path, out / path.name)
          else:
              failure = {
                  "status": "acquisition_failed_without_inventory",
                  "acquisition_route": "dryad_then_dataone",
                  "dataset_doi": "10.5061/dryad.0c3cn5f",
                  "claim_boundary": "No network or biogeographic result is inferred from a failed source acquisition."
              }
              (out / "acquisition_failure.json").write_text(
                  json.dumps(failure, indent=2) + "\n", encoding="utf-8"
              )
          PY
      - name: Commit materialized state on push or manual run
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/galapagos/network_analysis
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Galapagos multi-island network analysis"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload full audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galapagos-multi-island-network-analysis
          path: |
            artifacts/galapagos_dryad/
            artifacts/galapagos_analysis/
          if-no-files-found: warn
      - name: Preserve blocked acquisition as a source state
        if: always() && steps.source.outputs.available != 'true'
        run: >-
          echo "::notice::Galapagos raw network analysis remains blocked after
          Dryad and DOI-locked DataONE routes; this is not a biological zero."
