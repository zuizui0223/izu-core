name: Chapter 2 fixed-B48 across-cohort read-only audit once
on:
  push:
    branches:
      - chapter2/crosscohort-kb48-evidence-audit-20261010
    paths:
      - data/dispatch/k-b48-crosscohort-readonly-run-20261010.txt
permissions:
  contents: write
jobs:
  source-only-crosscohort-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate original SHA-pinned cohorts and evidence-rank firewall
        run: python -m pytest -q tests/test_chapter2_k_b48_crosscohort_evidence.py
      - name: Execute pure original-summary JSON audit without any biological simulation
        run: |
          python -m scripts.audit_chapter2_k_at_b48_crosscohort --out results/chapter2/k_at_B48_three_independent_cohorts_posthoc_20261010.json
          python -m json.tool results/chapter2/k_at_B48_three_independent_cohorts_posthoc_20261010.json > /dev/null
      - name: Commit verified post-outcome comparison, never change original results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/chapter2/k_at_B48_three_independent_cohorts_posthoc_20261010.json
          git commit -m "Archive source-pinned descriptive three-cohort K-at-B48 audit"
          git push origin "HEAD:${{ github.ref_name }}"
