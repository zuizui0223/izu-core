name: Dore 2021 Tier-B raw matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/acquire_dore2021_zenodo_raw_interactions.py'
      - 'scripts/audit_dore2021_zenodo_raw_interactions.py'
      - 'data/results/dore2021_zenodo_v1_raw_interaction_source_lock.json'
      - 'data/design/frozen_dore_candidate_network_locations.json'
      - 'data/design/olesen2002_tierb_weighted_source_map.json'
      - 'scripts/acquire_analyze_olesen2002_tierb_weighted.py'
      - 'data/results/olesen2002_tierb_weighted_anchor_source_lock.json'
      - 'data/design/canary_trojelsgaard2015_weighted_source_map.json'
      - 'scripts/acquire_canary_trojelsgaard2015_weighted.py'
      - 'scripts/analyze_canary_trojelsgaard2015_weighted.py'
      - '.github/workflows/dore2021_tierb_raw_matrix.yml'

concurrency:
  group: dore-tierb-raw-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository package
        run: python -m pip install -e .
      - name: Acquire Zenodo v1 raw interaction table
        run: python scripts/acquire_dore2021_zenodo_raw_interactions.py
      - name: Audit raw schema and frozen Region_pub coverage
        run: python scripts/audit_dore2021_zenodo_raw_interactions.py
      - name: Recover and analyze Olesen 2002 frequency matrices
        run: python scripts/acquire_analyze_olesen2002_tierb_weighted.py
      - name: Recover Canary Trøjelsgaard 2015 weighted matrices
        run: python scripts/acquire_canary_trojelsgaard2015_weighted.py
      - name: Analyze preregistered Canary island aggregations
        run: python scripts/analyze_canary_trojelsgaard2015_weighted.py
      - name: Show source and weighted-anchor gates
        run: |
          cat data/results/dore2021_zenodo_v1_raw_interaction_source_gate.json
          cat data/results/dore2021_zenodo_v1_raw_interaction_schema_audit.json
          cat data/results/olesen2002_tierb_weighted_anchor.json
          cat data/results/canary_trojelsgaard2015_weighted_source_gate.json
          cat data/results/canary_trojelsgaard2015_weighted_tierb.json
      - name: Upload Tier-B source artifact
        uses: actions/upload-artifact@v4
        with:
          name: dore2021-tierb-raw-matrix
          path: |
            data/results/dore2021_zenodo_v1_raw_interaction_source_gate.json
            data/results/dore2021_zenodo_v1_raw_interaction_schema_audit.json
            data/results/olesen2002_tierb_weighted_anchor.json
            data/results/canary_trojelsgaard2015_weighted_source_gate.json
            data/results/canary_trojelsgaard2015_weighted_tierb.json
            data/external/dore2021_zenodo_v1/network interaction data.txt
            data/external/olesen2002_iwdb/
            data/external/canary_trojelsgaard2015/
          if-no-files-found: warn
