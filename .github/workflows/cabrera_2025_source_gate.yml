name: Cabrera 2025 v8 source gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/design/abm_v8_cabrera_source_gate_v1.json'
      - 'scripts/acquire_audit_cabrera_2025_source.py'
      - 'tests/test_cabrera_2025_source_gate.py'
      - '.github/workflows/cabrera_2025_source_gate.yml'

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Run source-only Cabrera audit
        run: python scripts/acquire_audit_cabrera_2025_source.py
      - name: Enforce source-only boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/cabrera_2025_source_audit.json'))
          assert x['target_metrics_calculated'] is False
          print('status', x['status'])
          print('source admission', x['source_admission_succeeds'])
          print('source bytes ok', x['source_bytes_ok'])
          print('raw repeated pair records', x.get('raw_repeated_pair_interaction_records_visible'))
          print('headers', x.get('csv_schema',{}).get('headers'))
          print('roles', x.get('csv_schema',{}).get('role_candidates'))
          print('cardinalities', x.get('csv_schema',{}).get('structural_cardinalities'))
          for row in x.get('files', []):
              print('FILE', row.get('name'), row.get('bytes'), row.get('sha256'), row.get('http_status'))
          PY
      - name: Run source-gate regression tests
        run: python -m pytest -q tests/test_cabrera_2025_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: cabrera-2025-v8-source-gate
          path: |
            data/results/cabrera_2025_source_audit.json
            data/external/cabrera_2025/**
