name: One-time Chapter 2 postzygotic old-history smoke
on:
  push:
    branches: [ops/chapter2-postzygotic-old-history-smoke-20261009]
    paths:
      - .github/workflows/one-time-chapter2-postzygotic-old-smoke.yml
permissions:
  contents: read
jobs:
  old-history-smoke:
    if: github.event.head_commit.message == 'ops-chapter2-run-old-postzygotic-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate all four gates and exact OLD-history control replay
        run: pytest -q tests/test_chapter2_postzygotic_viability_gate.py
