name: One-time archive exact Chapter 2 independent window readout
on:
  push:
    branches:
      - chapter2/window-independent-negative-result-20261009
    paths:
      - .github/workflows/one-time-archive-independent-window.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-exact-confirmatory-result:
    if: github.event.head_commit.message == 'ops-chapter2-archive-independent-window'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download successful frozen complete-cohort readout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/window
          gh run download 37862121201 --repo zuizui0223/izu-core \
            --name budget-window-independent-confirmatory-readout \
            --dir /tmp/window
          test -s /tmp/window/independent_window_confirmation.json
          printf '%s  %s\n' \
            fa3d4103b3f3a84781c052907012a0dfed13caebb247c80f4c34b760a536cc58 \
            /tmp/window/independent_window_confirmation.json | sha256sum -c -
          python - <<'PY'
          import json
          x=json.load(open('/tmp/window/independent_window_confirmation.json'))
          assert x['status']=='all_2048_new_sources_57344_futures_admitted'
          assert x['independent_visitor_histories']==64
          assert x['primary']['predeclared_joint_decision']=='window_residual_practically_equivalent'
          assert not x['primary']['window_gate_passed'] and not x['primary']['smooth_gate_passed']
          PY
          mkdir -p results/chapter2
          cp /tmp/window/independent_window_confirmation.json \
            results/chapter2/independent_window_confirmation_20261009.json
      - name: Commit archived exact source result to result-only branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/chapter2/independent_window_confirmation_20261009.json
          git commit -m 'results(chapter2): preserve independently confirmed window equivalence JSON'
          git push origin HEAD:chapter2/window-independent-negative-result-20261009
