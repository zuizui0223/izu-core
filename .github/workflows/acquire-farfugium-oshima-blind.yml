name: Acquire Farfugium Oshima blind cards

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/acquire_farfugium_oshima_blind_cards.py"
      - "paper/render_blind_photo_contact_sheets.py"
      - "data/predictive_meta/photo_cohort_manifest.csv"
      - "data/predictive_meta/prospective_functional_control.csv"
      - ".github/workflows/acquire-farfugium-oshima-blind.yml"
  pull_request:
    paths:
      - "scripts/acquire_farfugium_oshima_blind_cards.py"
      - "paper/render_blind_photo_contact_sheets.py"
      - "data/predictive_meta/photo_cohort_manifest.csv"
      - "data/predictive_meta/prospective_functional_control.csv"
      - ".github/workflows/acquire-farfugium-oshima-blind.yml"

jobs:
  acquire-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image renderer
        run: python -m pip install pillow
      - name: Acquire blinded Oshima candidates
        run: python scripts/acquire_farfugium_oshima_blind_cards.py
      - name: Render blind contact sheets
        run: >-
          python paper/render_blind_photo_contact_sheets.py
          --blind artifacts/farfugium_oshima_blind/blind_cards.csv
          --output-dir artifacts/farfugium_oshima_blind/contact_sheets
      - name: Upload blind review bundle
        uses: actions/upload-artifact@v4
        with:
          name: farfugium-oshima-blind-review
          path: |
            artifacts/farfugium_oshima_blind/blind_cards.csv
            artifacts/farfugium_oshima_blind/summary.json
            artifacts/farfugium_oshima_blind/contact_sheets/
      - name: Upload protected key separately
        uses: actions/upload-artifact@v4
        with:
          name: farfugium-oshima-protected-key
          path: artifacts/farfugium_oshima_blind/protected_key.csv
