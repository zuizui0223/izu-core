name: Chapter 2 Mangal repeated-network screen

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Screen all Mangal datasets before island review
        run: python scripts/audit_mangal_repeated_network_candidates.py
      - name: Upload Mangal source-structure screen
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-mangal-repeated-network-screen
          path: data/results/chapter2_mangal_repeated_network_candidate_screen_20260914.json
          if-no-files-found: error
