name: Chapter 2 Mahé 2014 source audit

on:
  pull_request:
    paths:
      - 'scripts/audit_mahe2014_natural_regime_source.py'
      - '.github/workflows/chapter2_wol_candidate_audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Audit Mahé 2014 source-native mapping before coordinates
        run: python scripts/audit_mahe2014_natural_regime_source.py
      - name: Upload source-only Mahé audit
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-mahe2014-source-audit
          path: data/results/chapter2_mahe2014_natural_regime_source_audit_20260914.json
          if-no-files-found: error
