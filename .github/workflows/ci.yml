name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run pytest
        run: |
          pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml 2>&1 | tee pytest-${{ matrix.python-version }}.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload pytest reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: error

  model3-k32-decomposition:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify conditional finite-genotype moments and rounding
        run: pytest -q tests/test_model3_k32_nonlinearity_rounding.py
      - name: Source-locked decomposition over eight updates, budget8
        run: python -m scripts.audit_model3_k32_nonlinearity_rounding --out decomposition-budget8.json --budget 8 --draws 512 --rounds 256
      - name: Source-locked decomposition over eight updates, budget3
        run: python -m scripts.audit_model3_k32_nonlinearity_rounding --out decomposition-budget3.json --budget 3 --draws 512 --rounds 256
      - name: Verify source provenance and identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              r=json.loads(Path(f"decomposition-budget{budget}.json").read_text())
              c=r["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["budget"]) == (32,0,8,budget)
              assert c["visitor_history"]==26110601 and c["independent_visitor_histories"]==1
              assert c["prospective_confirmatory_histories_used"] is False
              assert c["canonical_biology_modified"] is False
              assert r["decomposition"]["nonlinear_causal_effect_identified"] is False
              assert len(r["steps"])==8
              for s in r["steps"]:
                  for k in r["outcomes"]:
                      x=s["components"]
                      assert abs(x["total_realized_minus_representative"][k]-(
                          x["finite_realization_residual"][k]+
                          x["population_state_distribution_contrast"][k]+
                          x["rounding_convention_contrast"][k]))<1e-10
              print("budget",budget,"source-locked telescoping and lineage safeguards verified")
          PY
      - name: Archive simulation diagnostics only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-decomposition-engineering
          path: decomposition-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-pathwise:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test conditional Mendelian expectation and surviving-path telescoping
        run: pytest -q tests/test_model3_k32_pathwise_selection_drift.py
      - name: Run source-locked pathwise budget8
        run: python -m scripts.audit_model3_k32_pathwise_selection_drift --out pathwise-budget8.json --budget 8 --draws 512
      - name: Run source-locked pathwise budget3
        run: python -m scripts.audit_model3_k32_pathwise_selection_drift --out pathwise-budget3.json --budget 3 --draws 512
      - name: Reject history leaks and check exact decomposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          for budget in (8,3):
              d=json.loads(Path(f"pathwise-budget{budget}.json").read_text())
              c=d["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"]) == (32,0,8,budget)
              assert c["old_visitor_history"]==26110601 and c["independent_visitor_histories"]==1
              assert c["canonical_model3_biology_modified"] is False
              assert c["new_confirmatory_histories_used"] is False
              assert len(d["per_generation"])==8
              assert d["n_surviving_through_eight"]+d["n_extinct_by_eight"]==512
              final=d["surviving_trajectories"]
              assert final["pathwise_max_absolute_identity_error"]<1e-10
              for step in d["per_generation"]:
                  if step["single_step_source_identity_max_error"] is not None:
                      assert step["single_step_source_identity_max_error"]<1e-10
              print("source exact allele-frequency identity PASS",budget)
          PY
      - name: Archive simulated allele-frequency paths (NOT observed data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-pathwise-direction-vs-sampling
          path: pathwise-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-neutral-boundary:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify neutral Mendelian mass and exact allele-frequency martingale
        run: pytest -q tests/test_model3_k32_neutral_census_control.py
      - name: Run source vs neutral matched-census K32 budget8
        run: python -m scripts.audit_model3_k32_neutral_census_control --out neutral-budget8.json --budget 8 --draws 512
      - name: Run source vs neutral matched-census K32 budget3
        run: python -m scripts.audit_model3_k32_neutral_census_control --out neutral-budget3.json --budget 3 --draws 512
      - name: Audit source and neutral interpretation guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          for budget in (8,3):
              r=json.loads(Path(f"neutral-budget{budget}.json").read_text())
              c=r["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
              assert c["old_visitor_history"]==26110601
              assert c["independent_visitor_histories"]==1
              assert c["canonical_source_biology_edited"] is False
              assert c["neutral_control_intentionally_different_reproductive_operator"] is True
              assert c["neutral_census_forced_to_source_same_trajectory"] is True
              assert c["confirmatory_cohorts_used"] is False
              assert r["same_realized_census_each_year"] is True
              assert c["n_source_survivors"]+c["n_source_extinct"]==512
              p=np.asarray(r["source_survivor_endpoint_high_allele_frequency"]["mean"])
              neutral=np.asarray(r["neutral_survivor_endpoint_high_allele_frequency"]["mean"])
              diff=np.asarray(r["paired_survivor_source_minus_neutral"]["mean"])
              assert np.allclose(p-neutral,diff,atol=1e-12,rtol=0)
              print("old-history neutral martingale vs source contrast passed:",budget,diff)
          PY
      - name: Archive source-matched neutral counterfactual simulation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-neutral-matched-census
          path: neutral-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-mean-matched-ceiling:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test source-lock, calibration and allele-loss boundary
        run: pytest -q tests/test_model3_k32_mean_matched_ceiling.py
      - name: Run retrospective mean-matched assurance comparator budget8
        run: python -m scripts.audit_model3_k32_mean_matched_ceiling --out ceiling-budget8.json --budget 8 --draws 512
      - name: Run retrospective mean-matched assurance comparator budget3
        run: python -m scripts.audit_model3_k32_mean_matched_ceiling --out ceiling-budget3.json --budget 3 --draws 512
      - name: Verify each source generation matched and no invalid promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              r=json.loads(Path(f"ceiling-budget{budget}.json").read_text())
              assert r["status"]=="EXPLORATORY_MEAN_MATCHED_CEILING_COMPARATOR_COMPLETE",r
              c=r["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
              assert c["old_visitor_history"]==26110601 and c["independent_visitor_histories"]==1
              assert c["no_confirmatory_cohorts_used"] is True
              assert c["source_model3_biology_edited"] is False
              assert c["comparator_intentionally_changes_mating_payoffs"] is True
              assert c["comparator_reweighted_after_exposure_to_source_outcomes"] is True
              assert c["same_realized_census_every_year"] is True
              assert len(r["per_generation"])==8
              assert c["n_surviving"]+c["n_extinct"]==512
              for row in r["per_generation"]:
                  assert abs(row["calibrated_conditional_mean"]-row["source_mean"])<1e-7
              for arm in ("source","mean_matched_comparator"):
                  assert abs(r[arm]["cumulative_frequency_variance"]["covariance_identity_error"])<1e-10
              b=r["paired_MC_precision"]
              assert b["paired_demographic_bootstrap_resamples"]==1024
              assert b["independent_ecological_replicates"]==1
              assert b["paired_survivors"]==c["n_surviving"]
              for name in ("source_minus_comparator_variance_mc_95_percentile",
                           "source_minus_comparator_twice_covariance_mc_95_percentile",
                           "source_minus_comparator_fixation_rate_mc_95_percentile"):
                  assert len(b[name])==2 and b[name][0]<=b[name][1]
              print("Exploratory matched-mean comparator source/methodology integrity PASS",budget)
          PY
      - name: Archive source-conditioned mean-matched comparator, not field data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-mean-matched-ceiling-exploratory
          path: ceiling-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-demographic-holdout:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify source-neutral calibration split without evaluation leakage
        run: pytest -q tests/test_model3_k32_mean_matched_holdout.py
      - name: Fit on train demographic cohorts and evaluate unseen cohorts budget8
        run: python -m scripts.audit_model3_k32_mean_matched_holdout --out holdout-budget8.json --draws 512 --budget 8
      - name: Fit on train demographic cohorts and evaluate unseen cohorts budget3
        run: python -m scripts.audit_model3_k32_mean_matched_holdout --out holdout-budget3.json --draws 512 --budget 3
      - name: Reverse calibration and evaluation demographic folds budget8
        run: python -m scripts.audit_model3_k32_mean_matched_holdout --out holdout-budget8-reverse.json --draws 512 --budget 8 --train-half second
      - name: Reverse calibration and evaluation demographic folds budget3
        run: python -m scripts.audit_model3_k32_mean_matched_holdout --out holdout-budget3-reverse.json --draws 512 --budget 3 --train-half second
      - name: Assert no held-out outcomes in parameter training and quarantine exploratory result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
            for side,suffix in (("first",""),("second","-reverse")):
                d=json.loads(Path(f"holdout-budget{budget}{suffix}.json").read_text())
                assert d["status"]=="K32_HELDOUT_DEMOGRAPHIC_MEAN_MATCH_EVALUATED",d
                c=d["conditions"]
                assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
                assert c["old_history"]==26110601 and c["n_independent_visitor_histories"]==1
                assert c["training_half"]==side
                assert c["train_demographic_draws"]==256
                assert c["holdout_demographic_draws"]==256
                assert c["holdout_outcomes_used_in_calibration"] is False
                assert c["source_biology_unchanged"] is True
                assert c["control_intentionally_differs_in_reproduction"] is True
                assert c["confirmatory_visitor_cohorts_used"] is False
                assert len(d["per_generation"])==8
                assert d["demographic_holdout"]["status"]=="COMPARABLE"
                for row in d["per_generation"]:
                    assert row["coefficient_did_not_access_holdout"] is True
                    assert abs(row["train_control_conditional_mean"]-row["train_source_target"])<1e-7
                print("K32 demographic heldout source-lock and no-leak gates PASS",budget)
          PY
      - name: Archive exploratory demographic-holdout JSON, not ecological data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-demographic-holdout
          path: holdout-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-same-parent-moments:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test exact Mendelian same-mean heterozygosity variance identity
        run: pytest -q tests/test_model3_k32_same_parent_heterozygosity.py
      - name: Audit eight-source states with same parental genotype census budget8
        run: python -m scripts.audit_model3_k32_same_parent_heterozygosity --out same-parent-budget8.json --budget 8 --draws 512
      - name: Audit eight-source states with same parental genotype census budget3
        run: python -m scripts.audit_model3_k32_same_parent_heterozygosity --out same-parent-budget3.json --budget 3 --draws 512
      - name: Enforce historical genetic source and exact matched-mean identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              d=json.loads(Path(f"same-parent-budget{budget}.json").read_text())
              c=d["conditions"]
              assert d["status"]=="SOURCE_MATCHED_MOMENT_DIAGNOSTIC_COMPLETED",d["support_failures"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["budget"])==(32,0,8,budget)
              assert c["old_visitor_history"]==26110601
              assert c["independent_visitor_histories"]==1
              assert c["confirmatory_cohorts_accessed"] is False
              assert c["source_biology_edited"] is False
              assert c["comparator_is_autonomous_eight_year_forecast"] is False
              assert c["comparison_parent_state_identical_between_operators"] is True
              assert c["comparison_offspring_mean_identical_between_operators"] is True
              assert c["comparison_offspring_census_law_identical_between_operators"] is True
              assert len(d["per_generation"])==8
              for year in d["per_generation"]:
                  assert year["exact_identity_max_absolute_error"] < 1e-11
              print("same-parent analytical source and matched-mean variance PASS",budget)
          PY
      - name: Archive same-parent conditional moments, not observations
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-same-parent-heterozygosity
          path: same-parent-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-local-assurance-response:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test source-matched one-copy perturbations and fixed-state exclusion
        run: pytest -q tests/test_model3_k32_local_assurance_response.py
      - name: Compute original Model3 vs matched-baseline directional null budget8
        run: python -m scripts.audit_model3_k32_local_assurance_response --out local-response-budget8.json --budget 8 --draws 128
      - name: Compute original Model3 vs matched-baseline directional null budget3
        run: python -m scripts.audit_model3_k32_local_assurance_response --out local-response-budget3.json --budget 3 --draws 128
      - name: Audit checkpoint preservation and nonidentifiable fixation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              d=json.loads(Path(f"local-response-budget{budget}.json").read_text())
              assert d["status"]=="OLD_HISTORY_EXACT_SOURCE_LOCAL_ASSURANCE_PERTURBATION"
              c=d["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
              assert c["old_visitor_history"]==26110601
              assert c["independent_visitor_histories"]==1
              assert c["confirmatory_history_reused"] is False
              assert c["canonical_model3_biology_modified"] is False
              assert c["counterfactual_alters_reproductive_operator"] is True
              assert c["boundary_states_excluded_from_matched_tilt"] is True
              assert set(d["checkpoints"])=={"3","5","7","8"}
              for row in d["checkpoints"].values():
                  for key in ("assurance_high_to_low","assurance_low_to_high"):
                      a=row[key]
                      if a["n"]:
                          assert abs(a["mean_source_minus_control"]-(a["mean_source_slope"]-a["mean_control_slope"]))<1e-10
              print("K32 local assurance source-vs-baseline-matched perturbation PASS",budget)
          PY
      - name: Archive simulated one-copy response surfaces, not observed data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-local-assurance-response
          path: local-response-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-symmetric-assurance:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate same-background heterozygote bidirectional perturbations
        run: pytest -q tests/test_model3_k32_symmetric_assurance_curvature.py
      - name: Sample source assurance response curvature before years 3 5 7 8 budget8
        run: python -m scripts.audit_model3_k32_symmetric_assurance_curvature --out symmetric-budget8.json --budget 8 --draws 128
      - name: Sample source assurance response curvature before years 3 5 7 8 budget3
        run: python -m scripts.audit_model3_k32_symmetric_assurance_curvature --out symmetric-budget3.json --budget 3 --draws 128
      - name: Verify source and fixed-baseline matched comparison scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              x=json.loads(Path(f"symmetric-budget{budget}.json").read_text())
              c=x["conditions"]
              assert x["status"]=="SOURCE_SAME_HETEROZYGOTE_SYMMETRIC_RESPONSE_AUDIT"
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
              assert c["old_visitor_history"]==26110601 and c["independent_visitor_histories"]==1
              assert c["new_confirmatory_cohorts_reused"] is False
              assert c["original_model3_biology_modified"] is False
              assert c["parent_genotype_identical_in_two_flip_orientations"] is True
              assert c["baseline_comparator_tilt_frozen_under_both_flips"] is True
              assert set(x["checkpoints"])=={"3","5","7","8"}
              for row in x["checkpoints"].values():
                  assert row["n_comparable_heterozygote_states"]+sum(row["ineligible_states"].values())==row["n_occupied"]
                  assert row["same_genotype_bidirectional_summary"]["n"]==row["n_comparable_heterozygote_states"]
              print("same heterozygote, same source biology, same old visitor history PASS",budget)
          PY
      - name: Archive symmetric same-genotype assay JSON, not plant observations
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-symmetric-assurance
          path: symmetric-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-self-outcross:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test exact canonical self and pollen outcross ledger decomposition
        run: pytest -q tests/test_model3_k32_self_outcross_mechanism.py
      - name: Old-history K32 source-ledger self vs outcross budget8
        run: python -m scripts.audit_model3_k32_self_outcross_mechanism --out self-outcross-budget8.json --budget 8 --draws 512
      - name: Old-history K32 source-ledger self vs outcross budget3
        run: python -m scripts.audit_model3_k32_self_outcross_mechanism --out self-outcross-budget3.json --budget 3 --draws 512
      - name: Verify three-term Mendelian ledger identity and source boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              d=json.loads(Path(f"self-outcross-budget{budget}.json").read_text())
              assert d["status"]=="EXACT_SELF_OUTCROSS_DECOMPOSITION_VERIFIED", d["unmatched_states"]
              c=d["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
              assert c["old_visitor_history"]==26110601
              assert c["independent_visitor_histories"]==1
              assert c["canonical_model3_biology_modified"] is False
              assert c["confirmatory_history_used"] is False
              assert c["reference_is_autonomous_population_simulation"] is False
              assert c["source_parent_and_matched_offspring_mean_and_recruitment_law_identical"] is True
              assert len(d["per_generation"])==8
              for row in d["per_generation"]:
                  assert row["max_absolute_analytic_identity_error"] < 1e-10
                  assert abs(sum(row["terms"].values())-row["mean_source_minus_null_frequency_variance"])<1e-10
              print("exact 3-part source biological ledger match PASS",budget)
          PY
      - name: Archive simulated old-history reproduction ledgers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-self-outcross-decomposition
          path: self-outcross-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-outcross-factors:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test exact source outcross factorization and Shapley ordering
        run: pytest -q tests/test_model3_k32_outcross_factors.py
      - name: Audit source K32 outcross parent factors budget8
