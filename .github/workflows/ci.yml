name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # TEMPORARY source-audit step; archive full numeric JSON, then restore main CI workflow.
      - name: Archive visitor factorial exploratory diagnostic
        if: matrix.python-version == '3.11'
        run: |
          python -m scripts.audit_chapter2_visitor_richness_composition_factorial --out visitor-factorial-20261010.json
      - name: Upload visitor factorial exploratory diagnostic
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-visitor-factorial-exploratory-20261010
          path: visitor-factorial-20261010.json
          if-no-files-found: error
      - name: Run pytest
        run: |
          pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml 2>&1 | tee pytest-${{ matrix.python-version }}.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload pytest reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
