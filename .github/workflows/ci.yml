name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run pytest
        run: |
          pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml 2>&1 | tee pytest-${{ matrix.python-version }}.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload pytest reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: error

  archived-q2-read-only:
    # This run is an archival DATA READBACK on a single draft PR head,
    # never a Model3 population update, and has no permissions to push.
    if: github.event_name == 'pull_request' && github.head_ref == 'analysis/q2-archived-threshold-sensitivity-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit-only dependencies
        run: python -m pip install numpy==2.2.6 pytest==8.4.2
      - name: Test original response-clock reader contract
        run: python -m pytest -q tests/test_chapter2_archived_clock_thresholds_20261014.py
      - name: Download six frozen existing original-source ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/q2_clock_archives
          gh release download four-question-resolution-20261013 \
            --repo zuizui0223/izu-core \
            --pattern 'CLOCK_PILOT_*_ORIGINAL_20261014.zip' \
            --dir work/q2_clock_archives
          test "$(find work/q2_clock_archives -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 6
      - name: Compare original saved 201-census responses at four thresholds
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          shards = ("main_c0","main_c3","main_c4","confirmation_c0","confirmation_c3","confirmation_c4")
          cmd = ["python", "scripts/audit_chapter2_archived_clock_thresholds_20261014.py",
                 "--out", "work/q2_clock_archives/THRESHOLD_SENSITIVITY_REVIEW_ONLY.json"]
          for name in shards:
              archive = Path("work/q2_clock_archives") / ("CLOCK_PILOT_"+name+"_ORIGINAL_20261014.zip")
              if not archive.is_file():
                  raise SystemExit("HOLD: missing exact published original "+name)
              cmd.extend(["--archive", name, str(archive)])
          subprocess.run(cmd, check=True)
          PY
      - name: Upload only source-verified original-data readout
        uses: actions/upload-artifact@v4
        with:
          name: q2-threshold-sensitivity-source-only
          path: work/q2_clock_archives/THRESHOLD_SENSITIVITY_REVIEW_ONLY.json
          if-no-files-found: error
          retention-days: 30
