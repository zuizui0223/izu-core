name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run pytest
        run: |
          pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml 2>&1 | tee pytest-${{ matrix.python-version }}.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Run RNG-corrected Chapter 2 relational robustness audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_chapter2_relational_robustness --out data/results/chapter2_relational_robustness_rng_corrected_20260922.json
      - name: Upload RNG-corrected Chapter 2 relational robustness audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-relational-robustness-rng-corrected
          path: data/results/chapter2_relational_robustness_rng_corrected_20260922.json
          if-no-files-found: error
      - name: Run RNG-corrected Chapter 2 realized-richness matching audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_chapter2_realized_richness_matching --out data/results/chapter2_realized_richness_matching_rng_corrected_20260922.json
      - name: Upload RNG-corrected Chapter 2 realized-richness matching audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-realized-richness-matching-rng-corrected
          path: data/results/chapter2_realized_richness_matching_rng_corrected_20260922.json
          if-no-files-found: error
      - name: Run Chapter 2 finite-community system-size audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_chapter2_finite_community_system_size --out data/results/chapter2_finite_community_system_size_rng_corrected_20260922.json
      - name: Upload Chapter 2 finite-community system-size audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-finite-community-system-size-rng-corrected
          path: data/results/chapter2_finite_community_system_size_rng_corrected_20260922.json
          if-no-files-found: error
      - name: Run finite-N Gaussian mean-field audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_finite_n_gaussian_mean_field --out data/results/finite_n_gaussian_mean_field_20260908.json
      - name: Upload finite-N Gaussian mean-field audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: finite-n-gaussian-mean-field-audit
          path: data/results/finite_n_gaussian_mean_field_20260908.json
          if-no-files-found: error
      - name: Run active-adjustment system-size rank crossover audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_trait_adjustment_system_size_rank_crossover --out data/results/chapter2_trait_adjustment_system_size_rank_crossover_rng_corrected_20260922.json
      - name: Upload active-adjustment system-size rank crossover audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-trait-adjustment-system-size-rank-crossover-rng-corrected
          path: data/results/chapter2_trait_adjustment_system_size_rank_crossover_rng_corrected_20260922.json
          if-no-files-found: error
      - name: Run six-bin natural synchrony sensitivity
        if: matrix.python-version == '3.11'
        continue-on-error: true
        run: |
          python -m scripts.run_chapter2_phi_timebin_rarefaction_from_locked_sources \
            --work-dir /tmp/chapter2-phi-rarefaction \
            --out data/results/chapter2_phi_timebin_rarefaction_20260922.json
      - name: Upload six-bin natural synchrony sensitivity
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-phi-timebin-rarefaction
          path: data/results/chapter2_phi_timebin_rarefaction_20260922.json
          if-no-files-found: warn
      - name: Upload pytest reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
