name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify model-source investment nonfocal ledger and all original 14 conflicts (PR 452)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 452 && matrix.python-version == '3.11'
        run: |
          pytest -q tests/test_chapter2_investment_nonneighbor_externality.py
          python -m scripts.audit_chapter2_investment_nonneighbor_externality --out chapter2-investment-nonfocal-externality.json
      - name: Archive all original finite investment externality cell diagnostics (PR 452)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 452 && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-investment-nonfocal-externality
          path: |
            chapter2-investment-nonfocal-externality.json
            data/design/chapter2_investment_nonneighbor_externality_audit_20261010.json
          if-no-files-found: error
      - name: Validate commons investment-only pilot and prospective power, no reserved seeds (PR 452)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 452 && matrix.python-version == '3.11'
        run: pytest -q tests/test_chapter2_investment_commons_pilot_power.py
      - name: Run all 384 bounded commons feasibility paths and paired exact power simulations (PR 452)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 452 && matrix.python-version == '3.11'
        run: python -m scripts.audit_chapter2_investment_commons_pilot_power --out chapter2-investment-commons-pilot-power.json
      - name: Preserve source-locked initial-investment commons feasibility and statistical power (PR 452)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 452 && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-investment-commons-feasibility-power
          path: |
            chapter2-investment-commons-pilot-power.json
            data/design/chapter2_investment_commons_pilot_power_20261010.json
          if-no-files-found: error
      - name: Run pytest
        run: |
          pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml 2>&1 | tee pytest-${{ matrix.python-version }}.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload pytest reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
