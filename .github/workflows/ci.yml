name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: One-off Sicily Bombus source audit
        if: github.head_ref == 'agent/el-higher-order-sufficiency' && matrix.python-version == '3.11'
        run: python scripts/audit_sicily_bombus_natural_regime_source.py
      - name: One-off EuPPollNet repeated-locality screen
        if: github.head_ref == 'agent/el-higher-order-sufficiency' && matrix.python-version == '3.11'
        run: python scripts/audit_euppollnet_repeated_locality_candidates.py
      - name: One-off Aegean Petanidou source audit
        if: github.head_ref == 'agent/el-higher-order-sufficiency' && matrix.python-version == '3.11'
        run: python scripts/audit_petanidou_aegean_natural_regime_source.py
      - name: Upload one-off natural source screens
        if: github.head_ref == 'agent/el-higher-order-sufficiency' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-sicily-euppollnet-aegean-source-screens
          path: |
            data/results/chapter2_sicily_bombus_natural_regime_source_audit_20260914.json
            data/results/chapter2_euppollnet_repeated_locality_screen_20260914.json
            data/results/chapter2_petanidou_aegean_natural_regime_source_audit_20260915.json
          if-no-files-found: error
      - name: Run pytest
        run: |
          pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml 2>&1 | tee pytest-${{ matrix.python-version }}.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Run Chapter 2 relational robustness audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_chapter2_relational_robustness --out data/results/chapter2_relational_robustness_audit_frozen_20260831.json
      - name: Upload Chapter 2 relational robustness audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-relational-robustness-audit
          path: data/results/chapter2_relational_robustness_audit_frozen_20260831.json
          if-no-files-found: error
      - name: Run Chapter 2 realized-richness matching audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_chapter2_realized_richness_matching --out data/results/chapter2_realized_richness_matching_frozen_20260907.json
      - name: Upload Chapter 2 realized-richness matching audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-realized-richness-audit
          path: data/results/chapter2_realized_richness_matching_frozen_20260907.json
          if-no-files-found: error
      - name: Run Chapter 2 finite-community system-size audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_chapter2_finite_community_system_size --out data/results/chapter2_finite_community_system_size_20260908.json
      - name: Upload Chapter 2 finite-community system-size audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-finite-community-system-size-audit
          path: data/results/chapter2_finite_community_system_size_20260908.json
          if-no-files-found: error
      - name: Run finite-N Gaussian mean-field audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_finite_n_gaussian_mean_field --out data/results/finite_n_gaussian_mean_field_20260908.json
      - name: Upload finite-N Gaussian mean-field audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: finite-n-gaussian-mean-field-audit
          path: data/results/finite_n_gaussian_mean_field_20260908.json
          if-no-files-found: error
      - name: Run active-adjustment system-size rank crossover audit
        if: matrix.python-version == '3.11'
        run: python -m scripts.audit_trait_adjustment_system_size_rank_crossover --out data/results/chapter2_trait_adjustment_system_size_rank_crossover_v2_20260910.json
      - name: Upload active-adjustment system-size rank crossover audit
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-trait-adjustment-system-size-rank-crossover-audit-v2
          path: data/results/chapter2_trait_adjustment_system_size_rank_crossover_v2_20260910.json
          if-no-files-found: error
      - name: Upload pytest reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
