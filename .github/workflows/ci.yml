name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run pytest
        run: |
          pytest -q --junitxml=pytest-${{ matrix.python-version }}.xml 2>&1 | tee pytest-${{ matrix.python-version }}.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload pytest reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-failure
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: error

  model3-k32-decomposition:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify conditional finite-genotype moments and rounding
        run: pytest -q tests/test_model3_k32_nonlinearity_rounding.py
      - name: Source-locked decomposition over eight updates, budget8
        run: python -m scripts.audit_model3_k32_nonlinearity_rounding --out decomposition-budget8.json --budget 8 --draws 512 --rounds 256
      - name: Source-locked decomposition over eight updates, budget3
        run: python -m scripts.audit_model3_k32_nonlinearity_rounding --out decomposition-budget3.json --budget 3 --draws 512 --rounds 256
      - name: Verify source provenance and identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              r=json.loads(Path(f"decomposition-budget{budget}.json").read_text())
              c=r["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["budget"]) == (32,0,8,budget)
              assert c["visitor_history"]==26110601 and c["independent_visitor_histories"]==1
              assert c["prospective_confirmatory_histories_used"] is False
              assert c["canonical_biology_modified"] is False
              assert r["decomposition"]["nonlinear_causal_effect_identified"] is False
              assert len(r["steps"])==8
              for s in r["steps"]:
                  for k in r["outcomes"]:
                      x=s["components"]
                      assert abs(x["total_realized_minus_representative"][k]-(
                          x["finite_realization_residual"][k]+
                          x["population_state_distribution_contrast"][k]+
                          x["rounding_convention_contrast"][k]))<1e-10
              print("budget",budget,"source-locked telescoping and lineage safeguards verified")
          PY
      - name: Archive simulation diagnostics only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-decomposition-engineering
          path: decomposition-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-pathwise:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test conditional Mendelian expectation and surviving-path telescoping
        run: pytest -q tests/test_model3_k32_pathwise_selection_drift.py
      - name: Run source-locked pathwise budget8
        run: python -m scripts.audit_model3_k32_pathwise_selection_drift --out pathwise-budget8.json --budget 8 --draws 512
      - name: Run source-locked pathwise budget3
        run: python -m scripts.audit_model3_k32_pathwise_selection_drift --out pathwise-budget3.json --budget 3 --draws 512
      - name: Reject history leaks and check exact decomposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          for budget in (8,3):
              d=json.loads(Path(f"pathwise-budget{budget}.json").read_text())
              c=d["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"]) == (32,0,8,budget)
              assert c["old_visitor_history"]==26110601 and c["independent_visitor_histories"]==1
              assert c["canonical_model3_biology_modified"] is False
              assert c["new_confirmatory_histories_used"] is False
              assert len(d["per_generation"])==8
              assert d["n_surviving_through_eight"]+d["n_extinct_by_eight"]==512
              final=d["surviving_trajectories"]
              assert final["pathwise_max_absolute_identity_error"]<1e-10
              for step in d["per_generation"]:
                  if step["single_step_source_identity_max_error"] is not None:
                      assert step["single_step_source_identity_max_error"]<1e-10
              print("source exact allele-frequency identity PASS",budget)
          PY
      - name: Archive simulated allele-frequency paths (NOT observed data)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-pathwise-direction-vs-sampling
          path: pathwise-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-neutral-boundary:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify neutral Mendelian mass and exact allele-frequency martingale
        run: pytest -q tests/test_model3_k32_neutral_census_control.py
      - name: Run source vs neutral matched-census K32 budget8
        run: python -m scripts.audit_model3_k32_neutral_census_control --out neutral-budget8.json --budget 8 --draws 512
      - name: Run source vs neutral matched-census K32 budget3
        run: python -m scripts.audit_model3_k32_neutral_census_control --out neutral-budget3.json --budget 3 --draws 512
      - name: Audit source and neutral interpretation guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          for budget in (8,3):
              r=json.loads(Path(f"neutral-budget{budget}.json").read_text())
              c=r["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
              assert c["old_visitor_history"]==26110601
              assert c["independent_visitor_histories"]==1
              assert c["canonical_source_biology_edited"] is False
              assert c["neutral_control_intentionally_different_reproductive_operator"] is True
              assert c["neutral_census_forced_to_source_same_trajectory"] is True
              assert c["confirmatory_cohorts_used"] is False
              assert r["same_realized_census_each_year"] is True
              assert c["n_source_survivors"]+c["n_source_extinct"]==512
              p=np.asarray(r["source_survivor_endpoint_high_allele_frequency"]["mean"])
              neutral=np.asarray(r["neutral_survivor_endpoint_high_allele_frequency"]["mean"])
              diff=np.asarray(r["paired_survivor_source_minus_neutral"]["mean"])
              assert np.allclose(p-neutral,diff,atol=1e-12,rtol=0)
              print("old-history neutral martingale vs source contrast passed:",budget,diff)
          PY
      - name: Archive source-matched neutral counterfactual simulation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-neutral-matched-census
          path: neutral-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-mean-matched-ceiling:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test source-lock, calibration and allele-loss boundary
        run: pytest -q tests/test_model3_k32_mean_matched_ceiling.py
      - name: Run retrospective mean-matched assurance comparator budget8
        run: python -m scripts.audit_model3_k32_mean_matched_ceiling --out ceiling-budget8.json --budget 8 --draws 512
      - name: Run retrospective mean-matched assurance comparator budget3
        run: python -m scripts.audit_model3_k32_mean_matched_ceiling --out ceiling-budget3.json --budget 3 --draws 512
      - name: Verify each source generation matched and no invalid promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              r=json.loads(Path(f"ceiling-budget{budget}.json").read_text())
              assert r["status"]=="EXPLORATORY_MEAN_MATCHED_CEILING_COMPARATOR_COMPLETE",r
              c=r["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
              assert c["old_visitor_history"]==26110601 and c["independent_visitor_histories"]==1
              assert c["no_confirmatory_cohorts_used"] is True
              assert c["source_model3_biology_edited"] is False
              assert c["comparator_intentionally_changes_mating_payoffs"] is True
              assert c["comparator_reweighted_after_exposure_to_source_outcomes"] is True
              assert c["same_realized_census_every_year"] is True
              assert len(r["per_generation"])==8
              assert c["n_surviving"]+c["n_extinct"]==512
              for row in r["per_generation"]:
                  assert abs(row["calibrated_conditional_mean"]-row["source_mean"])<1e-7
              for arm in ("source","mean_matched_comparator"):
                  assert abs(r[arm]["cumulative_frequency_variance"]["covariance_identity_error"])<1e-10
              b=r["paired_MC_precision"]
              assert b["paired_demographic_bootstrap_resamples"]==1024
              assert b["independent_ecological_replicates"]==1
              assert b["paired_survivors"]==c["n_surviving"]
              for name in ("source_minus_comparator_variance_mc_95_percentile",
                           "source_minus_comparator_twice_covariance_mc_95_percentile",
                           "source_minus_comparator_fixation_rate_mc_95_percentile"):
                  assert len(b[name])==2 and b[name][0]<=b[name][1]
              print("Exploratory matched-mean comparator source/methodology integrity PASS",budget)
          PY
      - name: Archive source-conditioned mean-matched comparator, not field data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-mean-matched-ceiling-exploratory
          path: ceiling-budget*.json
          if-no-files-found: warn
          retention-days: 90

  model3-k32-demographic-holdout:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 420
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify source-neutral calibration split without evaluation leakage
        run: pytest -q tests/test_model3_k32_mean_matched_holdout.py
      - name: Fit on train demographic cohorts and evaluate unseen cohorts budget8
        run: python -m scripts.audit_model3_k32_mean_matched_holdout --out holdout-budget8.json --draws 512 --budget 8
      - name: Fit on train demographic cohorts and evaluate unseen cohorts budget3
        run: python -m scripts.audit_model3_k32_mean_matched_holdout --out holdout-budget3.json --draws 512 --budget 3
      - name: Assert no held-out outcomes in parameter training and quarantine exploratory result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for budget in (8,3):
              d=json.loads(Path(f"holdout-budget{budget}.json").read_text())
              assert d["status"]=="K32_HELDOUT_DEMOGRAPHIC_MEAN_MATCH_EVALUATED",d
              c=d["conditions"]
              assert (c["K"],c["mutation_rate"],c["generations"],c["ovule_budget"])==(32,0,8,budget)
              assert c["old_history"]==26110601 and c["n_independent_visitor_histories"]==1
              assert c["train_demographic_draws"]==256
              assert c["holdout_demographic_draws"]==256
              assert c["holdout_outcomes_used_in_calibration"] is False
              assert c["source_biology_unchanged"] is True
              assert c["control_intentionally_differs_in_reproduction"] is True
              assert c["confirmatory_visitor_cohorts_used"] is False
              assert len(d["per_generation"])==8
              assert d["demographic_holdout"]["status"]=="COMPARABLE"
              for row in d["per_generation"]:
                  assert row["coefficient_did_not_access_holdout"] is True
                  assert abs(row["train_control_conditional_mean"]-row["train_source_target"])<1e-7
              print("K32 demographic heldout source-lock and no-leak gates PASS",budget)
          PY
      - name: Archive exploratory demographic-holdout JSON, not ecological data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model3-k32-demographic-holdout
          path: holdout-budget*.json
          if-no-files-found: warn
          retention-days: 90
