name: Wanshan-Yongxing external validation

on:
  workflow_dispatch:
  push:
    paths:
      - "channel_id/external_archipelago_network.py"
      - "config/wanshan_yongxing_dryad_source.json"
      - "config/wanshan_yongxing_dryad_version_lock.json"
      - "data/design/cross_archipelago_external_validation.json"
      - "scripts/acquire_wanshan_yongxing_dryad.py"
      - "scripts/acquire_wanshan_yongxing_presigned.py"
      - "scripts/analyze_wanshan_yongxing_networks.py"
      - "tests/test_external_archipelago_network.py"
      - "tests/test_cross_archipelago_external_validation.py"
      - "docs/CROSS_ARCHIPELAGO_EXTERNAL_VALIDATION.md"
      - ".github/workflows/wanshan-yongxing-external-validation.yml"
  pull_request:
    paths:
      - "channel_id/external_archipelago_network.py"
      - "config/wanshan_yongxing_dryad_source.json"
      - "config/wanshan_yongxing_dryad_version_lock.json"
      - "data/design/cross_archipelago_external_validation.json"
      - "scripts/acquire_wanshan_yongxing_dryad.py"
      - "scripts/acquire_wanshan_yongxing_presigned.py"
      - "scripts/analyze_wanshan_yongxing_networks.py"
      - "tests/test_external_archipelago_network.py"
      - "tests/test_cross_archipelago_external_validation.py"
      - "docs/CROSS_ARCHIPELAGO_EXTERNAL_VALIDATION.md"
      - ".github/workflows/wanshan-yongxing-external-validation.yml"

jobs:
  external-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook and test dependencies
        run: python -m pip install -e . openpyxl pytest
      - name: Run transparent network and registry tests
        run: >-
          python -m pytest -q
          tests/test_external_archipelago_network.py
          tests/test_cross_archipelago_external_validation.py
      - name: Acquire source-native Dryad workbook
        id: acquire
        continue-on-error: true
        run: |
          python scripts/acquire_wanshan_yongxing_dryad.py || \
          python scripts/acquire_wanshan_yongxing_presigned.py
      - name: Reanalyse whole and matched shared-plant networks
        if: steps.acquire.outcome == 'success'
        run: python scripts/analyze_wanshan_yongxing_networks.py
      - name: Upload acquisition and analysis audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanshan-yongxing-external-validation
          path: |
            artifacts/wanshan_yongxing_dryad/
            artifacts/wanshan_yongxing_analysis/
      - name: Fail after preserving acquisition diagnostics
        if: steps.acquire.outcome != 'success'
        run: exit 1
