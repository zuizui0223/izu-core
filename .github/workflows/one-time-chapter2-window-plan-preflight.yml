name: One-time independent-window OLD-history-free plan preflight
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-chapter2-window-plan-preflight.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch-plan-preflight:
    if: github.event.head_commit.message == 'ops-chapter2-window-preflight-only'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch plan-only preflight, with production approval FALSE
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/dispatch.json
          import os, json
          print(json.dumps({"ref": "main", "inputs": {
              "mode": "preflight_only",
              "full_cohort_launch_approved": "false",
              "source_commit_sha": os.environ["SOURCE_SHA"]
          }}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/chapter2-order-budget-window-independent.yml/dispatches" \
            --data-binary @/tmp/dispatch.json
          echo "Dispatched safe plan-only preflight for $SOURCE_SHA"
