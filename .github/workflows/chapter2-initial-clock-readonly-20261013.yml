name: Chapter 2 initial clock read-only audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-t0-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reader/test dependencies
        run: python -m pip install 'numpy==2.2.6' 'pytest>=8,<10'
      - name: Verify actual frozen summary and tests
        run: |
          python -m pytest -q tests/test_chapter2_initial_clock_identifiability_20261013.py tests/test_chapter2_initial_clock_raw_20261013.py
          python scripts/audit_chapter2_initial_clock_identifiability_20261013.py \
            --input data/results/ecological_order_boundary_20261013.json \
            --out "$RUNNER_TEMP/initial_clock_summary_oracles.json"
      - name: Download exact previously published original raw ZIP (no new biology)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download four-question-resolution-20261013 \
            --repo zuizui0223/izu-core \
            --pattern ecological_order_actual_github_38312090996.zip \
            --dir "$RUNNER_TEMP"
          printf '%s  %s\n' \
            '819741aa4a9f5bc1aaf2dadddbd56b79d158fc9295d07fc3bffe362693fc056a' \
            "$RUNNER_TEMP/ecological_order_actual_github_38312090996.zip" | sha256sum --check --status
      - name: Audit original initial-genotype and genetic-return features
        run: |
          python -m scripts.audit_chapter2_initial_clock_raw_20261013 \
            --outer "$RUNNER_TEMP/ecological_order_actual_github_38312090996.zip" \
            --compact data/results/ecological_order_boundary_20261013.json \
            --out "$RUNNER_TEMP/initial_clock_18_t0_features.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'initial_clock_18_t0_features.json'
          j=json.loads(p.read_text())
          assert j['cases']==2304 and j['distinct_initial_profiles']==18
          print('ALL2304_ORIGINAL_INITIAL_FEATURES_ADMITTED')
          for r in j['t0_feature_profiles']:
              print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-initial-clock-readonly-t0-features
          path: |
            ${{ runner.temp }}/initial_clock_summary_oracles.json
            ${{ runner.temp }}/initial_clock_18_t0_features.json
          retention-days: 30