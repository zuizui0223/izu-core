name: Chapter 2 island-history exploratory pilot

on:
  push:
    branches:
      - chapter2/island-history-transplant-20261008
    paths:
      - '.github/workflows/chapter2-island-history-pilot.yml'
      - 'data/design/chapter2_island_history_transplant_20261008.json'
      - 'scripts/run_chapter2_island_history_transplant.py'
      - 'scripts/summarize_chapter2_island_history_transplant.py'
      - 'tests/test_chapter2_island_history_transplant.py'
  workflow_dispatch:

concurrency:
  group: island-history-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_chapter2_island_history_transplant.py
      - run: python -m scripts.run_chapter2_island_history_transplant --out outputs/island_history_pilot --dry-run

  exploratory-shards:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Execute predeclared island-history ABM pilot shard
        run: |
          python -m scripts.run_chapter2_island_history_transplant \
            --out outputs/island_history_pilot \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-island-history-pilot-shard-${{ matrix.shard }}
          retention-days: 30
          if-no-files-found: error
          path: outputs/island_history_pilot/*

  exploratory-readout:
    needs: exploratory-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter2-island-history-pilot-shard-*
          merge-multiple: true
          path: outputs/island_history_pilot
      - name: Reject missing or mismatched cases before any biological interpretation
        run: |
          python -m scripts.summarize_chapter2_island_history_transplant \
            --input outputs/island_history_pilot \
            --out outputs/island_history_pilot/exploratory_readout.json
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-island-history-exploratory-readout
          retention-days: 90
          if-no-files-found: error
          path: outputs/island_history_pilot/exploratory_readout.json
