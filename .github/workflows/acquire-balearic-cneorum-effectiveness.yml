name: Acquire Balearic Cneorum effectiveness data

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/balearic_cneorum_effectiveness_dryad_source.json"
      - "scripts/acquire_dryad_external_dataset.py"
      - "scripts/acquire_balearic_cneorum_package.py"
      - "scripts/analyze_balearic_cneorum_effectiveness.py"
      - "data/results/balearic_cneorum_effectiveness_summary.json"
      - "tests/test_balearic_cneorum_effectiveness.py"
      - ".github/workflows/acquire-balearic-cneorum-effectiveness.yml"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Try source-native Dryad file API
        id: file_api
        continue-on-error: true
        run: >-
          python scripts/acquire_dryad_external_dataset.py
          --config config/balearic_cneorum_effectiveness_dryad_source.json
          --output-dir artifacts/balearic_cneorum_effectiveness
      - name: Try public full-package routes
        id: package
        if: steps.file_api.outcome != 'success'
        continue-on-error: true
        run: >-
          python scripts/acquire_balearic_cneorum_package.py
          --config config/balearic_cneorum_effectiveness_dryad_source.json
          --output-dir artifacts/balearic_cneorum_effectiveness
      - name: Analyze source-native data when bytes are available
        if: steps.file_api.outcome == 'success' || steps.package.outcome == 'success'
        shell: bash
        run: |
          if [[ -f scripts/analyze_balearic_cneorum_effectiveness.py ]]; then
            python scripts/analyze_balearic_cneorum_effectiveness.py
          else
            echo "Analyzer not added yet; acquisition inventory only."
          fi
      - name: Upload source/analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balearic-cneorum-effectiveness-audit
          path: artifacts/balearic_cneorum_effectiveness/
          if-no-files-found: error
      - name: Fail if all public byte routes are blocked
        if: steps.file_api.outcome != 'success' && steps.package.outcome != 'success'
        run: exit 1
