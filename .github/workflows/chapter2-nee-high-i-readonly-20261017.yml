name: NEE high-I archived-source diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-i-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing package (no biological model producer invoked)
        run: python -m pip install -e '.[dev]'
      - name: Source-only HIGH-I support diagnostic
        run: |
          python -m scripts.audit_chapter2_nee_high_i_support_20261017 \
            --output "${RUNNER_TEMP}/HIGH_I_EXISTING_ARCHIVE_SOURCE_ONLY.json"
      - name: Independently verify committed HIGH-I audit against original arrays
        run: python -m scripts.verify_chapter2_nee_high_i_readback_20261017
      - name: Test result source consistency and negative controls
        run: pytest -q tests/test_chapter2_nee_high_i_support_20261017.py tests/test_chapter2_nee_upgrade_20261017.py
      - uses: actions/upload-artifact@v4
        with:
          name: nee-high-i-existing-source-only
          path: ${{ runner.temp }}/HIGH_I_EXISTING_ARCHIVE_SOURCE_ONLY.json
          retention-days: 30
