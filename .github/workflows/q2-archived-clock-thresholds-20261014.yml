name: Q2 archived response-threshold sensitivity (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-frozen-six-original-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact revision (never generate biological paths)
        uses: actions/checkout@v4

      - name: Install fixed read-only interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit-only packages
        run: python -m pip install numpy==2.2.6 pytest==8.4.2

      - name: Run synthetic contract tests (no biology)
        run: python -m pytest -q tests/test_chapter2_archived_clock_thresholds_20261014.py

      - name: Fetch six existing original-source published ZIPs (only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/q2_clock_archives
          gh release download four-question-resolution-20261013 \
            --repo zuizui0223/izu-core \
            --pattern 'CLOCK_PILOT_*_ORIGINAL_20261014.zip' \
            --dir work/q2_clock_archives
          test "$(find work/q2_clock_archives -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 6

      - name: Recompute threshold sensitivity on old verified bytes (zero biology)
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          shards = ("main_c0","main_c3","main_c4","confirmation_c0","confirmation_c3","confirmation_c4")
          cmd = ["python", "scripts/audit_chapter2_archived_clock_thresholds_20261014.py",
                 "--out", "work/q2_clock_archives/THRESHOLD_SENSITIVITY_REVIEW_ONLY.json"]
          for name in shards:
              zip_path = Path("work/q2_clock_archives") / ("CLOCK_PILOT_" + name + "_ORIGINAL_20261014.zip")
              if not zip_path.is_file():
                  raise SystemExit("HOLD: missing original archived source "+name)
              cmd.extend(["--archive",name,str(zip_path)])
          subprocess.run(cmd,check=True)
          PY

      - name: Publish only compact reviewed sensitivity record
        uses: actions/upload-artifact@v4
        with:
          name: q2-clock-posthoc-threshold-readout-${{ github.sha }}
          path: work/q2_clock_archives/THRESHOLD_SENSITIVITY_REVIEW_ONLY.json
          if-no-files-found: error
          retention-days: 30
