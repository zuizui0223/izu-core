name: Galapagos published-summary analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "data/source_tables/galapagos_nnakenyi_2019_tables_1_2.csv"
      - "data/source_tables/galapagos_nnakenyi_2019_tables_1_2_source.json"
      - "scripts/analyze_galapagos_published_summary.py"
      - "tests/test_galapagos_published_summary.py"
      - "data/results/galapagos/published_summary/**"
      - "docs/GALAPAGOS_PUBLISHED_SUMMARY_ANALYSIS.md"
      - ".github/workflows/galapagos-published-summary.yml"
  pull_request:
    paths:
      - "data/source_tables/galapagos_nnakenyi_2019_tables_1_2.csv"
      - "data/source_tables/galapagos_nnakenyi_2019_tables_1_2_source.json"
      - "scripts/analyze_galapagos_published_summary.py"
      - "tests/test_galapagos_published_summary.py"
      - "data/results/galapagos/published_summary/**"
      - "docs/GALAPAGOS_PUBLISHED_SUMMARY_ANALYSIS.md"
      - ".github/workflows/galapagos-published-summary.yml"

permissions:
  contents: write

jobs:
  analyse-published-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Test source table, calculations, and claim boundaries
        run: python -m pytest -q tests/test_galapagos_published_summary.py
      - name: Rebuild published-summary outputs
        run: >-
          python scripts/analyze_galapagos_published_summary.py
          --input data/source_tables/galapagos_nnakenyi_2019_tables_1_2.csv
          --output-dir artifacts/galapagos_published_summary
      - name: Verify checked outputs on pull requests
        if: github.event_name == 'pull_request'
        run: |
          cmp artifacts/galapagos_published_summary/analysis.json \
              data/results/galapagos/published_summary/analysis.json
          cmp artifacts/galapagos_published_summary/island_model_diagnostics.csv \
              data/results/galapagos/published_summary/island_model_diagnostics.csv
      - name: Materialize checked outputs on push or manual run
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p data/results/galapagos/published_summary
          cp artifacts/galapagos_published_summary/analysis.json \
             data/results/galapagos/published_summary/analysis.json
          cp artifacts/galapagos_published_summary/island_model_diagnostics.csv \
             data/results/galapagos/published_summary/island_model_diagnostics.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/galapagos/published_summary
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Galapagos published-summary analysis"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload reproducible published-summary outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galapagos-published-summary-analysis
          path: artifacts/galapagos_published_summary/
          if-no-files-found: error
