name: One-time archive independent window readout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-chapter2-window-result-archive.yml
permissions:
  contents: write
  actions: read
jobs:
  archive-verified-result:
    if: github.event.head_commit.message == 'ops-chapter2-archive-independent-window-result'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter2/independent-window-full-readout-20261009
          persist-credentials: true
      - name: Download exact successful independent confirmatory readout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/independent-window
          gh run download 37862121201 \
            --repo "${{ github.repository }}" \
            --name budget-window-independent-confirmatory-readout \
            --dir /tmp/independent-window
          echo 'fa3d4103b3f3a84781c052907012a0dfed13caebb247c80f4c34b760a536cc58  /tmp/independent-window/independent_window_confirmation.json' | sha256sum -c -
      - name: Verify exact all-case admission and frozen negative decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/independent-window/independent_window_confirmation.json').read_text())
          assert x['status']=='all_2048_new_sources_57344_futures_admitted'
          assert x['independent_visitor_histories']==64
          assert (x['prehistories'], x['future_branches'])==(2048,57344)
          assert x['primary']['predeclared_joint_decision']=='window_residual_practically_equivalent'
          assert x['primary']['window_gate_passed'] is False
          assert x['primary']['smooth_gate_passed'] is False
          print('Exact complete new-cohort practical-equivalence decision verified.')
          PY
      - name: Commit exact readout bytes to the result-archive review branch
        run: |
          set -euo pipefail
          mkdir -p results/chapter2
          cp /tmp/independent-window/independent_window_confirmation.json \
             results/chapter2/order_budget_window_independent_20261009.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/chapter2/order_budget_window_independent_20261009.json
          git diff --cached --quiet && { echo 'Result already archived.'; exit 0; }
          git commit -m 'results(chapter2): archive verified independent window practical equivalence'
          git push origin HEAD:chapter2/independent-window-full-readout-20261009
