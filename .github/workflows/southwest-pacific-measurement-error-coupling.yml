name: Southwest Pacific measurement-error coupling

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_southwest_pacific_measurement_error_coupling.py"
      - "scripts/apply_southwest_pacific_effect_admission_gate.py"
      - "tests/test_southwest_pacific_measurement_error_coupling.py"
      - "tests/test_southwest_pacific_effect_admission_gate.py"
      - "data/results/southwest_pacific_pairs/analysis_summary.json"
      - "data/results/southwest_pacific_pairs/effect_rows.json"
      - "data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity.csv"
      - "data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json"
      - ".github/workflows/southwest-pacific-measurement-error-coupling.yml"
  pull_request:
    paths:
      - "scripts/audit_southwest_pacific_measurement_error_coupling.py"
      - "scripts/apply_southwest_pacific_effect_admission_gate.py"
      - "tests/test_southwest_pacific_measurement_error_coupling.py"
      - "tests/test_southwest_pacific_effect_admission_gate.py"
      - "data/results/southwest_pacific_pairs/analysis_summary.json"
      - "data/results/southwest_pacific_pairs/effect_rows.json"
      - "data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json"
      - ".github/workflows/southwest-pacific-measurement-error-coupling.yml"

permissions:
  contents: write

jobs:
  coupling-sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -e . pytest
      - name: Test measurement-error partial-identification and admission guards
        run: >-
          python -m pytest -q
          tests/test_southwest_pacific_measurement_error_coupling.py
          tests/test_southwest_pacific_effect_admission_gate.py
      - name: Generate sensitivity table
        run: >-
          python scripts/audit_southwest_pacific_measurement_error_coupling.py
          --analysis-summary data/results/southwest_pacific_pairs/analysis_summary.json
          --output-csv artifacts/swp_coupling/measurement_error_coupling_sensitivity.csv
          --summary-output artifacts/swp_coupling/measurement_error_coupling_sensitivity_summary.json
      - name: Apply effect-admission gate
        run: >-
          python scripts/apply_southwest_pacific_effect_admission_gate.py
          --effect-rows data/results/southwest_pacific_pairs/effect_rows.json
          --coupling-summary artifacts/swp_coupling/measurement_error_coupling_sensitivity_summary.json
          --output artifacts/swp_coupling/effect_rows.json
      - name: Audit checked-output freshness
        run: |
          if test -f data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity.csv \
             && test -f data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json \
             && test -f data/results/southwest_pacific_pairs/effect_rows.json; then
            diff -u data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity.csv \
                    artifacts/swp_coupling/measurement_error_coupling_sensitivity.csv \
              || echo "::notice::Checked coupling CSV is stale and will be rematerialized on push/manual runs."
            diff -u data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json \
                    artifacts/swp_coupling/measurement_error_coupling_sensitivity_summary.json \
              || echo "::notice::Checked coupling summary is stale and will be rematerialized on push/manual runs."
            diff -u data/results/southwest_pacific_pairs/effect_rows.json \
                    artifacts/swp_coupling/effect_rows.json \
              || echo "::notice::Checked effect rows are stale and will be rematerialized on push/manual runs."
          else
            echo "::notice::Checked coupling outputs are not materialized yet."
          fi
      - name: Materialize checked outputs on push or manual run
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p data/results/southwest_pacific_pairs
          cp artifacts/swp_coupling/measurement_error_coupling_sensitivity.csv \
             data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity.csv
          cp artifacts/swp_coupling/measurement_error_coupling_sensitivity_summary.json \
             data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json
          cp artifacts/swp_coupling/effect_rows.json \
             data/results/southwest_pacific_pairs/effect_rows.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity.csv \
                  data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json \
                  data/results/southwest_pacific_pairs/effect_rows.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Southwest Pacific coupling sensitivity"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Upload sensitivity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: southwest-pacific-measurement-error-coupling
          path: artifacts/swp_coupling/
          if-no-files-found: error
