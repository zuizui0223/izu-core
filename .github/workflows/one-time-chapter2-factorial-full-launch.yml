name: One-time reviewed Chapter 2 viability factorial launch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-chapter2-factorial-full-launch.yml
permissions:
  contents: read
  actions: write
jobs:
  launch:
    if: github.event.head_commit.message == 'ops-chapter2-approved-viability-factorial-launch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no changed scientific source since approved PR 427
        run: |
          set -euo pipefail
          git diff --exit-code af9e860f604de9aa5ec80bc1d28ba4f25c751377 "$GITHUB_SHA" -- scripts data tests
          git diff --exit-code af9e860f604de9aa5ec80bc1d28ba4f25c751377 "$GITHUB_SHA" -- .github/workflows/chapter2-postzygotic-factorial.yml
      - name: Dispatch explicitly approved full future intervention on exact reviewed main source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/factorial_dispatch.json
          import json, os
          print(json.dumps({"ref":"main","inputs":{
            "mode":"full_cohort",
            "full_cohort_launch_approved":"true",
            "source_commit_sha":os.environ["SOURCE_SHA"]
          }}))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/chapter2-postzygotic-factorial.yml/dispatches" \
            --data-binary @/tmp/factorial_dispatch.json
          echo "Authorized Chapter 2 factorial launch dispatched to $SOURCE_SHA"
