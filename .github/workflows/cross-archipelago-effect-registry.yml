name: Cross-archipelago effect registry

on:
  workflow_dispatch:
  push:
    paths:
      - "channel_id/paired_effect_uncertainty.py"
      - "scripts/compile_cross_archipelago_effect_registry.py"
      - "scripts/augment_cross_archipelago_effect_registry.py"
      - "scripts/summarize_wanshan_yongxing_effects.py"
      - "scripts/apply_southwest_pacific_effect_admission_gate.py"
      - "tests/test_cross_archipelago_effect_registry.py"
      - "tests/test_cross_archipelago_effect_registry_augmentation.py"
      - "tests/test_wanshan_yongxing_effects.py"
      - "tests/test_southwest_pacific_effect_admission_gate.py"
      - "data/results/cross_archipelago_effect_registry.csv"
      - "data/results/cross_archipelago_effect_registry_summary.json"
      - "data/results/wanshan_yongxing/effect_rows.json"
      - "data/results/ogasawara/context_analysis/effect_rows.json"
      - "data/results/southwest_pacific_pairs/effect_rows.json"
      - "data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json"
      - "docs/CROSS_ARCHIPELAGO_EFFECT_REGISTRY.md"
      - "data/predictive_meta/hiraiwa_ushimaru_continuous_functional_exposure.json"
      - "data/predictive_meta/hiraiwa_ushimaru_fdq_full_covariates.json"
      - "data/results/wanshan_yongxing/**"
      - "data/results/ogasawara/**"
      - "data/results/galapagos/**"
      - "data/results/southwest_pacific_pairs/**"
      - ".github/workflows/cross-archipelago-effect-registry.yml"
  pull_request:
    paths:
      - "channel_id/paired_effect_uncertainty.py"
      - "scripts/compile_cross_archipelago_effect_registry.py"
      - "scripts/augment_cross_archipelago_effect_registry.py"
      - "scripts/summarize_wanshan_yongxing_effects.py"
      - "scripts/apply_southwest_pacific_effect_admission_gate.py"
      - "tests/test_cross_archipelago_effect_registry.py"
      - "tests/test_cross_archipelago_effect_registry_augmentation.py"
      - "tests/test_wanshan_yongxing_effects.py"
      - "tests/test_southwest_pacific_effect_admission_gate.py"
      - "data/results/cross_archipelago_effect_registry.csv"
      - "data/results/cross_archipelago_effect_registry_summary.json"
      - "data/results/wanshan_yongxing/effect_rows.json"
      - "data/results/ogasawara/context_analysis/effect_rows.json"
      - "data/results/southwest_pacific_pairs/effect_rows.json"
      - "data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json"
      - "docs/CROSS_ARCHIPELAGO_EFFECT_REGISTRY.md"
      - "data/predictive_meta/hiraiwa_ushimaru_continuous_functional_exposure.json"
      - "data/predictive_meta/hiraiwa_ushimaru_fdq_full_covariates.json"
      - "data/results/wanshan_yongxing/**"
      - "data/results/ogasawara/**"
      - "data/results/galapagos/**"
      - "data/results/southwest_pacific_pairs/**"
      - ".github/workflows/cross-archipelago-effect-registry.yml"

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Run effect-admission tests
        run: >-
          python -m pytest -q
          tests/test_cross_archipelago_effect_registry.py
          tests/test_cross_archipelago_effect_registry_augmentation.py
          tests/test_wanshan_yongxing_effects.py
          tests/test_southwest_pacific_flower_size_analysis.py
          tests/test_southwest_pacific_effect_admission_gate.py
      - name: Recompile base registry
        run: >-
          python scripts/compile_cross_archipelago_effect_registry.py
          --csv-output artifacts/cross_archipelago_effect_registry/registry.csv
          --summary-output artifacts/cross_archipelago_effect_registry/summary.json
      - name: Apply Southwest Pacific measurement-error admission gate
        run: >-
          python scripts/apply_southwest_pacific_effect_admission_gate.py
          --effect-rows data/results/southwest_pacific_pairs/effect_rows.json
          --coupling-summary data/results/southwest_pacific_pairs/measurement_error_coupling_sensitivity_summary.json
          --output artifacts/cross_archipelago_effect_registry/southwest_pacific_effect_rows_gated.json
      - name: Admit source-specific Ogasawara and gated Southwest Pacific effects
        run: >-
          python scripts/augment_cross_archipelago_effect_registry.py
          --registry artifacts/cross_archipelago_effect_registry/registry.csv
          --summary artifacts/cross_archipelago_effect_registry/summary.json
          --ogasawara-effects data/results/ogasawara/context_analysis/effect_rows.json
          --southwest-pacific-effects artifacts/cross_archipelago_effect_registry/southwest_pacific_effect_rows_gated.json
      - name: Verify checked effect rows and summary
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          def read_rows(path):
              with Path(path).open(encoding="utf-8", newline="") as handle:
                  return list(csv.DictReader(handle))

          generated = read_rows(
              "artifacts/cross_archipelago_effect_registry/registry.csv"
          )
          checked = read_rows(
              "data/results/cross_archipelago_effect_registry.csv"
          )

          # Numerical effects are frozen exactly. Source-state paths/statuses may
          # legitimately move when a remote repository becomes reachable, but
          # they must remain nonnumeric and causally closed.
          def effect_index(rows):
              return {
                  row["effect_id"]: row
                  for row in rows
                  if row["estimate"]
                  or row["row_role"] in {
                      "external_effect",
                      "external_context_effect",
                  }
              }

          assert effect_index(generated) == effect_index(checked)
          for row in generated:
              if row["row_role"] in {"source_state", "blocked_state"}:
                  assert row["estimate"] == ""
                  assert row["cross_system_model_eligible"] == "no"
                  assert row["causal_claim_allowed"] == "no"

          generated_summary = json.loads(
              Path(
                  "artifacts/cross_archipelago_effect_registry/summary.json"
              ).read_text(encoding="utf-8")
          )
          checked_summary = json.loads(
              Path(
                  "data/results/cross_archipelago_effect_registry_summary.json"
              ).read_text(encoding="utf-8")
          )
          assert generated_summary == checked_summary

          gated_effects = json.loads(
              Path(
                  "artifacts/cross_archipelago_effect_registry/southwest_pacific_effect_rows_gated.json"
              ).read_text(encoding="utf-8")
          )
          checked_effects = json.loads(
              Path("data/results/southwest_pacific_pairs/effect_rows.json").read_text(
                  encoding="utf-8"
              )
          )
          assert gated_effects == checked_effects
          PY
      - name: Upload registry audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-archipelago-effect-registry
          path: artifacts/cross_archipelago_effect_registry/
          if-no-files-found: error
