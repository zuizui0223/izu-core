name: Cross-archipelago effect registry

on:
  workflow_dispatch:
  push:
    paths:
      - "channel_id/paired_effect_uncertainty.py"
      - "scripts/compile_cross_archipelago_effect_registry.py"
      - "scripts/summarize_wanshan_yongxing_effects.py"
      - "tests/test_cross_archipelago_effect_registry.py"
      - "tests/test_wanshan_yongxing_effects.py"
      - "data/results/cross_archipelago_effect_registry.csv"
      - "data/results/cross_archipelago_effect_registry_summary.json"
      - "data/results/wanshan_yongxing/effect_rows.json"
      - "docs/CROSS_ARCHIPELAGO_EFFECT_REGISTRY.md"
      - "data/predictive_meta/hiraiwa_ushimaru_continuous_functional_exposure.json"
      - "data/predictive_meta/hiraiwa_ushimaru_fdq_full_covariates.json"
      - "data/results/wanshan_yongxing/**"
      - "data/results/ogasawara/**"
      - "data/results/galapagos/**"
      - "data/results/southwest_pacific_pairs/**"
      - ".github/workflows/cross-archipelago-effect-registry.yml"
  pull_request:
    paths:
      - "channel_id/paired_effect_uncertainty.py"
      - "scripts/compile_cross_archipelago_effect_registry.py"
      - "scripts/summarize_wanshan_yongxing_effects.py"
      - "tests/test_cross_archipelago_effect_registry.py"
      - "tests/test_wanshan_yongxing_effects.py"
      - "data/results/cross_archipelago_effect_registry.csv"
      - "data/results/cross_archipelago_effect_registry_summary.json"
      - "data/results/wanshan_yongxing/effect_rows.json"
      - "docs/CROSS_ARCHIPELAGO_EFFECT_REGISTRY.md"
      - "data/predictive_meta/hiraiwa_ushimaru_continuous_functional_exposure.json"
      - "data/predictive_meta/hiraiwa_ushimaru_fdq_full_covariates.json"
      - "data/results/wanshan_yongxing/**"
      - "data/results/ogasawara/**"
      - "data/results/galapagos/**"
      - "data/results/southwest_pacific_pairs/**"
      - ".github/workflows/cross-archipelago-effect-registry.yml"

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Run effect-admission tests
        run: >-
          python -m pytest -q
          tests/test_cross_archipelago_effect_registry.py
          tests/test_wanshan_yongxing_effects.py
      - name: Recompile registry
        run: >-
          python scripts/compile_cross_archipelago_effect_registry.py
          --csv-output artifacts/cross_archipelago_effect_registry/registry.csv
          --summary-output artifacts/cross_archipelago_effect_registry/summary.json
      - name: Verify checked registry
        run: |
          cmp artifacts/cross_archipelago_effect_registry/registry.csv \
              data/results/cross_archipelago_effect_registry.csv
          cmp artifacts/cross_archipelago_effect_registry/summary.json \
              data/results/cross_archipelago_effect_registry_summary.json
      - name: Upload registry audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-archipelago-effect-registry
          path: artifacts/cross_archipelago_effect_registry/
          if-no-files-found: error
