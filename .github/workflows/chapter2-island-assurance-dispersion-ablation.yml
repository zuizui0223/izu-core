name: Chapter 2 island assurance dispersion ablation replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter2-island-assurance-dispersion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/test_chapter2_island_assurance_dispersion_ablation.py
      - run: |
          python -m scripts.run_chapter2_island_assurance_dispersion_ablation \
            --out outputs/assurance-dispersion --shard-index 0 \
            --shard-count 4 --dry-run

  replay-shards:
    needs: verify-design
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Run complete declared factorial shard
        run: |
          python -m scripts.run_chapter2_island_assurance_dispersion_ablation \
            --out outputs/assurance-dispersion \
            --shard-index ${{ matrix.shard }} --shard-count 4 \
            --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: assurance-dispersion-shard-${{ matrix.shard }}
          retention-days: 90
          if-no-files-found: error
          path: outputs/assurance-dispersion/assurance_dispersion_shard_*.json

  verify-readout:
    needs: replay-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          pattern: assurance-dispersion-shard-*
          merge-multiple: true
          path: outputs/assurance-dispersion
      - run: |
          python -m scripts.summarize_chapter2_island_assurance_dispersion_ablation \
            --input outputs/assurance-dispersion \
            --out outputs/assurance-dispersion/verified_readout.json
      - name: Verify every setting, background, mutation and dispersion level
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          got=json.loads(Path("outputs/assurance-dispersion/verified_readout.json").read_text())
          record=json.loads(Path("data/results/chapter2_island_assurance_dispersion_ablation_20261008.json").read_text())
          assert got["n_postshock_trajectories"] == record["n_trajectories"] == 3072
          assert got["n_matched_condition_sets"] == record["n_matched_stress_cells"] == 1024
          assert len(got["result"]) == len(record["per_setting_background_mutation"]) == 16
          for row in got["result"]:
              original=next(x for x in record["per_setting_background_mutation"]
                  if (x["setting"],x["recipient_background"],x["post_mutation_rate"])
                  == (row["setting"],row["recipient_background"],row["post_mutation_rate"]))
              assert abs(row["occupancy_delta_q0_minus_q1"]-original["q0_minus_q1"]) < 1e-12
              assert abs(row["occupancy_delta_q05_minus_q1"]-original["q05_minus_q1"]) < 1e-12
              for q,label in (("0.0","0"),("0.5","0.5"),("1.0","1")):
                  cur=row["treatments"][q]
                  assert cur["n_trajectories"] == original["n_trajectories_per_scale"] == 64
                  assert abs(cur["terminal_occupancy"]-
                      original["terminal_occupancy_by_dispersion_scale"][label]) < 1e-12
          earlier=json.loads(Path("data/results/chapter2_island_genetic_state_transplant_independent16_20261008.json").read_text())
          assert earlier["frozen_primary"]["passed"] is False
          print("full-grid dispersion readout matches existing exploratory result; prior failed gate retained")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: assurance-dispersion-complete-verified
          retention-days: 90
          if-no-files-found: error
          path: outputs/assurance-dispersion/verified_readout.json
