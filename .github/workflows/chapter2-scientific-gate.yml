name: Chapter 2 scientific gate

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'scripts/model3_island/**'
      - 'scripts/summarize_model3_ch2_bridge_prospective.py'
      - 'scripts/generate_chapter2_unified_model3_figures.py'
      - 'scripts/build_island_ecology_submission_bundle.py'
      - 'scripts/audit_chapter2_submission_closure.py'
      - 'docs/CHAPTER2_**'
      - 'docs/MODEL3_CH2_**'
      - 'data/design/chapter2_*'
      - 'data/design/repository_artifact_budget_20260928.json'
      - 'data/results/model3_ch2_bridge_prospective_frozen_20260927.json'
      - 'tests/test_chapter2_*'
      - 'tests/test_model3_ch2_bridge_prospective_summary.py'
      - 'tests/test_island_ecology_submission_bundle_builder.py'
      - 'tests/test_repository_artifact_budget.py'
      - 'tests/test_current_ci_surface.py'
      - 'tests/test_model2_legacy_firewall.py'
      - 'legacy/model2/**'
      - 'REPRODUCE.md'
      - '.gitignore'
      - '.github/workflows/chapter2-scientific-gate.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scientific-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Validate active unified Model 3 submission surface
        run: |
          pytest -q \
            tests/test_chapter2_mechanistic_funnel.py \
            tests/test_chapter2_realized_richness_reframe.py \
            tests/test_chapter2_branch_identifiability_boundary.py \
            tests/test_chapter2_independent_unit_reporting.py \
            tests/test_chapter2_submission_closure_audit.py \
            tests/test_chapter2_unified_model3_figures.py \
            tests/test_island_ecology_submission_bundle_builder.py \
            tests/test_repository_artifact_budget.py \
            tests/test_current_ci_surface.py \
            tests/test_model2_legacy_firewall.py \
            tests/test_workflow_trigger_policy.py
