name: Acquire Hiraiwa-Ushimaru Dryad data (legacy manual)

on:
  workflow_dispatch:

# The legacy 2017 Dryad bulk-download API currently returns HTTP 401 without
# API credentials. This workflow is intentionally manual-only so the inaccessible
# recovery route cannot create a persistent red PR check. The actively used 2024
# Hiraiwa-Ushimaru source is independently archived on Figshare and has a passing
# reproducible acquisition workflow. Keep this file only as an explicit future
# recovery route for the older workbook; do not treat a failed manual run as an
# evidence result.

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Acquire and unpack legacy Dryad workbook
        run: python scripts/acquire_hiraiwa_ushimaru_dryad.py
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: hiraiwa-ushimaru-dryad-audit
          path: |
            artifacts/hiraiwa_ushimaru_dryad/summary.json
            artifacts/hiraiwa_ushimaru_dryad/sheets/*.csv
