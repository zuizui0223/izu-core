name: Acquire Hiraiwa-Ushimaru Dryad data

on:
  workflow_dispatch:
  push:
    paths:
      - "config/hiraiwa_ushimaru_dryad_source.json"
      - "scripts/acquire_hiraiwa_ushimaru_dryad.py"
      - ".github/workflows/acquire-hiraiwa-ushimaru-dryad.yml"
  pull_request:
    paths:
      - "config/hiraiwa_ushimaru_dryad_source.json"
      - "scripts/acquire_hiraiwa_ushimaru_dryad.py"
      - ".github/workflows/acquire-hiraiwa-ushimaru-dryad.yml"

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Acquire and unpack Dryad workbook
        run: python scripts/acquire_hiraiwa_ushimaru_dryad.py
      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: hiraiwa-ushimaru-dryad-audit
          path: |
            artifacts/hiraiwa_ushimaru_dryad/summary.json
            artifacts/hiraiwa_ushimaru_dryad/sheets/*.csv
