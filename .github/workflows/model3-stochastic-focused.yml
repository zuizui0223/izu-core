name: Model3 stochastic focused
on:
  pull_request:
    paths:
      - 'scripts/audit_model3_stochastic_bridge.py'
      - 'scripts/audit_model3_stochastic_multistep.py'
      - 'scripts/audit_model3_stochastic_measure.py'
      - 'scripts/run_model3_stochastic_measure_preflight.py'
      - 'scripts/audit_model3_stochastic_mutation_scaling.py'
      - 'scripts/audit_model3_stochastic_scaling_limit.py'
      - 'scripts/audit_model3_discrete_linear_noise.py'
      - 'scripts/audit_model3_projected_gaussian_genotypes.py'
      - 'scripts/audit_model3_gaussian_presence_bias.py'
      - 'scripts/audit_model3_gaussian_projection_mechanism.py'
      - 'scripts/run_model3_mutation_multistep_preflight.py'
      - 'scripts/run_model3_sde_spde_preflight.py'
      - 'tests/test_model3_stochastic_bridge.py'
      - 'tests/test_model3_stochastic_multistep.py'
      - 'tests/test_model3_stochastic_measure.py'
      - 'tests/test_model3_stochastic_mutation_scaling.py'
      - 'tests/test_model3_stochastic_scaling_limit.py'
      - 'tests/test_model3_discrete_linear_noise.py'
      - 'tests/test_model3_projected_gaussian_genotypes.py'
      - 'tests/test_model3_gaussian_presence_bias.py'
      - 'tests/test_model3_gaussian_projection_mechanism.py'
      - '.github/workflows/model3-stochastic-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test exact finite noise and three-generation stochastic bridge
        run: pytest -q tests/test_model3_stochastic_bridge.py tests/test_model3_stochastic_multistep.py tests/test_model3_stochastic_measure.py tests/test_model3_stochastic_mutation_scaling.py tests/test_model3_stochastic_scaling_limit.py tests/test_model3_discrete_linear_noise.py tests/test_model3_projected_gaussian_genotypes.py tests/test_model3_gaussian_presence_bias.py tests/test_model3_gaussian_projection_mechanism.py tests/test_model3_tensor_density.py
      - name: Run old-history stochastic moment preflight (engineering only)
        run: python -m scripts.run_model3_sde_spde_preflight --out stochastic-preflight.json --draws 1024
      - name: Run mutation-aware three-update old-history preflight
        run: python -m scripts.run_model3_mutation_multistep_preflight --out mutation-preflight.json --draws 512 --updates 3 --mutation-rate 0.01 --mutation-sd 0.05
      - name: Run independent 3-update mutation-aware genotype measure vs canonical ABM
        run: python -m scripts.run_model3_stochastic_measure_preflight --out measure-preflight.json --draws 512 --updates 3
      - name: Run eight-update atomic-measure distribution stress (same old history)
        run: python -m scripts.run_model3_stochastic_measure_preflight --out measure-horizon8.json --draws 512 --updates 8
      - name: Run eight-update low-resource population-extinction stress
        run: python -m scripts.run_model3_stochastic_measure_preflight --out measure-budget3.json --draws 512 --updates 8 --budget 3
      - name: Audit finite-K small-time scaling prerequisites (same archived history)
        run: python -m scripts.audit_model3_stochastic_scaling_limit --out finite-k-limit-screen.json
      - name: Audit initial shared visitor environment without invented near-far contrast
        run: python -m scripts.audit_model3_stochastic_scaling_limit --out finite-k-initial.json --snapshot-index 0 --near-only
      - name: Verify exact visitor-free counterexample to universal fast-time drift
        run: python -m scripts.audit_model3_stochastic_scaling_limit --out zero-visitor-sde-counterexample.json --zero-visitors-counterexample
      - name: Audit exact discrete-generation investment CLT versus Gaussian normal
        run: python -m scripts.audit_model3_discrete_linear_noise --out finite-offspring-clt.json
      - name: Compare exact vs projected Gaussian genotype distributions at three generations (small K)
        run: python -m scripts.audit_model3_projected_gaussian_genotypes --out genotype-gaussian-k8-g3.json --capacity 8 --budget 3 --generations 3 --draws 512
      - name: Compare exact vs projected Gaussian genotype distributions at eight generations (small K)
        run: python -m scripts.audit_model3_projected_gaussian_genotypes --out genotype-gaussian-k8-g8.json --capacity 8 --budget 3 --generations 8 --draws 512
      - name: Check intermediate K (no biological parameter retuning)
        run: python -m scripts.audit_model3_projected_gaussian_genotypes --out genotype-gaussian-k32-g3.json --capacity 32 --budget 8 --generations 3 --draws 512
      - name: Audit exact genotype-presence expectation against projected Gaussian (K=8,32,128)
        run: python -m scripts.audit_model3_gaussian_presence_bias --out gaussian-presence-bias.json --draws 8192
      - name: Explore Gaussian clipping versus integer rounding mechanism
        run: python -m scripts.audit_model3_gaussian_projection_mechanism --out gaussian-projection-mechanism.json --draws 8192
      - name: Archive engineering moment receipt
        uses: actions/upload-artifact@v4
        with:
          name: model3-stochastic-preflight
          path: |
            stochastic-preflight.json
            mutation-preflight.json
            measure-preflight.json
            measure-horizon8.json
            measure-budget3.json
            finite-k-limit-screen.json
            finite-k-initial.json
            zero-visitor-sde-counterexample.json
            finite-offspring-clt.json
            genotype-gaussian-k8-g3.json
            genotype-gaussian-k8-g8.json
            genotype-gaussian-k32-g3.json
            gaussian-presence-bias.json
            gaussian-projection-mechanism.json
          retention-days: 90
