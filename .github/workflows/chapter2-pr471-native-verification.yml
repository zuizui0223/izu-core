name: PR471 native output verification

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Read-only diagnostic; neither choice produces new random histories'
        type: choice
        default: pr471-native
        options: [pr471-native, independent32-admission]

permissions:
  contents: read

concurrency:
  group: pr471-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source-comparison:
    if: inputs.diagnostic != 'independent32-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout comparison code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: auditor
          persist-credentials: false
      - name: Checkout immutable native model source
        uses: actions/checkout@v4
        with:
          ref: bb150519507c82d75c1ba4bef1d7e9b3d5889b7c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: python -m pip install -e './source[dev]'
      - name: Test comparison failure boundaries
        working-directory: auditor
        run: python -m pytest -q tests/test_verify_chapter2_pr471_native_20261012.py
      - name: Execute original native audit and compare all 480 numbers
        run: |
          python auditor/scripts/verify_chapter2_pr471_native_20261012.py \
            --source-root source \
            --expected-csv auditor/data/results/chapter2_pr471_independent_baseline_20261012.csv \
            --out "$RUNNER_TEMP/pr471-native"
      - name: Preserve native output and source/runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr471-native-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pr471-native/
          if-no-files-found: error
          retention-days: 90

  independent32-admission:
    if: inputs.diagnostic == 'independent32-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pytest==8.4.2
      - run: python -m pytest -q tests/test_independent32_replay_admission_20261013.py
      - name: Read back immutable original summary inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request, zipfile, json
          url='https://github.com/zuizui0223/izu-core/releases/download/four-question-resolution-20261013/independent32_summary_inputs_20261013.zip'
          p=Path('independent32_summary_inputs_20261013.zip')
          urllib.request.urlretrieve(url,p)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3196b295317eeec418d974bb0358d366df898d8a6d1ca29f4facf36c10edbdf8'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('MANIFEST.json'))
              assert len(z.namelist())==11 and len(set(z.namelist()))==11
              assert set(z.namelist())==set(m['sha256'])|{'MANIFEST.json'}
              for name,digest in m['sha256'].items():
                  assert '/' not in name and '\\' not in name
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest
              z.extractall('independent32-inputs')
          PY
      - name: Distinguish frozen numerical agreement from original byte identity
        run: |
          python -m scripts.audit_independent32_replay_admission_20261013 \
            --input independent32-inputs --design independent32-inputs/design.json \
            --frozen independent32-inputs/frozen.json --out outputs/independent32_admission.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('outputs/independent32_admission.json').read_bytes())
          reference=json.loads(Path('data/results/independent32_replay_admission_20261013.json').read_bytes())
          assert actual==reference, 'read-only audit differs from saved technical readback'
          assert actual['numerical_agreement'] and not actual['declared_byte_agreement']
          assert actual['status']=='NUMERICS_MATCH_DECLARED_BYTES_DIVERGE_NOT_ORIGINAL_ADMISSION'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent32-admission-${{ github.run_id }}
          path: outputs/independent32_admission.json
          if-no-files-found: error
          retention-days: 90
