name: PR471 native output verification

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Read-only diagnostic; no choice produces new random histories'
        type: choice
        default: pr471-native
        options: [pr471-native, independent32-admission, genome-response-accounting, persistence-duration-accounting]

permissions:
  contents: read

concurrency:
  group: pr471-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence-duration-accounting:
    if: inputs.diagnostic == 'persistence-duration-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: auditor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb150519507c82d75c1ba4bef1d7e9b3d5889b7c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './source[dev]'
      - name: Test curve accounting and original lifetime identities
        working-directory: auditor
        run: python -m pytest -q tests/test_persistence_duration_accounting_20261013.py tests/test_pr471_fixation_lifetime_20261012.py tests/test_verify_chapter2_pr471_native_20261012.py
      - name: Admit native source then account all96 kernels and48 curves
        run: |
          python auditor/scripts/audit_persistence_duration_accounting_20261013.py \
            --source-root source --expected-csv auditor/data/results/chapter2_pr471_independent_baseline_20261012.csv \
            --lifetime-csv auditor/data/results/pr471_fixation_lifetime_readout_20261012.csv \
            --out "$RUNNER_TEMP/persistence-duration"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-duration-accounting-${{ github.run_id }}
          path: ${{ runner.temp }}/persistence-duration/
          if-no-files-found: error
          retention-days: 90

  native-source-comparison:
    if: inputs.diagnostic == 'pr471-native'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout comparison code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: auditor
          persist-credentials: false
      - name: Checkout immutable native model source
        uses: actions/checkout@v4
        with:
          ref: bb150519507c82d75c1ba4bef1d7e9b3d5889b7c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source dependencies
        run: python -m pip install -e './source[dev]'
      - name: Test comparison failure boundaries
        working-directory: auditor
        run: python -m pytest -q tests/test_verify_chapter2_pr471_native_20261012.py
      - name: Execute original native audit and compare all 480 numbers
        run: |
          python auditor/scripts/verify_chapter2_pr471_native_20261012.py \
            --source-root source \
            --expected-csv auditor/data/results/chapter2_pr471_independent_baseline_20261012.csv \
            --out "$RUNNER_TEMP/pr471-native"
      - name: Preserve native output and source/runtime receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr471-native-source-${{ github.run_id }}
          path: ${{ runner.temp }}/pr471-native/
          if-no-files-found: error
          retention-days: 90

  genome-response-accounting:
    if: inputs.diagnostic == 'genome-response-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 pytest==8.4.2
      - run: python -m pytest -q tests/test_genome_response_accounting_20261013.py
      - name: Read immutable original cohort and source inputs
        run: |
          python - <<'PY'
          import urllib.request, hashlib
          from pathlib import Path
          root='https://github.com/zuizui0223/izu-core/releases/download/atom-cell-inputs-20261011/'
          inputs={'completed_atom_abm_20261011.zip':'7ae00916ed2cbb38323c3fb9ffc5824de3e8272df1f5a35785842c316191f918',
                  'remote_atom_inputs_20261011.zip':'f0fd126f638e1c6bd130e640ce4491b3bb47aac3da1838359a902776c9a4e037'}
          for name,digest in inputs.items():
              urllib.request.urlretrieve(root+name,name)
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest
          PY
      - name: Audit all320 original ABM and64000 genetic-response updates
        run: |
          python scripts/audit_genome_response_accounting_20261013.py \
            --cohort completed_atom_abm_20261011.zip --source-input remote_atom_inputs_20261011.zip \
            --source-dir original-genome-source --out outputs/genome-response-accounting --workers 2
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('outputs/genome-response-accounting/_COMPLETION.json').read_bytes())
          assert r['status']=='COMPLETE_RETROSPECTIVE_320_RESPONSE_ACCOUNTING'
          assert r['cases']==320 and r['audited_updates']==64000 and r['no_new_biological_histories']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genome-response-accounting-${{ github.run_id }}
          path: outputs/genome-response-accounting/
          if-no-files-found: error
          retention-days: 90

  independent32-admission:
    if: inputs.diagnostic == 'independent32-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pytest==8.4.2
      - run: python -m pytest -q tests/test_independent32_replay_admission_20261013.py
      - name: Read back immutable original summary inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request, zipfile, json
          url='https://github.com/zuizui0223/izu-core/releases/download/four-question-resolution-20261013/independent32_summary_inputs_20261013.zip'
          p=Path('independent32_summary_inputs_20261013.zip')
          urllib.request.urlretrieve(url,p)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='3196b295317eeec418d974bb0358d366df898d8a6d1ca29f4facf36c10edbdf8'
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('MANIFEST.json'))
              assert len(z.namelist())==11 and len(set(z.namelist()))==11
              assert set(z.namelist())==set(m['sha256'])|{'MANIFEST.json'}
              for name,digest in m['sha256'].items():
                  assert '/' not in name and '\\' not in name
                  assert hashlib.sha256(z.read(name)).hexdigest()==digest
              z.extractall('independent32-inputs')
          PY
      - name: Distinguish frozen numerical agreement from original byte identity
        run: |
          python -m scripts.audit_independent32_replay_admission_20261013 \
            --input independent32-inputs --design independent32-inputs/design.json \
            --frozen independent32-inputs/frozen.json --out outputs/independent32_admission.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('outputs/independent32_admission.json').read_bytes())
          reference=json.loads(Path('data/results/independent32_replay_admission_20261013.json').read_bytes())
          assert actual==reference, 'read-only audit differs from saved technical readback'
          assert actual['numerical_agreement'] and not actual['declared_byte_agreement']
          assert actual['status']=='NUMERICS_MATCH_DECLARED_BYTES_DIVERGE_NOT_ORIGINAL_ADMISSION'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent32-admission-${{ github.run_id }}
          path: outputs/independent32_admission.json
          if-no-files-found: error
          retention-days: 90
