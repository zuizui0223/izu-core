name: Mahé 2017 IWDB v9 source gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/design/abm_v9_mahe_iwdb_source_gate_v1.json'
      - 'data/design/abm_v9_mahe_iwdb_transport_amendment_v1.json'
      - 'scripts/acquire_audit_mahe_2017_iwdb.py'
      - 'scripts/acquire_audit_mahe_2017_iwdb_retry.py'
      - 'tests/test_mahe_2017_iwdb_source_gate.py'
      - '.github/workflows/mahe_2017_iwdb_source_gate.yml'

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository and legacy Excel reader
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install xlrd==2.0.2
      - name: Run source-only IWDB audit with frozen exact-path host retry
        run: python scripts/acquire_audit_mahe_2017_iwdb_retry.py
      - name: Enforce source-only boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('data/results/mahe_2017_iwdb_source_audit.json'))
          assert x['target_metrics_calculated'] is False
          assert x.get('transport_amendment_used') is True
          print('status', x['status'])
          print('entry attempts', x.get('page_attempts'))
          print('entry sha', x.get('database_entry_sha256'))
          print('excel links', x.get('excel_links'))
          print('source bytes ok', x.get('source_bytes_ok'))
          print('64-network matrix visible', x.get('raw_64_network_matrix_structure_visible'))
          print('representation labels', x.get('representation_labels'))
          print('source admission', x['source_admission_succeeds'])
          for row in x.get('files', []):
              print('FILE', row.get('name'), row.get('transport_attempts'), row.get('bytes'), row.get('sha256'), row.get('inventory_error'))
              print('WORKBOOK', row.get('workbook_inventory'))
          PY
      - name: Run source-gate regression tests
        run: python -m pytest -q tests/test_mahe_2017_iwdb_source_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: mahe-2017-iwdb-v9-source-gate
          path: |
            data/results/mahe_2017_iwdb_source_audit.json
            data/external/mahe_2017_iwdb/**
