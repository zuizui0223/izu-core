name: Chapter 2 source robustness one-off

on:
  pull_request:

jobs:
  audit-mahe-source-structure:
    if: github.head_ref == 'agent/ch2-nee-source-robustness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Recover verified temporal compilation and identify Kaiser-Bunbury 2017
        run: python scripts/audit_seychelles_2017_temporal_compilation_fallback.py
      - name: Verify preserved raw visit/site/month structure
        run: python scripts/audit_seychelles_2017_raw_visit_preservation.py
      - name: Upload Mahe source audits
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-source-robustness-mahe
          path: |
            data/results/seychelles_2017_temporal_compilation_fallback_audit.json
            data/results/seychelles_2017_raw_visit_preservation.json
          if-no-files-found: error
