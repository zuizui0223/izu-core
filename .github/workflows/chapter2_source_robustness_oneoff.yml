name: Chapter 2 source robustness one-off

on:
  pull_request:

jobs:
  audit-giannutri-source-structure:
    if: github.head_ref == 'agent/ch2-nee-source-robustness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Acquire checksum-locked Giannutri source files
        run: python scripts/acquire_audit_giannutri2025_zenodo.py
      - name: Audit frozen 29-day network schedule and walking-transect effort
        run: python scripts/audit_giannutri_natural_regime_source.py
      - name: Upload Giannutri source audits
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-source-robustness-giannutri
          path: |
            data/results/giannutri2025_zenodo_source_audit.json
            data/results/chapter2_giannutri_natural_regime_source_audit_20260914.json
          if-no-files-found: error
