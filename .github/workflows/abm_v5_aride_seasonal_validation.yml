name: ABM v5 Aride seasonal validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/design/abm_v5_aride_seasonal_validation_v1.json'
      - 'scripts/acquire_aride2026_dryad_matrices.py'
      - 'scripts/match_aride2026_to_gift_opportunity.py'
      - 'scripts/run_abm_v5_aride_seasonal_validation.py'
      - 'scripts/run_constraint_mechanism_abm_v5_hierarchical_context.py'
      - 'scripts/run_abm_v4_weighted_architecture_emulator.py'
      - 'data/results/frozen_candidate_gift_geography_match.json'
      - 'data/results/frozen_dore_network_targets.csv'
      - 'tests/test_abm_v5_aride_seasonal_validation.py'
      - '.github/workflows/abm_v5_aride_seasonal_validation.yml'

concurrency:
  group: abm-v5-aride-seasonal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Acquire or record access block for exact Dryad matrices
        run: python scripts/acquire_aride2026_dryad_matrices.py
      - name: Inspect source admission
        id: source_gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('data/results/aride2026_dryad_source_lock.json'))
          print('ready=' + ('true' if x['all_required_files_recovered'] else 'false'))
          print('status=' + x['status'])
          PY
      - name: Lock held-out Aride GIFT opportunity input
        if: steps.source_gate.outputs.ready == 'true'
        run: python scripts/match_aride2026_to_gift_opportunity.py
      - name: Run frozen held-out v5 validation
        run: python scripts/run_abm_v5_aride_seasonal_validation.py
      - name: Run focused freeze and parser tests
        run: python -m pytest -q tests/test_abm_v5_aride_seasonal_validation.py
      - name: Show validation or source-block decision
        run: |
          python - <<'PY'
          import json, pathlib
          source=json.load(open('data/results/aride2026_dryad_source_lock.json'))
          result=json.load(open('data/results/abm_v5_aride_seasonal_validation.json'))
          print('source status', source['status'])
          print('source lock', source['all_required_files_recovered'])
          print('source attempts', source.get('attempts'))
          print('decision', result['decision'])
          print('target metrics inspected', result.get('target_metrics_inspected', True))
          geo_path=pathlib.Path('data/results/aride2026_gift_opportunity_lock.json')
          if geo_path.exists():
              geo=json.load(open(geo_path))
              print('geography status', geo['status'])
              print('geography selected', geo.get('selected'))
              print('isolation index', geo.get('isolation_index'))
          print('empirical', result.get('empirical'))
          print('predictive envelopes', {
              'interaction_shannon': result.get('predictive', {}).get('interaction_shannon_range_envelope'),
              'plant_niche_overlap': result.get('predictive', {}).get('plant_niche_overlap_range_envelope'),
          })
          print('tests', result.get('tests'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: abm-v5-aride-seasonal-validation
          path: |
            data/results/aride2026_dryad_source_lock.json
            data/results/aride2026_gift_opportunity_lock.json
            data/results/abm_v5_aride_seasonal_validation.json
            data/external/aride_2026/**
