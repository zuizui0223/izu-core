name: Chapter 2 fixed B48 source-authenticated posthoc pathway audit once

on:
  push:
    branches:
      - chapter2/k-fixedB48-confirmed-pathways-posthoc-20261009
    paths:
      - data/dispatch/k-fixedB48-posthoc-pathways-launch-20261009.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter2-fixedB48-readonly-pathways-20261009
  cancel-in-progress: false

jobs:
  audit-without-any-new-biology:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Test read-only 64-history reductions on synthetic cells only
        run: pytest -q tests/test_chapter2_k_fixedB48_posthoc_pathways.py
      - name: Require original source and full audited future runs to be unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          biological=$(gh api "repos/$REPO/actions/runs/37896872795")
          readout=$(gh api "repos/$REPO/actions/runs/37900150213")
          test "$(echo "$biological" | jq -r .head_sha)" = "2737736f1dca36c8b43e9ac6a9fbd862ca21165b"
          test "$(echo "$readout" | jq -r .head_sha)" = "592cdad7fa0442a26fd5e79a2fd94812d4515c5d"
          test "$(echo "$biological" | jq -r .conclusion)" = "success"
          test "$(echo "$readout" | jq -r .conclusion)" = "success"
      - uses: actions/download-artifact@v4
        with:
          name: chapter2-k48-new64-t400-full-admission
          path: admitted-source
          run-id: 37896872795
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enumerate all 64 exact immutable futures artifact IDs across both pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/37896872795/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("chapter2-k48-future-shard-")) | [.id, .name] | @tsv' > raw-futures.tsv
          python - <<'PY'
          from pathlib import Path
          rows=[line.split("\t") for line in Path("raw-futures.tsv").read_text().splitlines()]
          assert len(rows)==64
          assert len(set(int(x[0]) for x in rows))==64
          assert set(x[1] for x in rows)=={f"chapter2-k48-future-shard-{i}" for i in range(64)}
          PY
      - name: Fetch every archived original future ZIP by immutable GitHub artifact ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-64-futures
          while read -r artifact_id artifact_name; do
            shard="${artifact_name##*-}"
            index=$(printf '%02d' "$shard")
            mkdir -p "original-64-futures/$artifact_name"
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$artifact_id/zip" \
              --output "original-$shard.zip"
            unzip -tq "original-$shard.zip" >/dev/null
            unzip -q "original-$shard.zip" -d "original-64-futures/$artifact_name"
            test -f "original-64-futures/$artifact_name/k48_future_shard_$index.json"
            test "$(find "original-64-futures/$artifact_name" -type f | wc -l)" -eq 65
            rm "original-$shard.zip"
          done < raw-futures.tsv
          test "$(find original-64-futures -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 64
      - name: Reauthenticate ALL 114688 original futures and audit demographic pathways
        run: |
          python -m scripts.chapter2_k_fixedB48_posthoc_pathways \
            --futures original-64-futures \
            --source-admission admitted-source/k48-full-t400-admission.json \
            --frozen-result results/chapter2/k_fixedB48_independent_primary_20261009.json \
            --out posthoc-k-fixedB48-pathways-20261009.json \
            --execute-readonly-audit \
            | tee posthoc-k-fixedB48-pathways-console.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chapter2-fixedB48-independent-posthoc-demographic-pathways-20261009
          path: |
            posthoc-k-fixedB48-pathways-20261009.json
            posthoc-k-fixedB48-pathways-console.txt
          retention-days: 90
          if-no-files-found: error
