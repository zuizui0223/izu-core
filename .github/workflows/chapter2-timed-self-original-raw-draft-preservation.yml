name: Chapter 2 timed original raw cohort preservation (unpublished)
on:
  push:
    branches:
      - chapter2/timed-self-raw-draft-preservation-20261010
    paths:
      - data/dispatch/timed-self-raw-draft-launch-20261010.txt
permissions:
  contents: write
  actions: read
concurrency:
  group: chapter2-timed-self-raw-original-preservation
  cancel-in-progress: false
jobs:
  preserve-130-original-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all exact original source and future ZIPs and prove SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -m scripts.archive_chapter2_timed_raw_originals \
            --study timed --out preserved/timed --execute-original-draft-archive
      - name: Create unpublished draft Release (not a public DOI deposit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=chapter2-timed-self-raw-20261009-v1
          echo 'UNPUBLISHED full original timed postzygotic experiment raw archives: 64 independent visitor histories, 2048 t400 full diploid sources, 229376 future trajectories, 130 SHA-256-authenticated original Actions artifact ZIPs. Original run 37944527799, SHA e679e0ee190fa02e0a9d60876cd1a3e9987a4c79. Frozen primary late-minus-early is INCONCLUSIVE. This GitHub draft is not a public DOI-bearing external archive.' > preserved/timed/notes.txt
          main_sha=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          gh release create "$TAG" --draft --target "$main_sha" \
            --title "Chapter 2 timed self viability 64-history raw cohort (unpublished)" \
            --notes-file preserved/timed/notes.txt
      - name: Upload exact raw ZIP tar plus source manifest and immutable receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=chapter2-timed-self-raw-20261009-v1
          gh release upload "$TAG" \
            preserved/timed/chapter2-timed-130-original-shard-artifacts.tar \
            preserved/timed/timed-raw-130-manifest.json \
            preserved/timed/timed-archive-receipt.json
          gh release view "$TAG" --json isDraft,assets > preserved/timed/draft-release-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("preserved/timed/draft-release-status.json").read_text())
          assert d["isDraft"] is True
          expected={"chapter2-timed-130-original-shard-artifacts.tar",
                    "timed-raw-130-manifest.json","timed-archive-receipt.json"}
          assert {a["name"] for a in d["assets"]}==expected
          PY
      - name: Independently re-download draft Release raw archive and verify all 130 ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p verified-timed
          gh release download chapter2-timed-self-raw-20261009-v1 \
            --pattern 'chapter2-timed-130-original-shard-artifacts.tar' \
            --dir verified-timed
          python - <<'PY'
          import tarfile,json,hashlib
          from pathlib import Path
          p=Path("verified-timed/chapter2-timed-130-original-shard-artifacts.tar")
          manifest=json.loads(Path("preserved/timed/timed-raw-130-manifest.json").read_text())
          receipt=json.loads(Path("preserved/timed/timed-archive-receipt.json").read_text())
          assert receipt["members_expected"]==131
          assert receipt["archive_sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert manifest["frozen_primary_verdict"]=="inconclusive"
          assert manifest["future_trajectories"]==229376
          with tarfile.open(p) as tar:
              names=tar.getnames()
              assert len(names)==131
              assert len([x for x in names if x.startswith("original-zip-artifacts/") and x.endswith(".zip")])==130
          print("SUCCESS: all 130 original ZIPs preserved and byte-checksum-matched after independent draft Release download")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter2-timed-original-raw-draft-preservation-receipts
          path: |
            preserved/timed/timed-archive-receipt.json
            preserved/timed/timed-raw-130-manifest.json
            preserved/timed/draft-release-status.json
          retention-days: 90
          if-no-files-found: warn
