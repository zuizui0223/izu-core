name: Real-data scale registry

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build current registry
        run: python scripts/build_real_data_scale_registry.py --out artifacts/real_data_scale_registry.json
      - name: Verify checked registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          generated=json.loads(Path('artifacts/real_data_scale_registry.json').read_text())
          checked=json.loads(Path('data/results/real_data_scale_registry.json').read_text())
          assert generated == checked
          PY
      - name: Upload generated registry
        uses: actions/upload-artifact@v4
        with:
          name: real-data-scale-registry
          path: artifacts/real_data_scale_registry.json
          if-no-files-found: error
