name: Independent primary-source acquisition gate

on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependency
        run: python -m pip install -e . pytest
      - name: Test acquisition and admission gates
        run: python -m pytest -q tests/test_independent_source_acquisition.py
      - name: Build acquisition readiness report
        run: python scripts/audit_independent_source_acquisition.py
      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: independent-primary-source-acquisition
          path: artifacts/independent_source_acquisition/summary.json
