name: Campanula volcanic history adversary

on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test volcanic history adversary
        run: python -m pytest -q tests/test_campanula_volcanic_history_adversary.py
      - name: Run volcanic history adversary
        run: python paper/run_campanula_volcanic_history_adversary.py
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: campanula-volcanic-history-adversary
          path: artifacts/campanula_volcanic_history_adversary/
