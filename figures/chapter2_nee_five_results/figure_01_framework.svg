<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Figure 1. From founding state to future floral options</title><desc>Source-linked editorial display; evidence ranks and cohorts remain separate.</desc><metadata>{&quot;kind&quot;: &quot;conceptual&quot;, &quot;source&quot;: &quot;scripts/model3_island/reproduction.py&quot;}</metadata><rect width="1200" height="650" fill="white"/><text x="40" y="45" font-size="27" fill="#233447" font-family="Arial, sans-serif">Figure 1. From founding state to future floral options</text><text x="40" y="90" font-size="23" fill="#233447" font-family="Arial, sans-serif">Which responses are predictable, and which options remain?</text><rect x="40" y="140" width="360" height="155" rx="12" fill="#f8e9d7"/><text x="58" y="180" font-size="25" fill="#233447" font-family="Arial, sans-serif">Assurance A</text><text x="58" y="222" font-size="18" fill="#233447" font-family="Arial, sans-serif">Autonomous selfing capacity</text><text x="58" y="258" font-size="18" fill="#233447" font-family="Arial, sans-serif">Buffers unfilled ovules</text><rect x="430" y="140" width="360" height="155" rx="12" fill="#dceee7"/><text x="448" y="180" font-size="25" fill="#233447" font-family="Arial, sans-serif">Matching M</text><text x="448" y="222" font-size="18" fill="#233447" font-family="Arial, sans-serif">Fit to visitor optima</text><text x="448" y="258" font-size="18" fill="#233447" font-family="Arial, sans-serif">History-specific matching</text><rect x="820" y="140" width="360" height="155" rx="12" fill="#dce8f3"/><text x="838" y="180" font-size="25" fill="#233447" font-family="Arial, sans-serif">Investment I</text><text x="838" y="222" font-size="18" fill="#233447" font-family="Arial, sans-serif">Allocation to attraction</text><text x="838" y="258" font-size="18" fill="#233447" font-family="Arial, sans-serif">Reproductive return versus cost</text><text x="40" y="350" font-size="21" fill="#233447" font-family="Arial, sans-serif">ARRIVAL: inherited alleles bound accessible responses.</text><text x="40" y="400" font-size="21" fill="#233447" font-family="Arial, sans-serif">AFTER ARRIVAL (R1-R3): separate responses interact and differ in repeatability.</text><text x="40" y="450" font-size="21" fill="#233447" font-family="Arial, sans-serif">LATER (R4-R5): persistence, ancestral recovery and new responses differ.</text><text x="40" y="500" font-size="21" fill="#233447" font-family="Arial, sans-serif">Read the five results as interventions and bounded extensions, not one causal chain.</text><text x="40" y="575" font-size="18" fill="#233447" font-family="Arial, sans-serif">Conceptual framework; links are not estimated causal mediation.</text></svg>