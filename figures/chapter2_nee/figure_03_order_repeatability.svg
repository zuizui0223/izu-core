<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="915" viewBox="0 0 1500 915" role="img"><title>Figure 3. Evolutionary sequence and finite realization</title><desc>Registered chronology and inconclusive I-carrier contrasts, independent 128-history finite versus deterministic responses, and genetically inaccessible target counts in a separate 2304-history cohort.</desc><metadata id="source-lock">{&quot;sources&quot;:{&quot;sequence&quot;:&quot;data/results/chapter2_1005_confirmatory_replication_20261006.json&quot;,&quot;q2&quot;:&quot;docs/audits/CHAPTER2_Q2_I_SUPPORT_384_ORIGINAL_READOUT_20261016.json&quot;,&quot;bridge&quot;:&quot;data/results/model3_ch2_bridge_prospective_frozen_20260927.json&quot;,&quot;access&quot;:&quot;data/results/directional_access_20261013/READOUT.json&quot;},&quot;interpretation&quot;:&quot;No retrospective Q1-Q4 causal mediation; no drift attribution&quot;,&quot;denominators&quot;:{&quot;seq&quot;:64,&quot;bridge&quot;:128,&quot;access&quot;:2304,&quot;first_exclusions&quot;:1238}}</metadata><rect x="0" y="0" width="1500" height="915" fill="white" /><text x="50" y="49" font-size="28" text-anchor="start" fill="#1b2f3c" font-weight="bold">Figure 3 · Q2 sequence versus Q3 finite realization</text><text x="50" y="81" font-size="15" text-anchor="start" fill="#5c6f7e" font-weight="normal">Four source cohorts remain separate; event order, simulated investment response and allele loss have different denominators</text><text x="62" y="133" font-size="20" text-anchor="start" fill="#1b2f3c" font-weight="bold">A · Observed A-first order (64 histories each)</text><text x="762" y="133" font-size="20" text-anchor="start" fill="#1b2f3c" font-weight="bold">B · Registered I-carrier effects (both inconclusive)</text><rect x="153" y="210.65625" width="115" height="167.34375" fill="#cb704b" data-kind="chronology" data-setting="assurance_cost" data-count="51" data-denom="64"/><text x="211" y="197.65625" font-size="18" text-anchor="middle" fill="#1b2f3c" font-weight="bold">51/64</text><text x="211" y="408" font-size="16" text-anchor="middle" fill="#5c6f7e" font-weight="normal">Delayed/cost</text><rect x="355" y="279.5625" width="115" height="98.4375" fill="#285b85" data-kind="chronology" data-setting="prior_selfing" data-count="30" data-denom="64"/><text x="413" y="266.5625" font-size="18" text-anchor="middle" fill="#1b2f3c" font-weight="bold">30/64</text><text x="413" y="408" font-size="16" text-anchor="middle" fill="#5c6f7e" font-weight="normal">Prior selfing</text><line x1="1117.1612903225807" y1="181" x2="1117.1612903225807" y2="384" stroke="#5c6f7e" stroke-width="2"/><text x="765" y="249" font-size="18" text-anchor="start" fill="#1c2e3f" font-weight="normal">Order score</text><line x1="1032.483870967742" y1="244" x2="1350.024193548387" y2="244" stroke="#1b2f3c" stroke-width="3"/><circle cx="1191.2540322580646" cy="244" r="8" fill="#cb704b" data-kind="q2" data-endpoint="carrier_order_score_delta" data-value="0.109375" data-low="-0.125" data-high="0.34375"/><text x="1190" y="275" font-size="15" text-anchor="middle" fill="#5c6f7e" font-weight="normal">0.109 [-0.125, 0.344]</text><text x="765" y="361" font-size="18" text-anchor="start" fill="#1c2e3f" font-weight="normal">I-event incidence</text><line x1="1074.8225806451612" y1="356" x2="1402.9475806451615" y2="356" stroke="#1b2f3c" stroke-width="3"/><circle cx="1244.1774193548388" cy="356" r="8" fill="#cb704b" data-kind="q2" data-endpoint="carrier_I_event_delta" data-value="0.1875" data-low="-0.0625" data-high="0.421875"/><text x="1190" y="387" font-size="15" text-anchor="middle" fill="#5c6f7e" font-weight="normal">0.188 [-0.063, 0.422]</text><text x="763" y="428" font-size="15" text-anchor="start" fill="#cb704b" font-weight="normal">Confidence intervals cross zero: do not promote carrier density to a mechanism.</text><text x="60" y="498" font-size="20" text-anchor="start" fill="#1b2f3c" font-weight="bold">C · Far−near floral-investment response in Q3 bridge (128 visitor histories)</text><line x1="695" y1="525" x2="695" y2="780" stroke="#5c6f7e" stroke-width="2"/><text x="64" y="569" font-size="16" text-anchor="start" fill="#1c2e3f" font-weight="normal">Natural · density</text><rect x="311.66439680363993" y="549" width="383.33560319636007" height="30" fill="#285b85" data-kind="q3_response" data-intervention="natural" data-model="density" data-mean="-0.45098306258395304" data-mixed="0" data-denom="128"/><text x="298.66439680363993" y="570" font-size="14" text-anchor="end" fill="#1b2f3c" font-weight="normal">-0.451  (0/128 mixed)</text><text x="64" y="636" font-size="16" text-anchor="start" fill="#1c2e3f" font-weight="normal">Natural · finite ABM</text><rect x="572.0596652560764" y="616" width="122.94033474392359" height="30" fill="#cb704b" data-kind="q3_response" data-intervention="natural" data-model="individual" data-mean="-0.1446356879340278" data-mixed="12" data-denom="128"/><text x="559.0596652560764" y="637" font-size="14" text-anchor="end" fill="#1b2f3c" font-weight="normal">-0.145  (12/128 mixed)</text><text x="64" y="703" font-size="16" text-anchor="start" fill="#1c2e3f" font-weight="normal">Count matched · density</text><rect x="695" y="683" width="28.69373965508646" height="30" fill="#285b85" data-kind="q3_response" data-intervention="richness_matched" data-model="density" data-mean="0.03375734077068991" data-mixed="16" data-denom="128"/><text x="732.6937396550865" y="704" font-size="14" text-anchor="start" fill="#1b2f3c" font-weight="normal">0.034  (16/128 mixed)</text><text x="64" y="770" font-size="16" text-anchor="start" fill="#1c2e3f" font-weight="normal">Count matched · finite ABM</text><rect x="695" y="750" width="28.324254353841184" height="30" fill="#cb704b" data-kind="q3_response" data-intervention="richness_matched" data-model="individual" data-mean="0.0333226521809896" data-mixed="68" data-denom="128"/><text x="732.3242543538412" y="771" font-size="14" text-anchor="start" fill="#1b2f3c" font-weight="normal">0.033  (68/128 mixed)</text><text x="64" y="842" font-size="16" text-anchor="start" fill="#5c6f7e" font-weight="normal">Count matching also changes identity persistence; density is not the stochastic expectation of ABM.</text><text x="848" y="498" font-size="20" text-anchor="start" fill="#1b2f3c" font-weight="bold">D · I allele support loss in a separate 2,304-history cohort</text><rect x="865" y="564" width="159.88368055555554" height="51" fill="#cb704b" data-kind="q3_access" data-category="before-fixation" data-count="703" data-denom="2304"/><text x="944.9418402777778" y="596" font-size="17" text-anchor="middle" fill="white" font-weight="bold">703</text><rect x="1024.8836805555557" y="564" width="121.67534722222223" height="51" fill="#285b85" data-kind="q3_access" data-category="at-fixation" data-count="535" data-denom="2304"/><text x="1085.7213541666667" y="596" font-size="17" text-anchor="middle" fill="white" font-weight="bold">535</text><rect x="1146.5590277777778" y="564" width="242.44097222222223" height="51" fill="#e7edf0" data-kind="q3_access" data-category="not-excluded" data-count="1066" data-denom="2304"/><text x="1267.779513888889" y="596" font-size="17" text-anchor="middle" fill="#1b2f3c" font-weight="bold">1,066</text><text x="867" y="639" font-size="15" text-anchor="start" fill="#5c6f7e" font-weight="normal">Before fixation: 703   ·   At fixation: 535   ·   No recorded exclusion: 1,066</text><text x="848" y="710" font-size="19" text-anchor="start" fill="#1b2f3c" font-weight="bold">E · First exclusions, conditional on 1,238 already selected transitions</text><rect x="865" y="738" width="133.32794830371566" height="50" fill="#338979" data-kind="q3_selected" data-category="favorable-but-lost" data-count="315" data-denom="1238"/><rect x="998.3279483037156" y="738" width="390.67205169628437" height="50" fill="#e7edf0" data-kind="q3_selected" data-category="other-first-exclusions" data-count="923" data-denom="1238"/><text x="931.6639741518578" y="769" font-size="17" text-anchor="middle" fill="white" font-weight="bold">315</text><text x="1193.663974151858" y="769" font-size="17" text-anchor="middle" fill="#1b2f3c" font-weight="bold">923</text><text x="848" y="814" font-size="15" text-anchor="start" fill="#5c6f7e" font-weight="normal">Favorable expected allele weighting did not guarantee realized transmission in 315 cases.</text><text x="62" y="883" font-size="15" text-anchor="start" fill="#5c6f7e" font-weight="normal">Q3 bridge, Q3 access, Q2 sequence and registered Q2 carrier tests are not replicated draws from one cohort or an identified mediation chain.</text></svg>
